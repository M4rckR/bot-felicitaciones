        // Lleva el scroll del panel a "destino(body)". Con suave, se desplaza con
        // animacion (Marco, 2026-09-14: el salto directo se sentia brusco); si el
        // usuario pide menos movimiento, o el navegador no soporta scrollTo con
        // opciones, cae al salto directo. El destino se calcula dentro de un rAF
        // para medir con el DOM ya pintado, y el suave se lanza una sola vez: si
        // se relanzara en cada frame como el directo, reiniciaria su animacion.
        Bot.prototype.desplazarBody = function (destino, suave) {
            var body = this.el.body;
            if (!body) return;

            var usarSuave = !!suave && !this.prefiereMenosMovimiento() &&
                typeof body.scrollTo === "function";

            var directo = function () {
                body.scrollTop = Math.max(0, destino(body));
            };

            if (!usarSuave) {
                directo();
                requestAnimationFrame(directo);
                requestAnimationFrame(function () {
                    directo();
                });
                return;
            }

            requestAnimationFrame(function () {
                var top = Math.max(0, destino(body));
                try {
                    body.scrollTo({ top: top, behavior: "smooth" });
                } catch (e) {
                    body.scrollTop = top;
                }
            });
        };

        Bot.prototype.scrollBodyToBottom = function (suave) {
            this.desplazarBody(function (body) {
                return body.scrollHeight;
            }, suave);
        };

        Bot.prototype.adjustChatScroll = function (node) {
            if (this.scrollState && this.scrollState.suppressAdjustOnce) {
                this.scrollState.suppressAdjustOnce = false;
                return;
            }

            // During waiting transitions, keep the latest UI (thinking + new action)
            if (this.isWaiting()) {
                this.scrollBodyToBottom(true);
                return;
            }

            // Una respuesta nueva se muestra desde su inicio, no desde el final
            // (Marco, 2026-09-14): bajar hasta el fondo dejaba al usuario frente al
            // menu sin haber leido nada de lo de arriba.
            var log = this.state.chatLog;
            var ultimo = log.length ? log[log.length - 1] : null;
            if (
                ultimo &&
                ultimo.role === "bot" &&
                !this.state.errorRecovery &&
                !this.state.runtimeError
            ) {
                this.scrollBodyToLatestBotStart(true);
                return;
            }

            this.scrollBodyToBottom(true);
        };

        // Deja arriba del panel la opcion que eligio el usuario y, debajo, el
        // inicio de la respuesta (Marco, 2026-09-14). Se mide la fila del bot
        // (.tc0091-chat-bot-row), que no se anima, y se le resta la altura de la
        // burbuja del usuario con offsetHeight: esa burbuja entra con un transform
        // de escala que falsea su getBoundingClientRect, pero no su offsetHeight.
        Bot.prototype.scrollBodyToLatestBotStart = function (suave) {
            this.desplazarBody(function (body) {
                var filas = body.querySelectorAll(".tc0091-chat-bot-row");
                var fila = filas.length ? filas[filas.length - 1] : null;
                if (!fila) return body.scrollHeight;

                var margen = parseFloat(window.getComputedStyle(body).paddingTop) || 0;
                var top = fila.getBoundingClientRect().top -
                    body.getBoundingClientRect().top +
                    body.scrollTop -
                    margen;

                var anterior = fila.previousElementSibling;
                if (anterior && anterior.classList.contains("tc0091-chat-item--user")) {
                    top -= anterior.offsetHeight +
                        (parseFloat(window.getComputedStyle(fila).marginTop) || 0);
                }
                return top;
            }, suave);
        };

        Bot.prototype.goTo = function (id, selectedLabel, meta) {
            var opts = meta || {};

            if (!this.getNode(id)) {
                this.handleMissingNextNodeError(id, "goTo");
                return;
            }

            if (this.isWaiting()) {
                if (!opts.allowWhileWaiting) return;
                this.cancelWaitingTransition();
            }

            if (selectedLabel && !opts.suppressUserBubble) {
                this.state.chatLog.push({ role: "user", text: selectedLabel });
            }

            if (this.shouldUseThinking()) {
                this.startWaitingTransition(id, selectedLabel);
                return;
            }

            this.applyTransition(id);
        };

        // duracionMs es opcional: solo lo pasa la apertura del bot, que usa su propia
        // espera (mas corta). El resto de las transiciones usan durationMs.
        Bot.prototype.startWaitingTransition = function (id, label, duracionMs) {
            if (!this.getNode(id)) {
                this.handleMissingNextNodeError(id, "startWaitingTransition");
                return;
            }

            this.cancelWaitingTransition();
            this.transitionState.waiting = true;
            this.transitionState.pendingNextId = id;
            this.transitionState.pendingLabel = label || "";
            this.transitionState.pendingUsageBubble = null;
            this.render();

            var self = this;
            this.transitionState.timerId = setTimeout(function () {
                var nextId = self.transitionState.pendingNextId;
                self.cancelWaitingTransition();
                if (!nextId) return;
                self.applyTransition(nextId);
            }, Number.isFinite(Number(duracionMs)) ? Number(duracionMs) : this.getThinkingDuration());
        };

        Bot.prototype.createUsageSupportMessage = function (node, linkedQuestionMessageId) {
            if (!node || !node.usageMenuOption || !node.usageMenuOption.next) return null;

            return {
                messageId: this.state.nextMessageId++,
                role: "bot",
                nodeId: node.id,
                nodeType: "question-usage",
                allowOptionsWhileLinked: false,
                linkedQuestionMessageId: linkedQuestionMessageId,
                bubbleClass: node.usageSupportClassName || "tc0091-node-usage-option",
                title: "",
                text: node.usageSupportText || "",
                options: [
                    {
                        label: node.usageMenuOption.label,
                        next: node.usageMenuOption.next,
                        href: "",
                        target: "",
                        isCta: false,
                    },
                ],
            };
        };

        Bot.prototype.startWaitingUsageBubble = function (usageMessage) {
            if (!usageMessage) return;

            this.cancelWaitingTransition();
            this.transitionState.waiting = true;
            this.transitionState.pendingNextId = null;
            this.transitionState.pendingLabel = "";
            this.transitionState.pendingUsageBubble = usageMessage;

            var self = this;
            this.transitionState.timerId = setTimeout(function () {
                var pendingUsageBubble = self.transitionState.pendingUsageBubble;
                self.cancelWaitingTransition();
                if (!pendingUsageBubble) return;
                self.state.chatLog.push(pendingUsageBubble);
                self.render();
            }, this.getThinkingDuration());
        };

        Bot.prototype.applyTransition = function (id) {
            if (!this.getNode(id)) {
                this.handleMissingNextNodeError(id, "applyTransition");
                return;
            }

            this.clearRuntimeError();
            this.state.missingNextErrorCount = 0;
            this.state.current = id;
            this.appendBotMessageForCurrent();
            this.render();
        };

        Bot.prototype.appendBotMessageForCurrent = function () {
            var node = this.getNode(this.state.current);
            if (!node) return;

            var self = this;

            if ((node.options || []).some(this.hasCloseOption)) {
                this.trackCloseView();
            }

            // El perfilador resuelve su contenido AQUI, al construir el mensaje, no
            // al pintarlo: asi el intro y las tarjetas quedan congelados en el
            // chatLog y el historial no se reescribe si cambia el DOM despues. La
            // tabla del comparador se resuelve en el mismo punto y por lo mismo.
            var perfilado = node.perfilador ? this.resolvePerfilador(node.perfilador) : null;
            var comparado = node.comparador ? this.resolveComparador(node.comparador) : null;

            var botMessage = {
                messageId: this.state.nextMessageId++,
                role: "bot",
                nodeId: node.id,
                nodeType: node.type || "",
                richText: !!node.richText || !!node.comparador,
                allowOptionsWhileLinked: !!node.usageMenuOption,
                linkedQuestionMessageId: null,
                bubbleClass: node.className || "",
                // El saludo con el nombre del cliente se resuelve aqui, igual que el
                // perfilador y el comparador: queda congelado en el snapshot y el
                // historial no se reescribe si la pagina cambia despues.
                title: this.resolveTitulo(node),
                text: perfilado ? perfilado.intro : (comparado ? comparado.text : (node.text || "")),
                // La lista de tarjetas, la tarjeta recomendada y el texto que precede
                // al menu viajan en el snapshot como todo lo demas: el historial no se
                // reescribe luego.
                cards: perfilado ? perfilado.tarjetas : (node.cards || null),
                // La llamada al pie de la tabla viaja congelada como todo lo
                // demas: si manana cambian las tarjetas del DOM, el mensaje ya
                // pintado no se reescribe.
                nota: comparado ? comparado.nota : "",
                // La del perfilador va en otro campo porque se pinta en otro sitio:
                // encima del aviso azul, no pegada a la tabla.
                notaPerfilador: perfilado ? perfilado.nota : "",
                recommendation: this.resolveRecommendation(node),
                aviso: node.aviso || "",
                menuText: node.menuText || "",
                options: (node.options || []).map(function (o) {
                    return {
                        label: self.resolveOptionLabel(o),
                        next: o.next,
                        href: o.href,
                        target: o.target,
                        isCta: !!o.isCta,
                        isClose: !!o.isClose,
                    };
                }),
            };

            this.state.chatLog.push(botMessage);

            // Va despues de armar el mensaje, no antes: las tarjetas del perfilador
            // recien existen aqui, cuando resolvePerfilador ya corrio.
            if (this.tieneCtaElegirTarjeta(botMessage)) {
                this.trackElegirTarjetaView();
            }

            if (botMessage.options.length) {
                this.state.activeQuestionMessageId = botMessage.messageId;
            } else {
                this.state.activeQuestionMessageId = null;
            }

            if (node.usageMenuOption && node.usageMenuOption.next) {
                var usageMessage = this.createUsageSupportMessage(node, botMessage.messageId);
                if (usageMessage) {
                    if (this.shouldUseThinking()) {
                        this.startWaitingUsageBubble(usageMessage);
                    } else {
                        this.state.chatLog.push(usageMessage);
                    }
                }
            }
        };

        Bot.prototype.createErrorComponentMarkup = function (errorConfig) {
            var cfg = errorConfig || {};
            var text = this.escapeHtml(cfg.text || "Ocurrió un error inesperado.");
            var action = this.escapeHtml(cfg.action || "goto-start");
            var buttonLabel = this.escapeHtml(cfg.buttonLabel || "Ir al inicio");

            return (
                '<div class="tc0091-error-message">' +
                '<span class="tc0091-error-icon">⚠</span>' +
                '<div class="tc0091-error-content">' +
                '<p class="tc0091-error-text">' +
                text +
                "</p>" +
                '<button class="tc0091-error-retry" type="button" data-runtime-error-action="' +
                action +
                '">' +
                buttonLabel +
                "</button>" +
                "</div>" +
                "</div>"
            );
        };

        Bot.prototype.createMissingNextErrorMarkup = function () {
            var runtimeError = this.state.runtimeError || {};
            return this.createErrorComponentMarkup({
                text:
                    runtimeError.text ||
                    "No pudimos continuar esta ruta en este momento.",
                action: "retry-missing-next",
                buttonLabel: "Reintentar",
            });
        };

        Bot.prototype.escapeHtml = function (value) {
            return String(value)
                .replace(/&(?!#\d+;|#[xX][0-9a-fA-F]+;|[a-zA-Z]+;)/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        };

        // Escapado ESTRICTO, para datos que vienen de la pagina y no de config.
        //
        // No usar escapeHtml para esto: aquel preserva a proposito las entidades ya
        // escritas (&#128075; y demas), porque la copy del bot las trae a mano. Eso
        // lo vuelve inseguro para un valor que no controlamos. Aqui se escapa TODO
        // "&", sin excepciones, y el resultado se puede concatenar en el HTML.
        Bot.prototype.escaparDatoDePagina = function (value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        };

        Bot.prototype.formatInlineRichText = function (value) {
            var escaped = this.escapeHtml(value || "");
            return escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        };

        // Texto plano en parrafos. Recibe el valor YA escapado.
        // Dos niveles de separacion, ninguno con <br>:
        //   - linea en blanco  -> parrafo nuevo, 16px de aire (.tc0091-text-line)
        //   - salto simple     -> renglon pegado, sin aire (.tc0091-text-row,
        //                         un span display:block, igual que las dos
        //                         lineas del saludo del launcher)
        // El salto simple existe porque los mockups encadenan frases sin
        // espacio entre ellas y reservan el aire para separar bloques de idea.
        Bot.prototype.formatPlainText = function (escapedValue) {
            var bloques = String(escapedValue || "").split(/\n[ \t]*\n/);
            var html = "";

            bloques.forEach(function (bloque) {
                var renglones = [];

                bloque.split("\n").forEach(function (linea) {
                    var texto = linea.trim();
                    if (texto) renglones.push(texto);
                });

                if (!renglones.length) return;

                html += '<p class="tc0091-text-line">';
                renglones.forEach(function (texto) {
                    html += '<span class="tc0091-text-row">' + texto + "</span>";
                });
                html += "</p>";
            });

            return html;
        };

        Bot.prototype.formatRichText = function (value) {
            var source = String(value || "").replace(/\r\n/g, "\n");
            var lines = source.split("\n");
            var htmlParts = [];
            var inList = false;
            var filasTabla = [];
            var self = this;

            function closeList() {
                if (!inList) return;
                htmlParts.push("</ul>");
                inList = false;
            }

            // Tabla estilo markdown: la primera fila es la cabecera y la fila
            // de guiones se descarta. Se cierra al llegar cualquier otra linea.
            function closeTable() {
                if (!filasTabla.length) return;

                var cabecera = filasTabla[0];
                var cuerpo = filasTabla.slice(1);
                // El contenedor redondea y recorta: sin el, el zebrado y los
                // bordes de las filas se saldrian por las esquinas.
                var html = '<div class="tc0091-rich-table-wrap">' +
                    '<table class="tc0091-rich-table"><thead><tr>';

                cabecera.forEach(function (celda) {
                    html += "<th>" + self.formatInlineRichText(celda) + "</th>";
                });
                html += "</tr></thead><tbody>";

                cuerpo.forEach(function (fila) {
                    html += "<tr>";
                    fila.forEach(function (celda) {
                        html += "<td>" + self.formatInlineRichText(celda) + "</td>";
                    });
                    html += "</tr>";
                });

                html += "</tbody></table></div>";
                htmlParts.push(html);
                filasTabla = [];
            }

            // La linea en blanco que precede a una tabla no emite espaciador: la
            // separacion con lo de arriba la fija .tc0091-rich-table-wrap y si no
            // se descuadraria segun el autor deje o no el hueco en el texto.
            function siguienteEsTabla(desde) {
                for (var i = desde + 1; i < lines.length; i++) {
                    var linea = String(lines[i] || "").trim();
                    if (!linea) continue;
                    return /^\|.*\|$/.test(linea);
                }
                return false;
            }

            lines.forEach(function (rawLine, idx) {
                var trimmed = String(rawLine || "").trim();

                if (!trimmed) {
                    closeList();
                    closeTable();
                    if (!siguienteEsTabla(idx)) {
                        htmlParts.push('<div class="tc0091-rich-spacer"></div>');
                    }
                    return;
                }

                if (/^\|.*\|$/.test(trimmed)) {
                    closeList();
                    var celdas = trimmed.slice(1, -1).split("|").map(function (c) {
                        return c.trim();
                    });
                    var esSeparadora = celdas.every(function (c) {
                        return /^:?-{2,}:?$/.test(c);
                    });
                    if (!esSeparadora) filasTabla.push(celdas);
                    return;
                }

                closeTable();

                if (/^[-*]\s+/.test(trimmed)) {
                    if (!inList) {
                        htmlParts.push('<ul class="tc0091-rich-list">');
                        inList = true;
                    }
                    htmlParts.push("<li>" + self.formatInlineRichText(trimmed.replace(/^[-*]\s+/, "")) + "</li>");
                    return;
                }

                closeList();
                htmlParts.push('<p class="tc0091-rich-line">' + self.formatInlineRichText(trimmed) + "</p>");
            });

            closeList();
            closeTable();
            return '<div class="tc0091-rich-text">' + htmlParts.join("") + "</div>";
        };

        Bot.prototype.getUserBubbleLabel = function (value) {
            return String(value || "")
                .replace(/^\s*(?:(?:&#\d+;|&#x[0-9a-fA-F]+;|[\u2600-\u27BF]|[\uD83C-\uDBFF][\uDC00-\uDFFF])\s*)+/, "")
                .trim();
        };

        Bot.prototype.renderBotItem = function (item, isActiveQuestion, claseEntrada) {
            var self = this;
            var bubbleClass = item.bubbleClass ? " " + item.bubbleClass : "";
            bubbleClass += claseEntrada || "";
            var title = item.title ? this.escapeHtml(item.title) : "";
            var text = this.escapeHtml(item.text || "");
            var useRichText = !!item.richText;

            var messageHtml =
                '<div class="tc0091-chat-item tc0091-chat-item--bot' +
                bubbleClass +
                '"' +
                '>';
            if (title) {
                messageHtml += '<span class="tc0091-chat-item-title">' + title + "</span>";
            }
            // richText aplica a cualquier tipo de nodo, tambien a los question.
            // Antes solo se honraba en "auto" y las tablas salian como texto plano.
            messageHtml += '<div class="tc0091-chat-item-text">' +
                (useRichText
                    ? this.formatRichText(item.text || "")
                    : this.formatPlainText(text)) +
                "</div>";

            // Va pegada a la tabla y por encima del recuadro de la tarjeta
            // recomendada, que es donde Marco la pidio (2026-09-22).
            if (item.nota) {
                messageHtml += this.createNotaMarkup(item.nota);
            }

            if (item.cards) {
                // El id del carrusel es el del mensaje: cada burbuja del hilo
                // recuerda su propia tarjeta visible entre re-renders.
                messageHtml += this.createCardsMarkup(
                    item.cards,
                    isActiveQuestion,
                    "msg-" + (item.messageId === undefined ? "s/n" : item.messageId),
                );
            }
            if (item.recommendation) {
                messageHtml += this.createRecommendationMarkup(item.recommendation, isActiveQuestion);
            }

            // Encima del aviso azul, que es donde Marco la pidio (2026-09-23).
            if (item.notaPerfilador) {
                messageHtml += this.createNotaMarkup(item.notaPerfilador);
            }

            if (item.aviso) {
                messageHtml += this.createAvisoMarkup(item.aviso);
            }

            if (item.menuText) {
                messageHtml += '<div class="tc0091-chat-item-text tc0091-menu-text">' +
                    this.formatPlainText(this.escapeHtml(item.menuText)) +
                    "</div>";
            }

            var options = Array.isArray(item.options) ? item.options : [];

            if (options.length) {
                messageHtml += '<div class="tc0091-chat-item-options">';
                options.forEach(function (opt, idx) {
                    var obj =
                        typeof opt === "string" ? { label: opt, next: "" } : opt || {};
                    var label = self.escapeHtml(obj.label || "");
                    var next = self.escapeHtml(obj.next || "");
                    var href = self.escapeHtml(obj.href || "");
                    var target = self.escapeHtml(obj.target || "");
                    var rel = target === "_blank" ? ' rel="noopener noreferrer"' : "";
                    var ctaClass = obj.isCta ? " tc0091-chat-item-option--cta" : "";
                    var isDiscoverCta =
                        !!obj.isCta &&
                        String(obj.label || "").trim() === "Descubrir si accedo a una tarjeta";
                    var ctaIconHtml = isDiscoverCta
                        ? '<span class="tc0091-chat-item-option-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M4 11.0018H17.584L14.289 7.70676C13.898 7.31576 13.898 6.68376 14.289 6.29276C14.68 5.90176 15.313 5.90176 15.703 6.29276L20.703 11.2928C21.094 11.6838 21.094 12.3158 20.703 12.7068L15.707 17.7068C15.512 17.9018 15.256 17.9998 15 17.9998C14.744 17.9998 14.488 17.9018 14.293 17.7068C13.902 17.3168 13.902 16.6838 14.292 16.2928L17.581 13.0018H4C3.447 13.0018 3 12.5548 3 12.0018C3 11.4488 3.447 11.0018 4 11.0018Z" fill="white"/></svg></span>'
                        : "";

                    if (isActiveQuestion && href) {
                        messageHtml +=
                            '<a class="tc0091-chat-item-option' +
                            ctaClass +
                            '" href="' +
                            href +
                            '"' +
                            (target ? ' target="' + target + '"' : "") +
                            rel +
                            ' data-link-option="true" data-idx="' +
                            idx +
                            '">' +
                            '<span class="tc0091-chat-item-option-label">' +
                            label +
                            '</span>' +
                            ctaIconHtml +
                            "</a>";
                    } else if (isActiveQuestion && next) {
                        var userLabel = self.escapeHtml(self.getUserBubbleLabel(obj.label || ""));
                        messageHtml +=
                            '<button class="tc0091-chat-item-option" data-next="' +
                            next +
                            '" data-idx="' +
                            idx +
                            '" data-user-label="' +
                            userLabel +
                            '">' +
                            label +
                            "</button>";
                    } else if (isActiveQuestion && obj.isClose) {
                        messageHtml +=
                            '<button class="tc0091-chat-item-option" type="button" data-close="true" data-idx="' +
                            idx +
                            '">' +
                            label +
                            "</button>";
                    } else {
                        messageHtml +=
                            '<button class="tc0091-chat-item-option" type="button" disabled>' +
                            label +
                            "</button>";
                    }
                });
                messageHtml += "</div>";
            }

            messageHtml += "</div>";

            var html = '<div class="tc0091-chat-bot-row"' +
                '>' +
                messageHtml +
                "</div>";
            return html;
        };

        // Tarjeta recomendada: bloque con badge, nombre, detalles y su propio CTA.
        // Va dentro de la misma burbuja que la tabla, no en la lista de opciones,
        // porque el CTA pertenece a la tarjeta y no al menu de navegacion.
        Bot.prototype.createRecommendationMarkup = function (rec, isActiveQuestion) {
            var self = this;
            var cfg = rec || {};
            var html = '<div class="tc0091-rec-block">';

            // El titulo va FUERA del recuadro verde, encima de el.
            if (cfg.title) {
                html += '<p class="tc0091-rec-title">' + this.escapeHtml(cfg.title) + "</p>";
            }

            html += '<div class="tc0091-rec">';

            if (cfg.badge) {
                html += '<span class="tc0091-rec-badge">' + this.escapeHtml(cfg.badge) + "</span>";
            }

            if (cfg.card) {
                html += '<p class="tc0091-rec-card">' + this.escapeHtml(cfg.card) + "</p>";
            }

            if ((cfg.details || []).length) {
                cfg.details.forEach(function (linea) {
                    html += '<p class="tc0091-rec-detail">' + self.escapeHtml(linea) + "</p>";
                });
            }

            if (cfg.cta && cfg.cta.label) {
                var label = this.escapeHtml(cfg.cta.label);
                // El codigo sale del bloque: es la tarjeta cuyo boton nativo hay que
                // accionar. Ya no hay href ni target: el CTA no navega.
                var codigoCta = this.escapeHtml(cfg.codigo || "");

                html += '<div class="tc0091-rec-actions">';
                if (isActiveQuestion) {
                    // <button>, no <a>: no navega, le da click al boton nativo de
                    // la tarjeta. El codigo dice a cual.
                    html += '<button class="tc0091-rec-cta" type="button"' +
                        ' data-rec-cta="true" data-codigo="' + codigoCta + '">' +
                        label + "</button>";
                } else {
                    html += '<button class="tc0091-rec-cta" type="button" disabled>' + label + "</button>";
                }
                html += "</div>";
            }

            html += "</div>";
            html += "</div>";
            return html;
        };

        // Lista de tarjetas del perfilador. Cada una es un recuadro con nombre,
        // descripcion, viñetas y su propio CTA; la que trae badge se pinta con
        // el borde verde. Es hermano de createRecommendationMarkup y no lo
        // reutiliza porque el perfilador muestra una ficha mas extensa.
        Bot.prototype.createCardsMarkup = function (cards, isActiveQuestion, carouselId) {
            var self = this;
            var lista = Array.isArray(cards) ? cards : [];
            if (!lista.length) return "";

            // Con una sola tarjeta no hay nada que deslizar: se pinta como
            // antes, a todo el ancho y sin controles.
            if (lista.length < 2) {
                return '<div class="tc0091-cards">' +
                    self.createCardBoxMarkup(lista[0], isActiveQuestion) +
                    "</div>";
            }

            var id = carouselId === undefined || carouselId === null
                ? "cards"
                : String(carouselId);

            var html = '<div class="tc0091-carousel" data-carousel="' + self.escapeHtml(id) + '"' +
                ' role="group" aria-label="Tarjetas recomendadas">';

            html += '<div class="tc0091-carousel-track" data-carousel-track="true">';
            lista.forEach(function (item) {
                html += '<div class="tc0091-carousel-slide">' +
                    self.createCardBoxMarkup(item, isActiveQuestion) +
                    "</div>";
            });
            html += "</div>";

            html += '<div class="tc0091-carousel-controls">';
            html += '<button class="tc0091-carousel-arrow tc0091-carousel-arrow--prev" type="button"' +
                ' data-carousel-prev="true" aria-label="Ver la tarjeta anterior" disabled>' +
                self.getCarouselChevronSvg("prev") +
                "</button>";

            html += '<div class="tc0091-carousel-dots">';
            lista.forEach(function (item, idx) {
                html += '<button class="tc0091-carousel-dot' +
                    (idx === 0 ? " tc0091-carousel-dot--activo" : "") +
                    '" type="button" data-carousel-dot="' + idx + '"' +
                    ' aria-label="Ir a la tarjeta ' + (idx + 1) + ' de ' + lista.length + '"></button>';
            });

            html += '<button class="tc0091-carousel-arrow tc0091-carousel-arrow--next" type="button"' +
                ' data-carousel-next="true" aria-label="Ver la tarjeta siguiente">' +

            html += "</div>";

            html += "</div>";
            return html;
        };

        // El recuadro de una tarjeta. Salio de createCardsMarkup sin cambiarle
        // nada para que el carrusel y la lista de una sola tarjeta pinten
        // exactamente el mismo markup.
        Bot.prototype.createCardBoxMarkup = function (item, isActiveQuestion) {
            var self = this;
            var cfg = item || {};
            var claseDestacada = cfg.badge ? " tc0091-card--destacada" : "";
            var nombreTarjeta = String(cfg.name || "");
            var clasePremium = "";

            if (/Iridium/i.test(nombreTarjeta)) {
                clasePremium = " tc0091-card--premium tc0091-card--premium-iridium";
            } else if (/Sapphire/i.test(nombreTarjeta)) {
                clasePremium = " tc0091-card--premium tc0091-card--premium-sapphire";
            } else if (/Infinite\s+Qore/i.test(nombreTarjeta)) {
                clasePremium = " tc0091-card--premium tc0091-card--premium-infinite-qore";
            } else if (/Black/i.test(nombreTarjeta)) {
                clasePremium = " tc0091-card--premium tc0091-card--premium-black";
            } else if (/Signature\s+Qore/i.test(nombreTarjeta)) {
                clasePremium = " tc0091-card--premium tc0091-card--premium-signature-qore";
            } else if (/Signature/i.test(nombreTarjeta)) {
                clasePremium = " tc0091-card--premium tc0091-card--premium-signature";
            } else if (/Infinite/i.test(nombreTarjeta)) {
                clasePremium = " tc0091-card--premium";
            }

            var html = '<div class="tc0091-card' + claseDestacada + clasePremium + '">';

            if (cfg.badge) {
                html += '<span class="tc0091-card-badge">' + self.escapeHtml(cfg.badge) + "</span>";
            }

            if (cfg.name) {
                html += '<p class="tc0091-card-name">' + self.escapeHtml(cfg.name) + "</p>";
            }

            if (cfg.description) {
                html += '<p class="tc0091-card-desc">' + self.escapeHtml(cfg.description) + "</p>";
            }

            if ((cfg.bullets || []).length) {
                html += '<ul class="tc0091-card-bullets">';
                cfg.bullets.forEach(function (linea) {
                    // formatInlineRichText escapa primero y luego convierte **...**
                    // en <strong>. El mockup de la destacada (Marco, 2026-09-21)
                    // pide negrita dentro de una vineta.
                    html += "<li>" + self.formatInlineRichText(linea) + "</li>";
                });
                html += "</ul>";
            }

            if (cfg.cta && cfg.cta.label) {
                var label = self.escapeHtml(cfg.cta.label);
                var codigoCta = self.escapeHtml(cfg.codigo || "");

                html += '<div class="tc0091-card-actions">';
                if (isActiveQuestion) {
                    html += '<button class="tc0091-card-cta" type="button"' +
                        ' data-card-cta="true" data-codigo="' + codigoCta + '">' +
                        label + "</button>";
                } else {
                    html += '<button class="tc0091-card-cta" type="button" disabled>' + label + "</button>";
                }
                html += "</div>";
            }

            html += "</div>";
            return html;
        };

        // Carrusel de tarjetas. El swipe, la inercia y el snap son nativos del
        // navegador; esto solo mueve scrollLeft cuando se usan las flechas o
        // los dots, y mantiene sincronizados el dot activo y el estado
        // deshabilitado de las flechas.
        Bot.prototype.bindCarousel = function (root) {
            var self = this;
            if (!root) return;

            var track = root.querySelector("[data-carousel-track]");
            if (!track) return;

            var slides = root.querySelectorAll(".tc0091-carousel-slide");
            if (slides.length < 2) return;

            var id = root.getAttribute("data-carousel") || "";
            var prev = root.querySelector("[data-carousel-prev]");
            var next = root.querySelector("[data-carousel-next]");
            var dots = root.querySelectorAll("[data-carousel-dot]");

            function offsetDe(idx) {
                var slide = slides[idx];
                if (!slide) return 0;
                return slide.offsetLeft - slides[0].offsetLeft;
            }

            // El indice activo es el de la tarjeta cuyo borde izquierdo queda
            // mas cerca del scroll actual. Se mide por distancia en vez de
            // dividir por un paso fijo porque la ultima tarjeta snapea contra
            // el final del scroll, y una division redondeada nunca llegaria a
            // ella.
            function indiceActual() {
                var actual = track.scrollLeft;
                var mejor = 0;
                var mejorDist = Infinity;

                for (var i = 0; i < slides.length; i++) {
                    var dist = Math.abs(offsetDe(i) - actual);
                    if (dist < mejorDist) {
                        mejorDist = dist;
                        mejor = i;
                    }
                }

                return mejor;
            }

            function sincronizar() {
                var idx = indiceActual();
                self.carouselIndex[id] = idx;

                for (var i = 0; i < dots.length; i++) {
                    if (i === idx) {
                        dots[i].classList.add("tc0091-carousel-dot--activo");
                        dots[i].setAttribute("aria-current", "true");
                    } else {
                        dots[i].classList.remove("tc0091-carousel-dot--activo");
                        dots[i].setAttribute("aria-current", "false");
                    }
                }

                if (prev) prev.disabled = idx <= 0;
                if (next) next.disabled = idx >= slides.length - 1;
            }

            function irA(idx, animar) {
                var destino = Math.max(0, Math.min(slides.length - 1, idx));
                var left = offsetDe(destino);
                var suave = animar && !self.prefiereMenosMovimiento();

                if (suave && typeof track.scrollTo === "function") {
                    try {
                        track.scrollTo({ left: left, behavior: "smooth" });
                    } catch (e) {
                        track.scrollLeft = left;
                    }
                } else {
                    track.scrollLeft = left;
                }

                self.carouselIndex[id] = destino;
            }

            var pendiente = false;
            track.addEventListener(
                "scroll",
                function () {
                    if (pendiente) return;
                    pendiente = true;
                    window.requestAnimationFrame(function () {
                        pendiente = false;
                        sincronizar();
                    });
                },
                { passive: true },
            );

            if (prev) {
                prev.addEventListener("click", function () {
                    irA(indiceActual() - 1, true);
                });
            }

            if (next) {
                next.addEventListener("click", function () {
                    irA(indiceActual() + 1, true);
                });
            }

            dots.forEach(function (dot) {
                dot.addEventListener("click", function () {
                    irA(Number(this.getAttribute("data-carousel-dot")) || 0, true);
                });
            });

            // Restaura la tarjeta que este carrusel tenia antes del re-render,
            // sin animar: no es un movimiento del usuario.
            var guardado = Number(self.carouselIndex[id]) || 0;
            if (guardado > 0) irA(guardado, false);
            sincronizar();
        };

        Bot.prototype.prefiereMenosMovimiento = function () {
            if (typeof window.matchMedia !== "function") return false;
            var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
            return !!(mq && mq.matches);
        };

        // Chevrones de las flechas. Van con currentColor para que el color lo
        // ponga el CSS de cada flecha (gris la de volver, blanca la naranja).
        Bot.prototype.getCarouselChevronSvg = function (direccion) {
            var d = direccion === "prev" ? "M10 3.5L5.5 8L10 12.5" : "M6 3.5L10.5 8L6 12.5";

            return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"' +
                ' xmlns="http://www.w3.org/2000/svg">' +
                '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="2"' +
                ' stroke-linecap="round" stroke-linejoin="round"/>' +
                "</svg>";
        };

        // caja con fondo; esto es solo la aclaracion del asterisco.
        Bot.prototype.createNotaMarkup = function (texto) {
            if (!texto) return "";

            return '<p class="tc0091-nota">' + this.escapeHtml(texto) + "</p>";

        Bot.prototype.createAvisoMarkup = function (texto) {

            return (

                '<path fill-rule="evenodd" clip-rule="evenodd" d="M10 0C15.5228 0 20 4.47715 20 10C20 15.5228 15.5228 20 10 20C4.47715 20 0 15.5228 0 10C0 8.34273 0.404358 6.74154 1.16651 5.30903C1.42592 4.82145 2.03147 4.63649 2.51904 4.8959C3.00661 5.15531 3.19157 5.76085 2.93217 6.24842C2.32296 7.39345 2 8.67234 2 10C2 14.4183 5.58172 18 10 18C14.4183 18 18 14.4183 18 10C18 5.58172 14.4183 2 10 2C8.59854 2 7.34992 2.31467 6.25012 2.89887C5.76238 3.15795 5.15696 2.97259 4.89787 2.48484C4.63879 1.9971 4.82416 1.39167 5.3119 1.13259C6.69898 0.395793 8.26949 0 10 0ZM10 8C10.5523 8 11 8.44771 11 9V11C11 11.5523 10.5523 12 10 12C9.44771 12 9 11.5523 9 11V9C9 8.44771 9.44771 8 10 8ZM14 8C14.5523 8 15 8.44771 15 9V11C15 11.5523 14.5523 12 14 12C13.4477 12 13 11.5523 13 11V9C13 8.44771 13.4477 8 14 8ZM6 8C6.55228 8 7 8.44771 7 9V11C7 11.5523 6.55228 12 6 12C5.44772 12 5 11.5523 5 11V9C5 8.44771 5.44772 8 6 8Z" fill="#002A8D"/>' +

        Bot.prototype.createThinkingMarkup = function () {
            // Siempre es nueva cuando se muestra, asi que entra animada siempre.
            var cls = "tc0091-thinking tc0091-msg-enter tc0091-thinking--chat";
            var textHtml = this.shouldShowThinkingText()
                ? '<span class="tc0091-thinking-text">' + this.escapeHtml(this.getThinkingText()) + '</span>'
                : "";
            return (
                '<div class="' +
                cls +
                '">' +
                textHtml +
                '<span class="tc0091-thinking-dots" aria-hidden="true">' +
                '<span class="tc0091-thinking-dot"></span>' +
                '<span class="tc0091-thinking-dot"></span>' +
                '<span class="tc0091-thinking-dot"></span>' +
                '</span>' +
                "</div>"
            );
        };

        Bot.prototype.renderChat = function (node) {
            var self = this;
            // Mientras el bot "piensa" no se pinta todavia la primera pantalla: si no,
            // saldrian los puntitos Y el saludo a la vez. La pinta applyTransition
            // cuando termina la espera.
            if (!this.state.chatLog.length && !this.isWaiting()) {
                this.appendBotMessageForCurrent();
            }

            var html = '<div class="tc0091-chat-shell">';
            html += '<div class="tc0091-chat-box">';
            html += '<div class="tc0091-chat">';

            var activeNodeId = this.state.current;
            var allowCurrentCtas = !this.state.finished;
            var activeQuestionMessageId = Number(this.state.activeQuestionMessageId) || null;

            // Encontrar el índice del último mensaje de usuario
            var lastUserMessageIdx = -1;
            for (var i = this.state.chatLog.length - 1; i >= 0; i--) {
                if (this.state.chatLog[i].role === "user") {
                    lastUserMessageIdx = i;
                    break;
                }
            }

            // Entradas ya pintadas en un render anterior: no se reaniman.
            var animadosHasta = Number(this.animatedUpTo) || 0;

            this.state.chatLog.forEach(function (item, idx) {
                var claseEntrada = idx >= animadosHasta ? " tc0091-msg-enter" : "";

                if (item.role === "user") {
                    // Si hay error recovery y es el último mensaje de usuario, mostrar error
                    if (self.state.errorRecovery && idx === lastUserMessageIdx) {
                        html += '<div class="tc0091-error-message">' +
                            '<span class="tc0091-error-icon">⚠</span>' +
                            '<div class="tc0091-error-content">' +
                            '<p class="tc0091-error-text">Error en el envío</p>' +
                            '<button class="tc0091-error-retry" type="button" data-retry-error>Reintentar</button>' +
                            '</div>' +
                            '</div>';
                    } else {
                        html +=
                            '<div class="tc0091-chat-item tc0091-chat-item--user' + claseEntrada + '">' +
                            self.escapeHtml(item.text || "") +
                            "</div>";
                    }
                    return;
                }

                // Si hay error recovery, no renderizar mensajes de bot después del último mensaje de usuario
                if (
                    self.state.errorRecovery &&
                    lastUserMessageIdx >= 0 &&
                    idx > lastUserMessageIdx
                ) {
                    return;
                }

                var isCurrentBot =
                    allowCurrentCtas &&
                    item.nodeId === activeNodeId &&
                    idx === self.state.chatLog.length - 1;
                var isOptionalSourceBot =
                    allowCurrentCtas &&
                    activeQuestionMessageId !== null &&
                    Number(item.messageId) === activeQuestionMessageId &&
                    !!item.allowOptionsWhileLinked;
                var isUsageSupportBot =
                    allowCurrentCtas &&
                    activeQuestionMessageId !== null &&
                    Number(item.linkedQuestionMessageId) === activeQuestionMessageId;
                var isInteractiveBot =
                    isCurrentBot || isOptionalSourceBot || isUsageSupportBot;
                html += self.renderBotItem(item, isInteractiveBot, claseEntrada);
            });

            // A partir de aqui todo lo del log ya quedo pintado.
            this.animatedUpTo = this.state.chatLog.length;

            if (this.isWaiting()) {
                html += this.createThinkingMarkup();
            }

            if (
                this.state.runtimeError &&
                this.state.runtimeError.type === "missing-next-node"
            ) {
                html += this.createMissingNextErrorMarkup();
            }

            html += "</div>";

            if (this.state.finished) {
                html += this.createMainCta();
            }

            html += "</div>";
            return html;
        };

        Bot.prototype.render = function () {
            var node = this.getNode(this.state.current);
            if (!node) {
                this.debugError("INVALID_CURRENT_NODE", {
                    current: this.state.current,
                });
                this.setRuntimeError({
                    type: "invalid-current-node",
                    text:
                        "No encontramos el nodo actual del flujo. Te llevaremos al inicio para continuar.",
                });
                this.el.body.innerHTML = this.createErrorComponentMarkup({
                    text: this.state.runtimeError.text,
                    action: "goto-start",
                    buttonLabel: "Ir al inicio",
                });
                this.attachHandlers();
                this.scrollBodyToBottom();
                return;
            }

            this.el.body.innerHTML = this.renderChat(node);
            this.attachHandlers();
            this.adjustChatScroll(node);
            this.maybeAdvanceAutoNode();
        };

        Bot.prototype.createMainCta = function () {
            return (
                '<button class="tc0091-chat-main-cta" type="button" data-main-restart>' +
                this.config.menuText +
                "</button>"
            );
        };

        Bot.prototype.attachHandlers = function () {
            var self = this;

            var retryError = this.el.body.querySelector("[data-retry-error]");
            if (retryError) {
                retryError.addEventListener("click", function () {
                    if (!self.state.errorRecovery) return;
                    var recovery = self.state.errorRecovery;
                    self.clearPendingTransition();
                    self.applyTransition(recovery.nextId);
                });
            }

            this.el.body.querySelectorAll("[data-runtime-error-action]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var action = this.getAttribute("data-runtime-error-action") || "";

                    if (action === "retry-missing-next") {
                        var runtimeError = self.state.runtimeError || {};
                        if (!runtimeError.nextId) {
                            self.debugError("MISSING_NEXT_NODE_RETRY_SKIPPED", {
                                reason: "nextId-unavailable",
                            });
                            self.restart();
                            return;
                        }
                        self.applyTransition(runtimeError.nextId);
                        return;
                    }

                    self.debugError("RUNTIME_ERROR_GOTO_START", {
                        action: action,
                    });
                    self.restart();
                });
            });

            this.el.body.querySelectorAll("[data-next]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var selectedLabel =
                        this.getAttribute("data-user-label") ||
                        (this.textContent || "").trim();
                    var destino = this.getAttribute("data-next");

                    // Antes que goTo: se mide la eleccion del usuario, no el
                    // resultado de la navegacion, que puede fallar.
                    self.trackOpcionElegidaClick(destino);

                    self.goTo(destino, selectedLabel);
                });
            });

            this.el.body.querySelectorAll("[data-carousel]").forEach(function (carrusel) {
                self.bindCarousel(carrusel);
            });

            // Los dos CTA "Elegir tarjeta" que existen: el de cada tarjeta del
            // perfilador (data-card-cta) y el del recuadro recomendado de q21-q24
            // (data-rec-cta). Solo se enlazan mientras el mensaje es la pregunta
            // activa: al decaer a <button disabled> el atributo ya no se emite.
            this.el.body
                .querySelectorAll('[data-card-cta="true"], [data-rec-cta="true"]')
                .forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        self.elegirTarjeta(this.getAttribute("data-codigo"));
                    });
                });

            this.el.body.querySelectorAll("[data-close]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    self.trackCloseClick();
                    self.close();
                    self.restart();
                });
            });

            var mainRestart = this.el.body.querySelector("[data-main-restart]");
            if (mainRestart) {
                mainRestart.addEventListener("click", function () {
                    self.restart();
                });
            }

        };

        Bot.prototype.destroy = function () {
            this.cancelWaitingTransition();
            this.close();
            if (this.el.launcher)
                this.el.launcher.replaceWith(this.el.launcher.cloneNode(true));
            if (this.el.close)
                this.el.close.replaceWith(this.el.close.cloneNode(true));
            if (this.el.mask) this.el.mask.replaceWith(this.el.mask.cloneNode(true));
        };

        // La instancia viva vive en window, no en una variable de esta IIFE. Si
        // Adobe Target reinyecta la oferta, este script corre de nuevo en otra
        // IIFE con su propio "instance" en undefined, y la copia nueva enlazaba un
        // segundo juego de listeners sobre los mismos elementos sin destruir la
        // anterior. Guardandola en window, init() siempre encuentra a su
        // predecesora y la destruye.
        function instanciaActual() {
            return window.__tc0091Instance || null;
        }

        // Antes esto BUSCABA el markup que Target entregaba junto al script y lo
        // movia a un scope propio. Ahora lo CONSTRUYE, porque la oferta es una
        // sola etiqueta y no hay nada que buscar. Dos consecuencias:
        //   - ya no depende de que Target entregue markup: si el SPA borra el
        //     scope, el MutationObserver lo reconstruye entero, no solo
        //     reinicializa sobre un markup que quiza ya no existe;
        //   - el bot cuelga de <body> en vez de quedar dentro del
        //     .mbox-container, asi que sus z-index 9998/9999 dejan de heredar el
        //     contexto de apilamiento de ese contenedor.
        function ensureScope() {
            var scope = document.getElementById("tc0091-scope");
            if (scope && document.contains(scope)) return scope;

            // Quedo un scope huerfano (desprendido del documento): se descarta
            // antes de crear el nuevo para no dejar dos con el mismo id.
            if (scope && scope.parentNode) scope.parentNode.removeChild(scope);

            if (!document.body) return null;

            scope = document.createElement("div");
            scope.id = "tc0091-scope";
            scope.innerHTML = MARKUP;
            document.body.appendChild(scope);

            return scope;
        }

        function init(scope) {
            if (!scope) return;

            var previa = instanciaActual();
            if (previa) {
                previa.unlockPageScroll();
                previa.destroy();
            }

            var bot = new Bot(scope);
            window.__tc0091Instance = bot;
            bot.init();
        }

        // Hook de desarrollo. Lo usa preview-local.html para armar el panel de
        // casuisticas sin tener que mantener a mano la lista de tarjetas: se alimenta
        // de config.perfilador, asi que crece solo a medida que se van agregando
        // pantallas del perfilador. No lo usa el bot.
        window.tc0091Catalogo = function () {
            var instance = instanciaActual();
            if (!instance) return { criterios: [], tarjetas: [], leads: [] };

            var cfg = instance.config.perfilador || {};
            var criterios = cfg.criterios || {};
            var tarjetas = [];
            var vistos = {};
            // Que tarjetas pertenecen al caso A de cada criterio. Una misma tarjeta
            // puede ser caso A en un criterio y caso B en otro, asi que esto NO se
            // puede deducir de la lista de tarjetas deduplicada.
            var casoAPorCriterio = {};

            Object.keys(criterios).forEach(function (id) {
                casoAPorCriterio[id] = [];

                ["casoA", "casoB"].forEach(function (caso) {
                    var lista = ((criterios[id] || {})[caso] || {}).tarjetas || [];
                    lista.forEach(function (t) {
                        if (caso === "casoA" && t.codigo) casoAPorCriterio[id].push(t.codigo);

                        var clave = t.codigo || t.name;
                        if (vistos[clave]) return;
                        vistos[clave] = true;
                        tarjetas.push({
                            codigo: t.codigo || null,
                            // El nombre viaja con su emoji como entidad HTML.
                            nombre: String(t.name || "").replace(/^&#\d+;\s*/, ""),
                            criterio: id,
                            caso: caso === "casoA" ? "A" : "B",
                        });
                    });
                });
            });

            // La destacada ya no vive en las listas de los criterios, asi que hay
            // que declararla aparte o el panel del preview la perderia el dia que
            // sea una tarjeta que ningun criterio liste.
            var dest = cfg.destacada || {};
            if (dest.codigo && !vistos[dest.codigo]) {
                vistos[dest.codigo] = true;
                tarjetas.push({
                    codigo: dest.codigo,
                    nombre: String(dest.name || "").replace(/^&#\d+;\s*/, ""),
                    criterio: "destacada",
                    caso: "A",
                });
            }

            return {
                criterios: Object.keys(criterios),
                casoAPorCriterio: casoAPorCriterio,
                destacada: dest.codigo || null,
                tarjetas: tarjetas,
                leads: instance.getLeadCardCodes(),
            };
        };

        // Ya no hay nada que esperar a que entregue Target: el markup lo crea
        // ensureScope(). Lo unico que puede faltar es <body>, y en ese caso esto
        // NO se rinde: devuelve false y el observador de abajo lo reintenta en
        // cuanto el documento cambie. Devolver un booleano es lo que permite que
        // el arranque no dependa de acertar el momento.
        function montarBot() {
            // No se monta si la pagina no es el sitio donde el bot debe estar: otra
            // ruta del flujo, o la pantalla de sesion expirada. Esto cubre tambien el
            // arranque, no solo el remontaje: si la oferta llega con la sesion ya
            // caida, el bot no aparece y su View de Inicio no se emite, que es lo
            // correcto -- al usuario no se le mostro nada.
            if (motivoParaRetirarse()) return false;

            inyectarEstilos();

            var scope = ensureScope();
            if (!scope) return false;

            // La ruta en la que el bot vive. Se fija en el primer montaje y queda en
            // window para que una reinyeccion de Target no la reinicie.
            if (!window.__tc0091Ruta) window.__tc0091Ruta = rutaActual();

            init(scope);
            return true;
        }

        function rutaActual() {
            return String(window.location.pathname || "");
        }

        function cambioLaRuta() {
            return !!window.__tc0091Ruta && window.__tc0091Ruta !== rutaActual();
        }

        // La pantalla de sesion expirada. Cuando la sesion caduca, la pagina
        // reemplaza su contenido por esta plantilla -- "Puedes retomar tu sesion
        // aqui" -- y las tarjetas aprobadas dejan de existir.
        //
        // Se detecta por presencia y no por visibilidad porque NO es una plantilla
        // oculta: no aparece en ninguna de las cuatro capturas de
        // referencia/paginas/, o sea que el DOM solo la tiene cuando esta ocurriendo.
        //
        // El selector abarca el bloque y sus elementos ("error-template-section" y
        // "error-template-section__actions"). Eso hace que el bot tambien se retire
        // ante otras pantallas de error de la misma familia, y esta bien que asi sea:
        // si la pagina no esta mostrando las tarjetas, un asistente para elegir
        // tarjeta no tiene nada que hacer ahi.
        function sesionExpirada() {
            return !!document.querySelector('[class*="error-template-section"]');
        }

        // Por que el bot deberia retirarse, o "" si no hay motivo. Los dos motivos se
        // comportan distinto a proposito:
        //
        //   ruta   -> DEFINITIVO. El usuario paso a otra pantalla del flujo y el bot
        //             no vuelve.
        //   sesion -> MIENTRAS DURE. Si la pagina se recupera (el usuario retoma la
        //             sesion sin recargar), el observador lo vuelve a montar.
        function motivoParaRetirarse() {
            if (cambioLaRuta()) return "ruta";
            if (sesionExpirada()) return "sesion";
            return "";
        }

        // El bot vive mientras el usuario siga en la URL donde aparecio y la sesion
        // siga viva (Marco, 2026-09-22). Elegir una tarjeta ya NO lo hace desaparecer:
        // abre el modal de linea de credito de la pagina y el launcher se queda, por
        // si el usuario quiere volver a consultar antes de decidir.
        //
        // Hace falta explicitamente porque el bot cuelga de <body> y el observador lo
        // reconstruye: sin esto, una navegacion del SPA a otra pantalla del flujo
        // ("Donde recibirla", "Confirmacion") o una sesion caida se lo llevarian
        // puesto igual.
        function desmontarSiHayQue() {
            var motivo = motivoParaRetirarse();
            if (!motivo) return false;

            var bot = instanciaActual();
            if (bot) {
                bot.unlockPageScroll();
                bot.destroy();
                window.__tc0091Instance = null;
            }

            var scope = document.getElementById("tc0091-scope");
            if (scope && scope.parentNode) scope.parentNode.removeChild(scope);

            // El <style> se retira solo cuando el bot no vuelve. Con la sesion caida
            // puede volver, y reinyectarlo en cada recuperacion no aporta nada.
            if (motivo === "ruta") {
                var estilo = document.getElementById("tc0091-estilos");
                if (estilo && estilo.parentNode) estilo.parentNode.removeChild(estilo);
            }

            return true;
        }

        // El vigilante. Decide, en cada cambio del DOM, si el bot tiene que estar
        // puesto o retirado. Cubre cinco situaciones, y las cuatro primeras se
        // comprobaron fallando antes de escribirlo asi:
        //
        //   1. el SPA borra el scope           -> lo reconstruye;
        //   2. el SPA reemplaza <body> entero  -> por eso observa <html> y no
        //      <body>: un observador colgado del body viejo queda huerfano y el
        //      bot no vuelve nunca;
        //   3. la oferta llega antes de que exista <body> -> montarBot() devolvio
        //      false, y este observador lo reintenta cuando el body aparece;
        //   4. el usuario navega a otra ruta del flujo -> se retira y no vuelve;
        //   5. la sesion expira -> se retira mientras dure esa pantalla, y vuelve
        //      si la pagina se recupera.
        //
        // documentElement existe desde que empieza el parseo, asi que se puede
        // observar aunque no haya body todavia.
        function observeReinsertion() {
            if (window.__tc0091Observed) return;

            var raiz = document.documentElement;
            if (!raiz) return;

            var revisar = function () {
                // Primero los motivos para NO estar: ruta distinta o sesion caida.
                // desmontarSiHayQue() retira lo que haya quedado puesto, y la segunda
                // condicion impide volver a montar mientras el motivo siga vigente.
                if (desmontarSiHayQue() || motivoParaRetirarse()) return;

                var scope = document.getElementById("tc0091-scope");
                if (!scope || !document.contains(scope)) {
                    montarBot();
                }
            };

            new MutationObserver(revisar).observe(raiz, { childList: true, subtree: true });

            // El SPA navega sin recargar. El observador ya atrapa casi todo, porque
            // una navegacion siempre mueve el DOM, pero popstate cubre el caso de que
            // la URL cambie sin que se toque nada.
            window.addEventListener("popstate", revisar);
            window.addEventListener("hashchange", revisar);

            window.__tc0091Observed = true;
        }

        // El observador se arma SIEMPRE y primero: es la red que atrapa todos los
        // casos en los que montarBot() no puede hacer su trabajo todavia. El
        // intento inmediato cubre el caso normal, en el que el body ya esta.
        observeReinsertion();
        if (!montarBot() && document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", function () {
                montarBot();
            });
        }
    })();

</script>
