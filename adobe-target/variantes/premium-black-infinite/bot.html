<script>
    (function () {
        // ====================================================================
        // La oferta es UNA sola etiqueta <script>.
        //
        // Antes este archivo eran tres bloques: <style>, el markup del bot y
        // este script. Ahora el CSS y el markup viajan aqui dentro como strings
        // y se inyectan por JS (inyectarEstilos / ensureScope), asi que Adobe
        // Target entrega un unico nodo.
        //
        // Las dos plantillas usan template literal a proposito: es lo unico que
        // permite pegar el CSS y el markup verbatim, sin escapar ni concatenar
        // linea por linea. El resto del archivo sigue sin template literals, con
        // strings armados con "+", como pidio Marco el 2026-09-09.
        // ====================================================================

        var CSS = `
    #tc0091-scope {
        font-family: var(--bcp-font-family-primary-regular), sans-serif;
    }

    #tc0091-scope * {
        box-sizing: border-box;
    }

    #tc0091-scope .tc0091-mask {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: none;
        /* 999998/999999 y no 9998/9999 (Marco, 2026-09-22). En la home alcanzaba:
           ahi no hay nada entre 9999 y el banner de cookies. /felicitaciones mete
           un <header class="app-section__header"> con z-index 99999, y como su
           padre .app-section es display:flex, ese z-index SI aplica aunque el
           header sea position:static -- un flex item crea contexto de apilamiento
           con z-index distinto de auto. Con 9999 el header quedaba por encima de
           la mascara, sin atenuar. Se queda por debajo del banner de cookies
           (9999999999): el consentimiento va primero. */
        z-index: 999998;
    }

    #tc0091-scope .tc0091-launcher {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 100px;
        height: 100px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        padding: 0;
        overflow: visible;
        cursor: pointer;
        z-index: 999999;
    }

    #tc0091-scope .tc0091-launcher-welcome-wrap {
        position: fixed;
        right: 25px;
        bottom: 115px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        z-index: 999999;
        gap: 0;
    }

    #tc0091-scope .tc0091-launcher-welcome-box {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        border-radius: 8px;
        background: transparent;
        filter: drop-shadow(0 1px 1px rgba(82, 112, 148, 0.14)) drop-shadow(0 4px 14px rgba(82, 112, 148, 0.2));
    }

    #tc0091-scope .tc0091-launcher-welcome {
        display: flex;
        padding: 8px;
        justify-content: center;
        align-items: flex-start;
        align-self: stretch;
        border-radius: 8px;
        background: var(--primary-040, #EBF4FF);
        color: var(--on-text, #202E44);
        font-size: 14px;
        line-height: 20px;
        text-align: center;
        cursor: pointer;
    }

    #tc0091-scope .tc0091-launcher-welcome strong {
        font-size: 14px;
        line-height: 20px;
        font-weight: 700;
    }

    #tc0091-scope .tc0091-launcher-welcome-pointer {
        width: 16px;
        height: 8px;
        margin-right: 32px;
        display: block;
    }

    #tc0091-scope .tc0091-launcher-base {
        display: flex;
        width: 64px;
        height: 64px;
        padding: 8px 16px;
        justify-content: center;
        align-items: center;
        gap: 6px;
        border-radius: 40px;
        border: 1px solid var(--primary-100, #B2D6FF);
        background: linear-gradient(180deg, #001E7E 0%, #002AAE 51.78%, #FF7800 100%, #F2C089 100%);
        box-shadow: 0 0 70px 0 rgba(26, 89, 242, 0.12), 0 0 40px 6px rgba(26, 102, 255, 0.30), 0 0 18px 4px rgba(38, 115, 255, 0.55), 0 0 6px 2px rgba(51, 128, 255, 0.90);
        position: relative;
        z-index: 2;
    }

    #tc0091-scope .tc0091-launcher-base svg {
        width: 32px;
        height: 32px;
        display: block;
    }

    #tc0091-scope .tc0091-launcher-pulse {
        position: absolute;
        width: 100px;
        height: 100px;
        left: 50%;
        top: 50%;
        border-radius: 100px;
        border: 2px solid rgba(38, 115, 255, 0.60);
        z-index: 1;
        transform: translate(-50%, -50%) scale(0.8);
        transform-origin: center;
        animation:
            kf_631_1318_opacity_0 2s linear,
            kf_631_1318_scale_0 2s linear;
        animation-iteration-count: infinite;
        will-change: transform, opacity;
        pointer-events: none;
    }

    #tc0091-scope .tc0091-launcher:focus {
        outline: none;
    }

    #tc0091-scope .tc0091-launcher:focus-visible {
        outline: 2px solid #B2D6FF;
        outline-offset: 4px;
        border-radius: 44px;
    }

    @keyframes kf_631_1318_opacity_0 {
        0% {
            animation-timing-function: ease-out;
            opacity: 0;
        }

        7.5% {
            animation-timing-function: ease-in;
            opacity: 0.8;
        }

        25% {
            opacity: 0;
        }

        55% {
            animation-timing-function: ease-out;
            opacity: 0;
        }

        62.5% {
            animation-timing-function: ease-in;
            opacity: 0.8;
        }

        80% {
            opacity: 0;
        }

        100% {
            opacity: 0;
        }
    }

    @keyframes kf_631_1318_scale_0 {
        0% {
            animation-timing-function: ease-out;
            transform: translate(-50%, -50%) scale(0.8);
        }

        7.5% {
            animation-timing-function: ease-in;
            transform: translate(-50%, -50%) scale(1);
        }

        25% {
            animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1);
            transform: translate(-50%, -50%) scale(1.15);
        }

        55% {
            animation-timing-function: ease-out;
            transform: translate(-50%, -50%) scale(0.8);
        }

        62.5% {
            animation-timing-function: ease-in;
            transform: translate(-50%, -50%) scale(1);
        }

        80% {
            transform: translate(-50%, -50%) scale(1.15);
        }

        100% {
            transform: translate(-50%, -50%) scale(1.15);
        }
    }

    #tc0091-scope .tc0091-panel {
        position: fixed;
        bottom: 40px;
        right: 20px;
        width: 374px;
        height: 70vh;
        background: #fff;
        border-radius: 12px;
        display: none;
        flex-direction: column;
        overflow: hidden;
        overscroll-behavior: contain;
        z-index: 999999;
        box-shadow: 0 4px 5px 0 rgba(82, 112, 148, 0.14), 0 1px 10px 0 rgba(82, 112, 148, 0.12), 0 2px 4px 0 rgba(82, 112, 148, 0.20);
        /* Estado de entrada. Crece desde la esquina del launcher.
           En movil el media query lo pisa por un deslizamiento completo. */
        opacity: 0;
        transform: translateY(12px) scale(0.98);
        transform-origin: 100% 100%;
        transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1), opacity 160ms ease;
        will-change: transform, opacity;
    }

    #tc0091-scope .tc0091-panel.tc0091-panel--open {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    #tc0091-scope .tc0091-header {
        padding: 12px;
        background: #0030B3;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #tc0091-scope .tc0091-header-main {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #tc0091-scope .tc0091-header-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
        background-color: #3D77FF;
        border-radius: 50%;
        padding: 9px;
    }

    #tc0091-scope .tc0091-header-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #tc0091-scope .tc0091-title {
        color: #fff;
        font-weight: 600;
    }

    #tc0091-scope .tc0091-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        color: #fff;
        font-size: 12px;
        line-height: 1.2;
    }

    #tc0091-scope .tc0091-status-dot {
        display: inline-flex;
        line-height: 0;
    }

    #tc0091-scope .tc0091-body {
        padding: 12px;
        /* Solo scroll vertical. La entrada de las burbujas las desplaza en X
           fuera del ancho util y sin esto aparece una barra horizontal. */
        overflow-x: hidden;
        overflow-y: auto;
        flex: 1;
        background: #F5F8FF;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
    }

    #tc0091-scope .tc0091-chat {
        display: flex;
        flex-direction: column;
        margin-bottom: 0;
    }

    /* Separacion entre burbujas. Va por margen y no por gap porque el gap es
       uniforme y aqui la distancia depende de quien habla: 24px cuando cambia
       el remitente y la mitad cuando se encadenan dos del mismo lado, para que
       una tanda del bot se lea como un bloque y no como mensajes sueltos. */
    #tc0091-scope .tc0091-chat > * + * {
        margin-top: 24px;
    }

    #tc0091-scope .tc0091-chat > .tc0091-chat-bot-row + .tc0091-chat-bot-row,
    #tc0091-scope .tc0091-chat > .tc0091-chat-item--user + .tc0091-chat-item--user {
        margin-top: 12px;
    }

    #tc0091-scope .tc0091-chat-shell {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    #tc0091-scope .tc0091-chat-box {
        /* background: #fff; */
        /* border: 1px solid #d8deea; */
        border-radius: 12px;
        padding: 6px;
        min-height: 180px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }

    #tc0091-scope .tc0091-chat-main-cta {
        margin-top: 10px;
        display: block;
        width: 100%;
        height: 40px;
        line-height: 40px;
        text-align: center;
        background: #ff7800;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
    }

    #tc0091-scope .tc0091-chat-main-cta:hover {
        background: #ff961f;
    }

    /* Regla general de ancho de burbuja:
       el ancho lo decide el contenido y el techo es el 100% del hilo. Una
       burbuja corta se encoge; una con tabla larga llega al borde. Antes esto
       era 90% fijo mas una clase tc0091-node-ancho para optar al 100%; esa
       clase ya no hace falta y se elimino. */
    #tc0091-scope .tc0091-chat-item {
        max-width: 100%;
        padding: 12px;
        border-radius: 10px;
        line-height: 20px;
        font-size: 14px;
    }

    #tc0091-scope .tc0091-chat-item--bot {
        color: var(--on-text, #202E44);
        border-radius: 4px 16px 16px 16px;
        border: 1px solid var(--background-100, #D8DFEA);
        background: var(--on-white, #FFF);
    }

    /* Una burbuja con botones o con tabla ocupa el ancho completo: si no, queda
       en el ancho de su boton mas largo (la de "Resolver dudas" caia en 96%) y
       se ve descuadrada frente a las demas. Las de solo texto no entran aqui y
       conservan su tamano natural.
       Si el navegador no soporta :has(), la burbuja simplemente se queda al
       ancho de su contenido, que es el comportamiento anterior. */
    #tc0091-scope .tc0091-chat-item--bot:has(.tc0091-chat-item-options),
    #tc0091-scope .tc0091-chat-item--bot:has(.tc0091-rich-table) {
        width: 100%;
    }

    #tc0091-scope .tc0091-node-start .tc0091-chat-item-title {
        font-size: 16px;
    }

    #tc0091-scope .tc0091-chat-item-title {
        display: block;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        color: var(--on-text, #202E44);
        margin-bottom: 8px;
    }

    #tc0091-scope .tc0091-chat-item-text {
        display: block;
        font-size: 14px;
        line-height: 20px;
        color: var(--on-text, #202E44);
        margin-bottom: 16px;
    }

    /* Separacion entre parrafos por margin-bottom, no por <br>.
       Unico punto de ajuste del espaciado vertical del texto. */
    /* 16px entre parrafos y tambien despues del ultimo, que es lo que separa
       el bloque de texto de lo que venga debajo (opciones, tarjetas).
       Antes eran 8px entre parrafos y 16px solo en el ultimo; Marco pidio la
       misma medida en los dos casos (2026-09-09). */
    #tc0091-scope .tc0091-text-line {
        margin: 0 0 16px;
    }

    /* Renglon pegado dentro de un parrafo: corta la linea sin agregar aire.
       Es un span display:block a proposito, para no usar <br>. */
    #tc0091-scope .tc0091-text-row {
        display: block;
    }

    #tc0091-scope .tc0091-welcome-line {
        display: block;
    }

    #tc0091-scope .tc0091-rich-text {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    #tc0091-scope .tc0091-rich-line {
        margin: 0;
    }

    /* Tabla comparativa. El contenedor redondea y recorta para que el
       zebrado y los bordes de fila no se salgan por las esquinas. */
    #tc0091-scope .tc0091-rich-table-wrap {
        /* 32px de separacion con el texto de arriba: 8px los pone el gap de
           .tc0091-rich-text y los 24 restantes este margen. */
        margin-top: 24px;
        border: 1px solid #E6E6E6;
        border-radius: 12px;
        overflow: hidden;
    }

    /* El panel mide 374px: table-layout fijo y corte de palabra para que
       los nombres largos partan de linea en vez de desbordar. */
    #tc0091-scope .tc0091-rich-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 13px;
        line-height: 1.3;
    }

    #tc0091-scope .tc0091-rich-table th,
    #tc0091-scope .tc0091-rich-table td {
        padding: 12px 10px;
        text-align: left;
        vertical-align: middle;
        overflow-wrap: anywhere;
        color: var(--on-text, #202E44);
    }

    /* Separador vertical entre columnas. */
    #tc0091-scope .tc0091-rich-table th+th,
    #tc0091-scope .tc0091-rich-table td+td {
        border-left: 1px solid #E6E6E6;
    }

    /* Separador horizontal entre filas. */
    #tc0091-scope .tc0091-rich-table tbody tr {
        border-top: 1px solid #E6E6E6;
    }

    #tc0091-scope .tc0091-rich-table thead th {
        font-weight: 600;
        background: #FAFAFA;
    }

    /* Zebrado: filas pares en gris. */
    #tc0091-scope .tc0091-rich-table tbody tr:nth-child(even) {
        background: #FAFAFA;
    }

    /* Bloque de tarjeta recomendada, debajo de la tabla y en la misma burbuja. */
    #tc0091-scope .tc0091-rec-block {
        margin-top: 32px;
    }

    /* El titulo va fuera del recuadro, como texto normal del hilo. */
    #tc0091-scope .tc0091-rec-title {
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 20px;
        color: var(--on-text, #202E44);
    }

    #tc0091-scope .tc0091-rec {
        padding: 16px;
        border: 1px solid var(--state-success, #6AC90F);
        border-radius: 24px;
        background: #F9F9FB;
    }

    #tc0091-scope .tc0091-rec-badge {
        display: inline-block;
        margin-bottom: 8px;
        padding: 3px 10px;
        border-radius: 2px;
        background: #3D9B00;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
    }

    #tc0091-scope .tc0091-rec-card {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.3;
        color: var(--on-text, #202E44);
    }

    /* El beneficio de la recomendacion va como parrafo, sin viñeta. */
    #tc0091-scope .tc0091-rec-detail {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        color: var(--on-text, #202E44);
    }

    /* El CTA se alinea a la derecha y mide lo que su texto, no el ancho entero. */
    #tc0091-scope .tc0091-rec-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
    }

    #tc0091-scope .tc0091-rec-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 20px;
        border-radius: 20px;
        border: 1px solid #FF7800;
        background: #FF7800;
        color: #fff;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        font-family: inherit;
        text-decoration: none;
        cursor: pointer;
    }

    #tc0091-scope .tc0091-rec-cta:hover {
        background: #ff961f;
    }

    #tc0091-scope .tc0091-rec-cta[disabled] {
        opacity: 0.5;
        cursor: default;
    }

    /* Lista de tarjetas del perfilador (q11-q14).
       Es el mismo recuadro del bloque de recomendacion, pero repetido y en dos
       variantes: borde neutro por defecto y borde verde + badge para la que
       Marco marca como "La más usada". Se escribio aparte de .tc0091-rec* en
       vez de reutilizarlo para no tocar q21-q24, que ya estan aprobadas. */
    #tc0091-scope .tc0091-cards {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 16px;
    }

    #tc0091-scope .tc0091-card {
        padding: 16px;
        border: 1px solid #E6E6E6;
        border-radius: 24px;
        background: #F9F9FB;
    }

    /* La destacada. El verde lo dio Marco el 2026-09-09: va en duro y no por el
       token --state-success, que en esta pagina no esta definido y caia en un
       #6AC90F distinto. */
    #tc0091-scope .tc0091-card--destacada {
        border-color: #37A500;
    }

    #tc0091-scope .tc0091-card-badge {
        display: inline-block;
        margin-bottom: 8px;
        /* 2px en Y y 4px en X, dado por Marco el 2026-09-10 (antes 3px 10px).
           Solo este badge: el de q21-q24 (.tc0091-rec-badge) sigue en 3px 10px
           porque esas pantallas estan aprobadas y no se tocan. */
        padding: 2px 4px;
        border-radius: 2px;
        background: #3D9B00;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
    }

    #tc0091-scope .tc0091-card-name {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        line-height: 20px;
        color: var(--on-text, #202E44);
    }

    /* La descripcion va pegada al nombre, sin aire: asi esta en el mockup. */
    #tc0091-scope .tc0091-card-desc {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        color: var(--on-text, #202E44);
    }

    /* El aire se reserva para separar la descripcion de las viñetas. */
    #tc0091-scope .tc0091-card-bullets {
        margin: 12px 0 0;
        padding-left: 20px;
        list-style: disc;
    }

    #tc0091-scope .tc0091-card-bullets li {
        margin: 0 0 2px;
        font-size: 14px;
        line-height: 20px;
        color: var(--on-text, #202E44);
    }

    /* Variante premium: las fichas Black, Infinite y Signature del perfilador
       toman colores inspirados en la tarjeta fisica publicada por BCP. No afecta
       las recomendaciones del comparador ni agrega copy nuevo. */
    #tc0091-scope .tc0091-card.tc0091-card--premium {
        border-color: #74777D;
        background: linear-gradient(145deg, #111214 0%, #343638 58%, #17181A 100%);
        /* La sombra exterior se recortaba contra la caja rectangular del
           scroll horizontal y hacia parecer que habia otra ficha detras. El
           relieve queda dentro de la misma silueta redondeada. */
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.12),
            inset 0 -1px 0 rgba(8, 11, 17, 0.22);
        overflow: hidden;
        background-clip: padding-box;
    }

    /* Signature LATAM Pass: grafito y plata, como la onda metalica de la
       tarjeta fisica. */
    #tc0091-scope .tc0091-card.tc0091-card--premium-signature {
        border-color: #A8ADB2;
        background:
            radial-gradient(ellipse at 94% 10%, rgba(231, 234, 237, 0.60) 0%, rgba(173, 178, 183, 0.26) 34%, transparent 62%),
            radial-gradient(ellipse at 12% 92%, rgba(110, 115, 119, 0.44) 0%, transparent 58%),
            linear-gradient(145deg, #151718 0%, #3F4346 54%, #1B1D1F 100%);
    }

    /* Signature Qore: la misma familia grafito, pero con el gran destello plata
       que forma la Q en el plastico oficial. */
    #tc0091-scope .tc0091-card.tc0091-card--premium-signature-qore {
        border-color: #C2C6CA;
        background:
            radial-gradient(ellipse at 94% 18%, rgba(246, 247, 248, 0.72) 0%, rgba(180, 185, 190, 0.38) 32%, transparent 64%),
            radial-gradient(ellipse at 18% 88%, rgba(101, 105, 109, 0.42) 0%, transparent 60%),
            linear-gradient(145deg, #141516 0%, #414446 55%, #191B1C 100%);
    }

    /* Infinite Sapphire: azul zafiro dominante con facetas electricas. */
    #tc0091-scope .tc0091-card.tc0091-card--premium-sapphire {
        border-color: #6B8FFF;
        background:
            radial-gradient(circle at 92% 12%, rgba(88, 126, 255, 0.88) 0%, rgba(52, 86, 207, 0.48) 34%, transparent 64%),
            radial-gradient(circle at 28% 88%, rgba(29, 72, 190, 0.78) 0%, rgba(20, 49, 130, 0.40) 38%, transparent 68%),
            linear-gradient(145deg, #080D29 0%, #14275F 55%, #090E27 100%);
    }

    /* Infinite Iridium: facetas verdes, violetas y cobrizas sobre base oscura. */
    #tc0091-scope .tc0091-card.tc0091-card--premium-iridium {
        border-color: #669E99;
        background:
            radial-gradient(circle at 92% 8%, rgba(53, 190, 167, 0.80) 0%, rgba(37, 115, 115, 0.42) 34%, transparent 62%),
            radial-gradient(circle at 58% 58%, rgba(124, 67, 165, 0.76) 0%, rgba(83, 51, 119, 0.40) 38%, transparent 68%),
            radial-gradient(circle at 18% 94%, rgba(186, 82, 55, 0.72) 0%, rgba(123, 53, 43, 0.36) 36%, transparent 64%),

        Bot.prototype.init = function () {
            this.validateGraph();
            if (!this.validateElements()) return;
            this.bind();
            this.state.current = this.config.startNode;
        };

        Bot.prototype.validateElements = function () {
            var ok = !!(
                this.el.launcher &&
                this.el.panel &&
                this.el.body &&
                this.el.close &&
                this.el.mask
            );
            if (!ok) {
                console.warn("[tc0091] Elementos base incompletos para iniciar bot");
            }
            return ok;
        };

        Bot.prototype.validateGraph = function () {
            var ids = this.config.nodes.map((n) => n.id);
            this.config.nodes.forEach((n) => {
                if (n.next && ids.indexOf(n.next) === -1) {
                    console.error("Destino inexistente:", n.next);
                }

                if (n.type === "auto" && !n.next) {
                    console.error("Nodo auto sin destino next:", n.id);
                }

                (n.options || []).forEach((o) => {
                    if (o.next && ids.indexOf(o.next) === -1) {
                        console.error("Destino inexistente:", o.next);
                    }
                });

                (n.actions || []).forEach((a) => {
                    if (a.next && ids.indexOf(a.next) === -1) {
                        console.error("Destino inexistente en acción:", a.next);
                    }
                });
            });
        };

        Bot.prototype.getNode = function (id) {
            return this.config.nodes.find((n) => n.id === id);
        };

        // ---------------------------------------------------------------------
        // Deteccion de leads.
        // En /felicitaciones cada tarjeta aprobada del usuario es un
        // <xt21-card-option> y publica su codigo dos veces: en el src de la
        // imagen y en el atributo name del boton. Si el codigo esta en el DOM,
        // el usuario es lead de esa tarjeta.
        // ---------------------------------------------------------------------
        Bot.prototype.getCardCodeFromNode = function (nodo) {
            if (!nodo || !nodo.querySelector) return "";

            // El host del CDN cambia entre produccion y certi, asi que se matchea
            // por la ruta y se toma el nombre del archivo, nunca la URL entera.
            var img = nodo.querySelector('img[src*="/congratulations/img/"]');
            if (img) {
                var partes = String(img.getAttribute("src") || "").split("/congratulations/img/");
                if (partes.length > 1) {
                    var archivo = partes[1].split("?")[0].split("#")[0].split(".")[0];
                    if (archivo) return archivo.toUpperCase();
                }
            }

            var prefijo = "QA_Congratulations_BtnSeleccionar_";
            var boton = nodo.querySelector('[name^="' + prefijo + '"]');
            if (boton) {
                var codigo = String(boton.getAttribute("name") || "").slice(prefijo.length).trim();
                if (codigo) return codigo.toUpperCase();
            }

            return "";
        };

        // Devuelve el <button> nativo "Seleccionar" de la tarjeta con ese codigo.
        //
        // El boton de la pagina NO es un enlace: es un <bcp-button type="button">
        // de Angular que ejecuta la logica del SPA (verificado en los snapshots de
        // referencia/paginas/). No hay href que copiar, asi que el CTA del bot no
        // navega a ningun lado: le da click al boton de verdad. Asi hace exactamente
        // lo mismo que la pagina, sea lo que sea, y no hay una URL que mantener
        // sincronizada si el flujo cambia.
        Bot.prototype.getNativeCardButton = function (codigo) {
            if (!codigo) return null;

            var nodos = document.querySelectorAll("xt21-card-option");
            for (var i = 0; i < nodos.length; i++) {
                if (this.getCardCodeFromNode(nodos[i]) !== String(codigo).toUpperCase()) continue;
                // El <button> real vive dentro del <bcp-button>; si el componente
                // todavia no hidrato, se le da click al host, que reenvia.
                return nodos[i].querySelector("button") ||
                    nodos[i].querySelector('[name^="QA_Congratulations_BtnSeleccionar_"]');
            }

            return null;
        };

        // El cuadro de linea de credito que la pagina abre al elegir una tarjeta.
        //
        // OJO: es el UNICO selector del bot que no se pudo verificar contra
        // referencia/paginas/, y no por descuido: ese cuadro solo existe DESPUES de
        // pulsar "Elegir tarjeta", asi que ninguna captura puede contenerlo. El
        // nombre del elemento es el que Marco midio en certi el 2026-09-11. Si algun
        // dia se consigue su DOM, se ajusta aqui y en getBotonCerrarModalLinea.
        Bot.prototype.getModalLineaCredito = function () {
            var seccion = document.querySelector("section.modify-credit-line-modal");
            if (!seccion) return null;

            // El host <bcp-modal> lleva is-open y la clase "show", o sea que Angular
            // lo ALTERNA en vez de sacarlo del DOM. Por eso no alcanza con que la
            // section exista: hay que comprobar que ademas este abierto, o el bot
            // intentaria cerrar un modal ya cerrado en cada apertura.
            var nodo = seccion.parentNode;
            while (nodo && nodo.tagName) {
                if (nodo.tagName.toLowerCase() === "bcp-modal") {
                    var clases = " " + (nodo.className || "") + " ";
                    var abierto = nodo.hasAttribute("is-open") || clases.indexOf(" show ") !== -1;
                    return abierto ? seccion : null;
                }
                nodo = nodo.parentNode;
            }

            // Sin host reconocible se confia en la presencia.
            return seccion;
        };

        // Su boton "Cerrar".
        //
        // Los dos botones NO viven dentro de .modify-credit-line-modal: van en una
        // section HERMANA, .modify-credit-line-modal__buttons, dentro del mismo
        // .body-content. Es nomenclatura BEM sin anidamiento real, y es la clase de
        // detalle que solo se sabe mirando el DOM de verdad.
        //
        // "Cerrar" es el secundario y "Continuar" el primario, asi que tier los
        // distingue sin ambiguedad. El respaldo por texto cubre que cambie el
        // atributo.
        Bot.prototype.getBotonCerrarModalLinea = function (seccion) {
            var raiz = (seccion && seccion.parentNode) || document;
            var zona = raiz.querySelector("section.modify-credit-line-modal__buttons") ||
                document.querySelector("section.modify-credit-line-modal__buttons");

            if (!zona) return null;

            var secundario = zona.querySelector('bcp-button[tier="secondary"]');
            if (secundario) {
                // El <button> real vive dentro del <bcp-button>; si el componente no
                // hidrato todavia, se le da click al host. Mismo criterio que
                // getNativeCardButton.
                return secundario.querySelector("button") || secundario;
            }

            var botones = zona.querySelectorAll("button");
            for (var i = 0; i < botones.length; i++) {
                if (String(botones[i].textContent || "").trim().toLowerCase() === "cerrar") {
                    return botones[i];
                }
            }

            return null;
        };

        // Al reabrir el bot, ese cuadro se cierra (Marco, 2026-09-22): dos capas
        // encimadas confunden, y si el usuario vuelve al bot es porque quiere seguir
        // consultando, no editar la linea todavia.
        //
        // Se pulsa el boton propio del cuadro en vez de sacarlo del DOM, por lo mismo
        // que "Elegir tarjeta" pulsa el boton nativo: asi corre la logica de la
        // pagina y su estado no queda inconsistente. Cerrarlo deshace la seleccion y
        // devuelve al usuario a la lista de tarjetas, que es justo lo que pide.
        Bot.prototype.cerrarModalLineaCredito = function () {
            var modal = this.getModalLineaCredito();
            if (!modal) return false;

            var boton = this.getBotonCerrarModalLinea(modal);
            if (!boton) {
                // No se cierra a la fuerza: el bot se abre igual y el usuario queda
                // con las dos capas, que es feo pero no lo deja trabado.
                this.debugError("MODAL_LINEA_SIN_BOTON_CERRAR", {});
                return false;
            }

            boton.click();
            return true;
        };

        // Click en "Elegir tarjeta". Tagea el CTA del bot, cierra el panel y le
        // pasa el control al boton nativo de la pagina.
        Bot.prototype.elegirTarjeta = function (codigo) {
            var boton = this.getNativeCardButton(codigo);

            if (!boton) {
                // Pasa si el usuario dejo de ser lead de la tarjeta recomendada
                // despues del render o si el DOM de la pagina cambio.
                // No se cierra el panel: cerrarlo sin que ocurra nada pareceria que
                // el bot se rompio.
                this.debugError("ELEGIR_TARJETA_SIN_BOTON", { codigo: codigo || "" });
                return;
            }

            // La especificacion confirmada por Marco incluye un
            // trackPromotionClick propio del CTA. Se emite solo despues de comprobar
            // que el boton nativo existe, para no medir intentos fallidos.
            this.trackElegirTarjetaClick();

            // Se cierra el PANEL, no el bot (Marco, 2026-09-22). El flujo sigue en la
            // pagina -- se abre el modal de linea de credito -- pero el usuario sigue
            // en /felicitaciones y puede querer volver a consultar, asi que el
            // launcher se queda. El bot recien se va cuando cambia la URL, y de eso
            // se encarga desmontarSiCambioLaRuta().
            //
            // Antes se retiraba el bot entero aqui mismo (cerrarDefinitivo, que ya
            // no existe): al elegir, desaparecian panel, burbuja y launcher.
            this.close();
            this.toggleWelcome(false);
            this.restart();
            boton.click();
        };

        // El nombre de pila del cliente, leido de la pagina. "" si no se pudo.
        //
        // Dos fuentes, y el orden importa:
        //   1. el <h2> "Felicidades, Marco! ...". Es el nombre TAL COMO la pagina se
        //      lo esta mostrando al usuario, ya con sus mayusculas y su recorte, asi
        //      que el bot lo llama igual que el resto de la pantalla;
        //   2. #profitType[data-client-name], que trae el nombre completo en
        //      mayusculas ("MARCO ANTONIO PEREZ"). De ahi hay que sacar el primer
        //      nombre y capitalizarlo por cuenta propia, y eso puede no coincidir
        //      con lo que la pagina muestra (un "JOSE LUIS" quedaria en "Jose").
        //      Por eso es el respaldo y no la fuente principal.
        //
        // Ambas estan en las cuatro capturas de referencia/paginas/.
        Bot.prototype.getNombreCliente = function () {
            var h2s = document.querySelectorAll("h2");
            for (var i = 0; i < h2s.length; i++) {
                var texto = String(h2s[i].textContent || "");
                var m = texto.match(/felicidades[,\s]+([^!¡]{1,40})!/i);
                if (m) {
                    var delH2 = this.normalizarNombre(m[1]);
                    if (delH2) return delH2;
                }
            }

            var nodo = document.getElementById("profitType");
            var completo = nodo ? nodo.getAttribute("data-client-name") : "";
            var primero = String(completo || "").trim().split(/\s+/)[0] || "";
            return this.normalizarNombre(primero);
        };

        // Deja el nombre presentable, o devuelve "" si no parece un nombre.
        // El filtro es deliberadamente estrecho: si llega cualquier cosa rara, el
        // bot prefiere saludar sin nombre antes que saludar mal.
        Bot.prototype.normalizarNombre = function (valor) {
            var limpio = String(valor == null ? "" : valor).replace(/\s+/g, " ").trim();

            if (limpio.length < 2 || limpio.length > 24) return "";
            if (!/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ'\- ]*$/.test(limpio)) return "";

            // "MARCO" -> "Marco". Si ya viene bien escrito desde el <h2>, esto lo deja
            // igual. Se capitaliza cada palabra por los nombres compuestos.
            return limpio
                .toLowerCase()
                .split(" ")
                .map(function (p) {
                    return p ? p.charAt(0).toUpperCase() + p.slice(1) : p;
                })
                .join(" ");
        };

        // El titulo del nodo, personalizado con el nombre si el nodo lo admite y la
        // pagina lo dio. tituloConNombre lleva el marcador {nombre}; si no hay
        // nombre se usa el "title" de siempre, que es el saludo sin personalizar.
        Bot.prototype.resolveTitulo = function (node) {
            var base = (node || {}).title || "";
            if (!node || !node.tituloConNombre) return base;

            var nombre = this.getNombreCliente();
            if (!nombre) return base;

            // El titulo se inserta crudo en el HTML (lleva entidades como &#128075;),
            // asi que el nombre va escapado a mano y en estricto.
            return node.tituloConNombre.replace("{nombre}", this.escaparDatoDePagina(nombre));
        };

        Bot.prototype.getLeadCardCodes = function () {
            var self = this;
            var codigos = [];
            var vistos = {};
            var nodos = document.querySelectorAll("xt21-card-option");

            for (var i = 0; i < nodos.length; i++) {
                var codigo = self.getCardCodeFromNode(nodos[i]);
                if (codigo && !vistos[codigo]) {
                    vistos[codigo] = true;
                    codigos.push(codigo);
                }
            }

            return codigos;
        };

        // El acceso al comparador de acumulacion nombra solo los programas que
        // realmente tiene el usuario entre sus tarjetas aprobadas:
        // LATAM Pass -> millas, Qore -> puntos, ambos -> millas / puntos.
        // Si la deteccion falla o ninguna tarjeta pertenece a esos programas,
        // conserva el texto general para no afirmar una categoria incorrecta.
        Bot.prototype.getAccumulationPrograms = function (leads) {
            var disponibles = {};
            var tieneMillas = false;
            var tienePuntos = false;
            var tabla = (((this.config || {}).comparador || {}).millas || {});
            var secciones = tabla.secciones || [];

            for (var i = 0; i < leads.length; i++) disponibles[leads[i]] = true;

            // Sin deteccion, el fallback del comparador ensena los dos programas.
            if (!leads.length) return { millas: true, puntos: true };

            secciones.forEach(function (seccion) {
                (seccion.filas || []).forEach(function (fila) {
                    if (!fila || !fila.codigo || !disponibles[fila.codigo]) return;
                    if (seccion.programa === "millas") tieneMillas = true;
                    if (seccion.programa === "puntos") tienePuntos = true;
                });
            });

            return { millas: tieneMillas, puntos: tienePuntos };
        };

        Bot.prototype.resolveAccumulationOptionLabel = function () {
            var programas = this.getAccumulationPrograms(this.getLeadCardCodes());

            if (programas.millas && programas.puntos) return "Acumulación de millas / Puntos";
            if (programas.millas) return "Acumulación de millas";
            if (programas.puntos) return "Acumulación de puntos";
            return "Acumulación de millas / Puntos";
        };

        Bot.prototype.resolveOptionLabel = function (option) {
            if (option && option.labelPorProgramasAcumulacion) {
                return this.resolveAccumulationOptionLabel();
            }
            return (option || {}).label || "";
        };

        Bot.prototype.filtrarPorLeads = function (tarjetas, leads) {
            var lista = Array.isArray(tarjetas) ? tarjetas : [];
            var disponibles = {};

            for (var i = 0; i < leads.length; i++) {
                disponibles[leads[i]] = true;
            }

            // Una tarjeta sin codigo no se puede detectar, asi que nunca entra.
            return lista.filter(function (t) {
                return !!(t && t.codigo && disponibles[t.codigo]);
            });
        };

        // Cada tarjeta se pinta con el CTA comun del perfilador, salvo que traiga
        // uno propio. Se devuelven copias: la config no se toca.
        Bot.prototype.conCta = function (tarjetas, cfg) {
            var ctaComun = cfg.cta || null;

            return tarjetas.map(function (t) {
                return {
                    codigo: t.codigo,
                    name: t.name,
                    description: t.description,
                    bullets: t.bullets,
                    badge: t.badge || "",
                    cta: t.cta || ctaComun,
                };
            });
        };

        // Corte del caso A: hasta maxSinDestacada tarjetas del orden, y la
        // destacada siempre al final y solo si el usuario la tiene.
        //
        // La ficha de la destacada vive en config.perfilador.destacada, NO en la
        // lista de cada criterio (Marco, 2026-09-21, al cambiar la Visa Oro LATAM
        // Pass por la Visa Oro Qore). Antes se sacaba de la lista, lo que obligaba
        // a que la destacada estuviera en el caso A de los cuatro criterios: con
        // TCRORL se cumplia por casualidad, con TCRLY3 no. Meterla en el caso A de
        // "viajar" para lograrlo habria roto la deteccion de caso, porque ese caso
        // A significa "el usuario tiene una tarjeta de millas" y la Oro Qore no lo
        // es. Separandola de las listas, el reemplazo no toca esa logica.
        Bot.prototype.recortarConDestacada = function (tarjetas, cfg, leads, tope) {
            var destacadaCfg = cfg.destacada || {};
            var codigoDestacada = destacadaCfg.codigo || "";

            // El tope lo pone el llamador porque los dos casos cuentan distinto:
            // el A reserva el cuarto puesto para la destacada, el B solo le baja
            // el corte en uno cuando toca, para que el total siga siendo 4.
            var limite = Number(tope);
            if (!Number.isFinite(limite) || limite < 0) limite = this.getTopeSinDestacada(cfg);

            var resto = [];

            tarjetas.forEach(function (t) {
                // La destacada nunca compite por los primeros puestos ni se repite:
                // si el criterio ya la lista, aqui se descarta y se vuelve a anadir
                // abajo con su ficha propia.
                if (codigoDestacada && t.codigo === codigoDestacada) return;
                resto.push(t);
            });

            var seleccion = resto.slice(0, limite);

            if (this.tieneDestacada(cfg, leads)) {
                seleccion.push({
                    codigo: codigoDestacada,
                    name: destacadaCfg.name,
                    description: destacadaCfg.description,
                    bullets: destacadaCfg.bullets,
                    // El badge es lo que le pone el borde verde a la tarjeta.
                    badge: destacadaCfg.badge || "",
                });
            }

            return seleccion;
        };

        Bot.prototype.resolveAccumulationComparator = function (tabla, leads) {
            var disponibles = {};
            var programas = this.getAccumulationPrograms(leads);
            var seccionesVisibles = [];
            var totalFilas = 0;

            for (var i = 0; i < leads.length; i++) disponibles[leads[i]] = true;

            (tabla.secciones || []).forEach(function (seccion) {
                if (!programas[seccion.programa]) return;

                var filas = (seccion.filas || []).filter(function (fila) {
                    return !leads.length || !!(fila.codigo && disponibles[fila.codigo]);
                });
                if (!filas.length) return;

                seccionesVisibles.push({
                    encabezado: seccion.encabezado || [],
                    encabezadoConAmbos: seccion.encabezadoConAmbos || null,
                    filas: filas,
                });
                totalFilas += filas.length;
            });

            // Caso excepcional: una tarjeta aprobada sin programa de millas ni
            // puntos conserva la salida previa de "No Aplica".
            if (!seccionesVisibles.length && leads.length && tabla.sinPrograma) {
                var filasSinPrograma = (tabla.sinPrograma.filas || []).filter(function (fila) {
                    return !!(fila.codigo && disponibles[fila.codigo]);
                });
                if (filasSinPrograma.length) {
                    seccionesVisibles.push({
                        encabezado: tabla.sinPrograma.encabezado || [],
                        filas: filasSinPrograma,
                    });
                    totalFilas += filasSinPrograma.length;
                }
            }

            // Con las dos tablas en pantalla, "Tarjeta" no dice cual es cual: la
            // primera columna pasa a nombrar el programa (LATAM / Qore). Con una
            // sola tabla se queda "Tarjeta" (Marco, 2026-09-23).
            var ambosProgramas = seccionesVisibles.length > 1;
            var lineas = [tabla.intro || "", ""];
            seccionesVisibles.forEach(function (seccion, indice) {
                var encabezado = ambosProgramas && seccion.encabezadoConAmbos
                    ? seccion.encabezadoConAmbos
                    : seccion.encabezado;
                lineas.push("| " + encabezado.join(" | ") + " |");
                lineas.push("| --- | --- |");
                seccion.filas.forEach(function (fila) {
                    lineas.push("| " + fila.nombre + " | " + fila.valor + " |");
                });
                if (indice < seccionesVisibles.length - 1) lineas.push("");
            });

            return { text: lineas.join("\n"), filas: totalFilas };
        };

        // Tabla comparativa filtrada por leads. Devuelve el texto markdown listo
        // para formatRichText, que es el mismo camino que usaban las tablas cuando
        // estaban escritas a mano en el nodo.
        Bot.prototype.resolveComparador = function (tablaId) {
            var tabla = (this.config.comparador || {})[tablaId];

            if (!tabla) {
                this.debugError("COMPARADOR_TABLA_INEXISTENTE", { tabla: tablaId });
                return null;
            }

            var leads = this.getLeadCardCodes();
            var filas = tabla.filas || [];

            if (!leads.length) {
                this.debugError("COMPARADOR_SIN_LEADS", { tabla: tablaId });
            }

            if (tabla.secciones) {
                return this.resolveAccumulationComparator(tabla, leads);
            }

            // Sin deteccion se muestran todas, igual que en el perfilador: una
            // lectura vacia significa que el selector fallo, no que el usuario no
            // tenga tarjetas.
            if (leads.length) {
                var disponibles = {};
                for (var i = 0; i < leads.length; i++) disponibles[leads[i]] = true;
                filas = filas.filter(function (f) {
                    return !!(f.codigo && disponibles[f.codigo]);
                });
            }

            var lineas = [tabla.intro, ""];
            lineas.push("| " + (tabla.encabezado || []).join(" | ") + " |");
            lineas.push("| --- | --- |");
            filas.forEach(function (f) {
                lineas.push("| " + f.nombre + " | " + f.valor + " |");
            });

            // La nota al pie solo acompaña a la tabla si alguna fila que quedo
            // visible lleva el asterisco. Filtradas por lead, un usuario puede
            // no tener ninguna de las tarjetas que lo llevan, y entonces la
            // llamada no tendria a que referirse.
            var nota = "";
            if (tabla.nota) {
                var conAsterisco = filas.some(function (f) {
                    return String(f.valor || "").indexOf("*") !== -1;
                });
                if (conAsterisco) nota = tabla.nota;
            }

            return { text: lineas.join("\n"), filas: filas.length, nota: nota };
        };

        // Devuelve {intro, tarjetas, caso} ya resueltos para el nodo, o null si el
        // criterio no existe en la config.
        // La tarjeta recomendada de q21-q24 solo se pinta si el usuario la tiene
        // aprobada (Marco, 2026-09-11). La regla es la misma que rige el perfilador:
        // el bot no muestra tarjetas que no esten en el lead del cliente.
        //
        // Antes se pintaba siempre, fija en la Visa Oro. Con la tabla ya filtrada,
        // a quien no la tuviera se le recomendaba una tarjeta que no figuraba en su
        // propia tabla y cuyo boton, al no existir en la pagina, no hacia nada.
        //
        // Sin deteccion tampoco se pinta: no se puede afirmar que sea lead.
        Bot.prototype.resolveRecommendation = function (node) {
            var rec = (node || {}).recommendation;
            if (!rec) return null;

            var leads = this.getLeadCardCodes();
            var codigo = String(rec.codigo || "").toUpperCase();

            if (!codigo) {
                this.debugError("RECOMENDACION_SIN_CODIGO", { nodo: (node || {}).id || "" });
                return null;
            }

            for (var i = 0; i < leads.length; i++) {
                if (leads[i] === codigo) return rec;
            }

            this.debugError("RECOMENDACION_NO_ES_LEAD", {
                nodo: (node || {}).id || "",
                codigo: codigo,
            });
            return null;
        };

        Bot.prototype.getTopeTarjetas = function (cfg) {
            var tope = Number((cfg || {}).maxTarjetas);
            return Number.isFinite(tope) && tope >= 0 ? tope : 4;
        };

        Bot.prototype.getTopeSinDestacada = function (cfg) {
            var tope = Number((cfg || {}).maxSinDestacada);
            return Number.isFinite(tope) && tope >= 0 ? tope : 3;
        };

        // Unico sitio donde se decide si al usuario le toca la destacada. Ser lead
        // no se puede dar por supuesto: sin el codigo en el DOM, no se muestra.
        Bot.prototype.tieneDestacada = function (cfg, leads) {
            var destacadaCfg = (cfg || {}).destacada || {};
            if (!destacadaCfg.codigo || !destacadaCfg.name) return false;
            return (leads || []).indexOf(destacadaCfg.codigo) !== -1;
        };

        Bot.prototype.resolvePerfilador = function (criterioId) {
            var cfg = this.config.perfilador || {};
            var criterio = (cfg.criterios || {})[criterioId];

            if (!criterio) {
                this.debugError("PERFILADOR_CRITERIO_INEXISTENTE", { criterio: criterioId });
                return null;
            }

            var casoA = criterio.casoA || {};
            var casoB = criterio.casoB || {};
            var leads = this.getLeadCardCodes();

            // Sin deteccion no se puede filtrar. En la pagina real siempre hay al
            // menos una tarjeta aprobada, asi que esto significa que el selector
            // fallo, no que el usuario no tenga ninguna.
            if (!leads.length) {
                this.debugError("PERFILADOR_SIN_LEADS", {
                    criterio: criterioId,
                    fallback: cfg.sinDeteccion || "casoA",
                });
                var porDefecto = cfg.sinDeteccion === "casoB" ? casoB : casoA;
                var tope = this.getTopeTarjetas(cfg);
                // Sin destacada: la Visa Oro solo se muestra si el usuario la tiene
                // (Marco), y aqui no hay forma de saberlo. Se corta sin mas.
                return {
                    caso: cfg.sinDeteccion === "casoB" ? "B" : "A",
                    detectado: false,
                    intro: porDefecto.intro || "",
                    tarjetas: this.conCta((porDefecto.tarjetas || []).slice(0, tope), cfg),
                    nota: this.getNotaPerfilador((porDefecto.tarjetas || []).slice(0, tope), cfg),
                };
            }

            var deCasoA = this.filtrarPorLeads(casoA.tarjetas, leads);

            if (deCasoA.length) {
                var mostradasA = this.recortarConDestacada(deCasoA, cfg, leads, this.getTopeSinDestacada(cfg));
                return {
                    caso: "A",
                    detectado: true,
                    intro: casoA.intro || "",
                    tarjetas: this.conCta(mostradasA, cfg),
                    nota: this.getNotaPerfilador(mostradasA, cfg),
                };
            }

            // Caso B: no hay ninguna tarjeta del caso A. Desde el 2026-09-21 tambien
            // lleva destacada (Marco: "tambien en verde"). El tope baja en uno solo
            // cuando el usuario la tiene, para que el total siga siendo maxTarjetas
            // y nadie pierda una tarjeta por el cambio.
            var topeCasoB = this.getTopeTarjetas(cfg);
            if (this.tieneDestacada(cfg, leads)) topeCasoB -= 1;

            var mostradasB = this.recortarConDestacada(this.filtrarPorLeads(casoB.tarjetas, leads), cfg, leads, topeCasoB);
            return {
                caso: "B",
                detectado: true,
                intro: casoB.intro || "",
                tarjetas: this.conCta(mostradasB, cfg),
                nota: this.getNotaPerfilador(mostradasB, cfg),
            };
        };

        // La llamada al pie del perfilador solo sale si alguna tarjeta que se
        // muestra lleva el asterisco en una viñeta. Se quitan antes las negritas
        // (**…**) para que sus asteriscos no cuenten. Misma regla que la nota del
        // comparador: sin asterisco arriba, la nota no tendria a que referirse.

        Bot.prototype.bindScrollIsolation = function () {
            var self = this;
            var scrollBox = this.el.body;

            if (!scrollBox || scrollBox.dataset.tc0091ScrollBound === "true") return;

            function canScroll(el) {
                return el && el.scrollHeight > el.clientHeight;
            }

            function isAtTop(el) {
                return el.scrollTop <= 0;
            }

            function isAtBottom(el) {
                return el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
            }

            // Dentro de un carrusel el gesto es horizontal y lo maneja el
            // scroll nativo del track. Hay que salir sin preventDefault o el
            // swipe no mueve nada: el aislamiento de abajo cancela el gesto
            // cuando el panel no tiene scroll vertical, que es justo el caso
            // de una pantalla corta con tarjetas. Se mantiene el
            // stopPropagation para no arrastrar la pagina anfitriona.
            function enCarrusel(e) {
                var target = e.target;
                if (!target || typeof target.closest !== "function") return false;
                return !!target.closest(".tc0091-carousel-track");
            }

            scrollBox.addEventListener(
                "wheel",
                function (e) {
                    e.stopPropagation();

                    if (enCarrusel(e)) return;

                    if (!canScroll(scrollBox)) {
                        e.preventDefault();
                        return;
                    }

                    var deltaY = e.deltaY;
                    var upOnTop = deltaY < 0 && isAtTop(scrollBox);
                    var downOnBottom = deltaY > 0 && isAtBottom(scrollBox);

                    if (upOnTop || downOnBottom) {
                        e.preventDefault();
                    }
                },
                { passive: false },
            );

            scrollBox.addEventListener(
                "touchstart",
                function (e) {
                    if (!e.touches || !e.touches.length) return;
                    self.scrollState.touchStartY = e.touches[0].clientY;
                },
                { passive: true },
            );

            scrollBox.addEventListener(
                "touchmove",
                function (e) {
                    e.stopPropagation();

                    if (enCarrusel(e)) return;

                    if (!canScroll(scrollBox)) {
                        e.preventDefault();
                        return;
                    }

                    if (!e.touches || !e.touches.length) return;

                    var currentY = e.touches[0].clientY;
                    var delta = self.scrollState.touchStartY - currentY;
                    var upOnTop = delta < 0 && isAtTop(scrollBox);
                    var downOnBottom = delta > 0 && isAtBottom(scrollBox);

                    if (upOnTop || downOnBottom) {
                        e.preventDefault();
                    }
                },
                { passive: false },
            );

            scrollBox.dataset.tc0091ScrollBound = "true";
        };

        Bot.prototype.lockPageScroll = function () {
            if (this.pageScrollState.locked) return;

            this.pageScrollState.bodyOverflow = document.body.style.overflow;
            this.pageScrollState.htmlOverflow = docEl ? docEl.style.overflow : "";
            document.body.style.overflow = "hidden";
            if (docEl) {
                docEl.style.overflow = "hidden";

        Bot.prototype.unlockPageScroll = function () {
            var docEl = document.documentElement;

            if (!this.pageScrollState.locked) {
                // Defensive cleanup: if lock state got out of sync, avoid leaving the page frozen.
                if (document.body.style.overflow === "hidden") {
                    document.body.style.overflow = "";
                }
                if (docEl && docEl.style.overflow === "hidden") {
                    docEl.style.overflow = "";
                }
                return;
            }

            document.body.style.overflow = this.pageScrollState.bodyOverflow || "";
            if (docEl) {
                docEl.style.overflow = this.pageScrollState.htmlOverflow || "";
            }
            this.pageScrollState.locked = false;

        // Una pantalla cuenta como "Respuesta" si le contesta algo al usuario, no si
        // solo le ofrece botones. Los cuatro menus (q0, q1, q2, q3) quedan fuera; las
        // once restantes entran: q11-q14 (tarjetas recomendadas), q21-q24 (tablas) y
        // q31-q33 (dudas). Un menu es un nodo cuyo id tiene dos caracteres o menos
        // ("q0", "q1"); una respuesta baja un nivel mas ("q11", "q21").
        Bot.prototype.isRespuestaNode = function (node) {

        // position = "{Flujo} - {Respuesta}", con la numeracion de ESTE arbol
        // (Marco, 2026-09-11), que es la misma con la que se entregan las pantallas
        // y con la que estan escritos los mockups y correcciones-wording.md:

        //   q11 -> "1 - 1.1"     q21 -> "2 - 2.1"     q31 -> "3 - 3.1"
        //
        // El id interno "qNN" no sale del snippet. Los ids codifican la profundidad,
        // asi que la numeracion se deriva: primer digito = rama, el resto = pantalla.
        Bot.prototype.getPositionArbol = function (nodeId) {
            var digitos = String(nodeId || "").replace(/\D/g, "");
            if (!digitos) return "";

            var rama = digitos.charAt(0);
            // Una hoja mas profunda que 1.1 se leeria "1.1.1"; hoy el arbol solo
            // llega a dos niveles, pero la regla aguanta si se agrega uno mas.
            var pantalla = digitos.split("").join(".");

        // La animacion de entrada aplica en todos los anchos: en desktop crece

        Bot.prototype.showPanel = function () {
            var panel = this.el.panel;
            if (!panel) return;

            panel.style.display = "flex";

            if (!this.shouldAnimatePanel()) {
                panel.classList.add("tc0091-panel--open");
                return;
            }

            panel.classList.remove("tc0091-panel--open");

            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    panel.classList.add("tc0091-panel--open");
                });
            });
        };

        Bot.prototype.hidePanel = function () {
            var panel = this.el.panel;
            if (!panel) return;

            if (!this.shouldAnimatePanel()) {
                panel.classList.remove("tc0091-panel--open");
                panel.style.display = "none";
                return;
            }

            panel.classList.remove("tc0091-panel--open");

            var self = this;
            var done = false;
            var finish = function () {
                if (done) return;
                done = true;
                panel.removeEventListener("transitionend", onTransitionEnd);
                if (!panel.classList.contains("tc0091-panel--open")) {
                    panel.style.display = "none";
                }
            };
            var onTransitionEnd = function (e) {
                if (e && e.target !== panel) return;
                if (e && e.propertyName && e.propertyName !== "transform") return;
                finish();
            };

            panel.addEventListener("transitionend", onTransitionEnd);
            setTimeout(finish, 360);
        };

        Bot.prototype.open = function () {

            this.cerrarModalLineaCredito();

            this.showPanel();
            this.el.mask.style.display = "block";
            if (this.el.launcher) {
                this.el.launcher.style.display = "none";

            this.lockPageScroll();

            if (!isAlreadyOpen) {
                this.trackOpenBotClick();

            this.checkPendingTransition();

            // El bot LLEGA en vez de estar ya puesto (Marco, 2026-09-22: "que entre
            // mas animadamente y no todo seco"). Antes q0 aparecia de golpe, en unos
            // 130ms; ahora primero se ven los puntitos y despues el saludo, igual que
            // con cualquier otra respuesta.

            // un error, o ya habia una espera en curso, se pinta lo que corresponda.
            if (!this.state.chatLog.length && !this.state.errorRecovery && !this.isWaiting()) {
                this.startWaitingTransition(this.state.current, "", this.getAperturaDuration());
                return;

        Bot.prototype.close = function () {

        Bot.prototype.restart = function () {
            this.cancelWaitingTransition();
            this.clearPendingTransition();
            this.state.current = this.config.startNode;
            this.state.nextMessageId = 1;
            this.state.chatLog = [];
            this.state.finished = false;
            this.state.errorRecovery = null;
            this.state.activeQuestionMessageId = null;
            this.state.runtimeError = null;
            this.state.missingNextErrorCount = 0;
            this.animatedUpTo = 0;
            this.carouselIndex = {};
            this.render();
        };

        Bot.prototype.debugError = function (type, payload) {
            if (!type) return;
            console.debug("[tc0091][error:" + type + "]", payload || {});
        };

        Bot.prototype.getMissingNextNodeMaxRetries = function () {
            var cfg = this.config.errorHandling || {};
            var value = Number(cfg.missingNextNodeMaxRetries);
            return Number.isFinite(value) && value > 0 ? Math.floor(value) : 3;
        };

        Bot.prototype.getFallbackNodeId = function () {
            var cfg = this.config.errorHandling || {};
            return cfg.fallbackNodeId || this.config.startNode;
        };

        Bot.prototype.clearRuntimeError = function () {
            this.state.runtimeError = null;
        };

        Bot.prototype.setRuntimeError = function (errorData) {
            this.state.runtimeError = errorData || null;
        };

        Bot.prototype.handleMissingNextNodeError = function (nextId, source) {
            var origin = source || "unknown";
            var maxRetries = this.getMissingNextNodeMaxRetries();

            this.state.missingNextErrorCount += 1;

            var attempts = this.state.missingNextErrorCount;
            this.debugError("MISSING_NEXT_NODE", {
                fromNode: this.state.current,
                nextId: nextId,
                source: origin,
                attempts: attempts,
                maxRetries: maxRetries,
            });

            if (attempts > maxRetries) {
                var fallbackId = this.getFallbackNodeId();
                this.debugError("MISSING_NEXT_NODE_FALLBACK", {
                    fallbackNodeId: fallbackId,
                    reason: "max-retries-reached",
                });
                this.clearRuntimeError();
                this.restart();
                return;
            }

            var retriesLeft = maxRetries - attempts;
            var helperText =
                retriesLeft > 0
                    ? "Puedes reintentar."
                    : "En el siguiente intento te llevaremos al inicio.";

            this.setRuntimeError({
                type: "missing-next-node",
                nextId: nextId,
                source: origin,
                attempts: attempts,
                maxRetries: maxRetries,
                text:
                    "No pudimos continuar esta ruta en este momento. " +
                    "Intento " +
                    attempts +
                    " de " +
                    maxRetries +
                    ". " +
                    helperText,
            });

            this.render();
        };

        Bot.prototype.isWaiting = function () {

            if (this.transitionState.timerId) {
                clearTimeout(this.transitionState.timerId);

            this.transitionState.waiting = false;
            this.transitionState.pendingNextId = null;
            this.transitionState.timerId = null;
            this.transitionState.pendingLabel = null;
            this.transitionState.pendingUsageBubble = null;
            this.transitionState.autoNodeId = null;
        };

        Bot.prototype.savePendingTransition = function () {
            if (!this.isWaiting() || !this.transitionState.pendingNextId) return;

            var transition = {
                nodeId: this.state.current,
                selectedLabel: this.transitionState.pendingLabel || "",
                nextId: this.transitionState.pendingNextId,
                timestamp: Date.now(),
            };

            try {
                sessionStorage.setItem(
                    "tc0091_pending_transition",
                    JSON.stringify(transition)
                );
            } catch (e) {
                console.warn("[tc0091] No se pudo guardar transición pendiente", e);
            }
        };

        Bot.prototype.checkPendingTransition = function () {
            var transitionJson = null;

            try {
                transitionJson = sessionStorage.getItem("tc0091_pending_transition");
            } catch (e) {
                console.warn("[tc0091] No se pudo acceder a sessionStorage", e);
                return;
            }

            if (transitionJson) {
                try {
                    var transition = JSON.parse(transitionJson);

                    // Recovery only makes sense if the current chat actually contains
                    // the previously selected user message in the same node.
                    var hasMatchingUserMessage = this.state.chatLog.some(function (entry) {
                        return (
                            entry &&
                            entry.role === "user" &&
                            entry.text === (transition.selectedLabel || "")
                        );
                    });

                    var canRecover =
                        !!transition &&
                        transition.nodeId === this.state.current &&
                        hasMatchingUserMessage;

                    if (!canRecover) {
                        this.clearPendingTransition();
                        return;
                    }

                    this.state.errorRecovery = {
                        nodeId: transition.nodeId,
                        selectedLabel: transition.selectedLabel,
                        nextId: transition.nextId,
                    };
                } catch (e) {
                    console.warn("[tc0091] Error parsing pending transition", e);
                    this.clearPendingTransition();
                }
            }
        };

        Bot.prototype.clearPendingTransition = function () {
            try {
                sessionStorage.removeItem("tc0091_pending_transition");
            } catch (e) {
                console.warn("[tc0091] No se pudo limpiar transición pendiente", e);
            }
            this.state.errorRecovery = null;
        };

        Bot.prototype.getThinkingDuration = function () {
            var cfg = this.config.thinking || {};
            var value = Number(cfg.durationMs);

        };

        // La pausa de la primera pantalla. Cae en durationMs si no se configuro,
        // asi que quitar aperturaMs no rompe nada: solo iguala las dos esperas.
        Bot.prototype.getAperturaDuration = function () {
            var cfg = this.config.thinking || {};
            var value = Number(cfg.aperturaMs);
            return Number.isFinite(value) && value >= 0 ? value : this.getThinkingDuration();
        };

            return !!cfg.enabled;

        Bot.prototype.maybeAdvanceAutoNode = function () {
            if (this.isWaiting()) return;

            var node = this.getNode(this.state.current);
            if (!this.isAutoNode(node)) {
                this.transitionState.autoNodeId = null;
                return;
            }

            if (this.transitionState.autoNodeId === node.id) return;
            this.transitionState.autoNodeId = node.id;

            if (this.shouldUseThinking()) {

                return;

            this.applyTransition(node.next);
