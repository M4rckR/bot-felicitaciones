        }

            opacity: 0.8;
        }

        55% {

        }

        62.5% {

        Bot.prototype.init = function () {
            this.validateGraph();
            if (!this.validateElements()) return;
            this.bind();
            this.state.current = this.config.startNode;
        };

        Bot.prototype.validateElements = function () {
            var ok = !!(
                this.el.launcher &&
                this.el.panel &&
                this.el.body &&
                this.el.close &&
                this.el.mask
            );
            if (!ok) {
                console.warn("[tc0080] Elementos base incompletos para iniciar bot");
            }
            return ok;
        };

        Bot.prototype.validateGraph = function () {
            var ids = this.config.nodes.map((n) => n.id);
            this.config.nodes.forEach((n) => {
                if (n.next && ids.indexOf(n.next) === -1) {
                    console.error("Destino inexistente:", n.next);
                }

                if (n.type === "auto" && !n.next) {
                    console.error("Nodo auto sin destino next:", n.id);
                }

                (n.options || []).forEach((o) => {
                    if (o.next && ids.indexOf(o.next) === -1) {
                        console.error("Destino inexistente:", o.next);
                    }
                });

                (n.actions || []).forEach((a) => {
                    if (a.next && ids.indexOf(a.next) === -1) {
                        console.error("Destino inexistente en acción:", a.next);
                    }
                });
            });
        };

        Bot.prototype.getNode = function (id) {
            return this.config.nodes.find((n) => n.id === id);
        };

        Bot.prototype.bind = function () {
            var self = this;

            this.toggleWelcome(true);

            if (this.el.welcome) {
                this.el.welcome.addEventListener("click", function () {
                    self.open();
                });
                this.el.welcome.addEventListener("keydown", function (e) {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        self.open();
                    }
                });
            }

            this.el.launcher.addEventListener("click", function () {
                self.open();
            });
            this.el.launcher.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    self.open();
                }
            });
            this.el.close.addEventListener("click", function () {
                self.close();
            });
            this.el.panel.addEventListener("click", function (e) {
                if (e.target && e.target.closest && e.target.closest(".tc0080-close")) {
                    self.close();
                }
            });
            this.el.mask.addEventListener("click", function (e) {
                if (e && e.preventDefault) e.preventDefault();
                if (e && e.stopPropagation) e.stopPropagation();
                self.closeFromMask();
            });

            this.bindScrollIsolation();
            this.bindLauncherMobileOffset();
            this.scheduleLauncherMobileOffsetUpdate();
        };

        Bot.prototype.toggleWelcome = function (isVisible) {
            if (!this.el.welcome) return;
            this.el.welcome.style.display = isVisible ? "flex" : "none";
        };

        Bot.prototype.isMobileViewport = function () {
            return !!window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
        };

        Bot.prototype.getLauncherLiftTriggerNode = function () {
            return document.querySelector(".boton--pulsante") || document.querySelector(".boton-pulsante");
        };

        Bot.prototype.shouldLiftLauncherOnMobile = function () {
            var trigger = this.getLauncherLiftTriggerNode();
            if (!trigger || !trigger.getBoundingClientRect) return false;
            return trigger.getBoundingClientRect().y <= 0;
        };

        Bot.prototype.updateLauncherMobileOffset = function () {
            if (!this.el.launcher) return;

            var launcherLiftClass = "tc0080-launcher--lifted";
            var welcomeLiftClass = "tc0080-launcher-welcome-wrap--lifted";

            if (!this.isMobileViewport()) {
                this.el.launcher.classList.remove(launcherLiftClass);
                if (this.el.welcome) {
                    this.el.welcome.classList.remove(welcomeLiftClass);
                }
                return;
            }

            var shouldLift = this.shouldLiftLauncherOnMobile();
            this.el.launcher.classList.toggle(launcherLiftClass, shouldLift);
            if (this.el.welcome) {
                this.el.welcome.classList.toggle(welcomeLiftClass, shouldLift);
            }
        };

        Bot.prototype.scheduleLauncherMobileOffsetUpdate = function () {
            var self = this;
            if (this.scrollState.launcherOffsetRafId !== null) return;

            this.scrollState.launcherOffsetRafId = requestAnimationFrame(function () {
                self.scrollState.launcherOffsetRafId = null;
                self.updateLauncherMobileOffset();
            });
        };

        Bot.prototype.bindLauncherMobileOffset = function () {
            var self = this;
            if (this._launcherOffsetBound) return;

            this._onLauncherOffsetScroll = function () {
                self.scheduleLauncherMobileOffsetUpdate();
            };

            this._onLauncherOffsetResize = function () {
                self.scheduleLauncherMobileOffsetUpdate();
            };

            window.addEventListener("scroll", this._onLauncherOffsetScroll, { passive: true });
            window.addEventListener("resize", this._onLauncherOffsetResize);
            window.addEventListener("orientationchange", this._onLauncherOffsetResize);
            this._launcherOffsetBound = true;
        };

        Bot.prototype.unbindLauncherMobileOffset = function () {
            if (!this._launcherOffsetBound) return;

            window.removeEventListener("scroll", this._onLauncherOffsetScroll);
            window.removeEventListener("resize", this._onLauncherOffsetResize);
            window.removeEventListener("orientationchange", this._onLauncherOffsetResize);

            this._onLauncherOffsetScroll = null;
            this._onLauncherOffsetResize = null;
            this._launcherOffsetBound = false;

            if (this.scrollState.launcherOffsetRafId !== null) {
                cancelAnimationFrame(this.scrollState.launcherOffsetRafId);
                this.scrollState.launcherOffsetRafId = null;
            }
        };

        Bot.prototype.bindScrollIsolation = function () {
            var self = this;
            var scrollBox = this.el.body;

            if (!scrollBox || scrollBox.dataset.tc0080ScrollBound === "true") return;

            function canScroll(el) {
                return el && el.scrollHeight > el.clientHeight;
            }

            function isAtTop(el) {
                return el.scrollTop <= 0;
            }

            function isAtBottom(el) {
                return el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
            }

            scrollBox.addEventListener(
                "wheel",
                function (e) {
                    e.stopPropagation();

                    if (!canScroll(scrollBox)) {
                        e.preventDefault();
                        return;
                    }

                    var deltaY = e.deltaY;
                    var upOnTop = deltaY < 0 && isAtTop(scrollBox);
                    var downOnBottom = deltaY > 0 && isAtBottom(scrollBox);

                    if (upOnTop || downOnBottom) {
                        e.preventDefault();
                    }
                },
                { passive: false },
            );

            scrollBox.addEventListener(
                "touchstart",
                function (e) {
                    if (!e.touches || !e.touches.length) return;
                    self.scrollState.touchStartY = e.touches[0].clientY;
                },
                { passive: true },
            );

            scrollBox.addEventListener(
                "touchmove",
                function (e) {
                    e.stopPropagation();

                    if (!canScroll(scrollBox)) {
                        e.preventDefault();
                        return;
                    }

                    if (!e.touches || !e.touches.length) return;

                    var currentY = e.touches[0].clientY;
                    var delta = self.scrollState.touchStartY - currentY;
                    var upOnTop = delta < 0 && isAtTop(scrollBox);
                    var downOnBottom = delta > 0 && isAtBottom(scrollBox);

                    if (upOnTop || downOnBottom) {
                        e.preventDefault();
                    }
                },
                { passive: false },
            );

            scrollBox.dataset.tc0080ScrollBound = "true";
        };

        Bot.prototype.lockPageScroll = function () {
            if (this.pageScrollState.locked) return;
            var docEl = document.documentElement;
            this.pageScrollState.bodyOverflow = document.body.style.overflow;
            this.pageScrollState.htmlOverflow = docEl ? docEl.style.overflow : "";
            document.body.style.overflow = "hidden";
            if (docEl) {
                docEl.style.overflow = "hidden";
            }
            this.pageScrollState.locked = true;
        };

        Bot.prototype.unlockPageScroll = function () {
            var docEl = document.documentElement;

            if (!this.pageScrollState.locked) {
                // Defensive cleanup: if lock state got out of sync, avoid leaving the page frozen.
                if (document.body.style.overflow === "hidden") {
                    document.body.style.overflow = "";
                }
                if (docEl && docEl.style.overflow === "hidden") {
                    docEl.style.overflow = "";
                }
                return;
            }

            document.body.style.overflow = this.pageScrollState.bodyOverflow || "";
            if (docEl) {
                docEl.style.overflow = this.pageScrollState.htmlOverflow || "";
            }
            this.pageScrollState.locked = false;
        };

                    position: promotionData.position || "",

        Bot.prototype.getFeedbackScore = function (action, fallbackIdx) {
            var a = action || {};
            var iconSlot = String(a.iconSlot || "").toLowerCase();
            if (iconSlot === "up") return "1";
            if (iconSlot === "down") return "0";

            var normalizedLabel = String(a.label || "")
                .toLowerCase()
                .replace(/í/g, "i")
                .trim();
            if (normalizedLabel === "si") return "1";

            var idx = Number(fallbackIdx);
            if (idx === 0) return "1";
            if (idx === 1) return "0";

            return "";

        Bot.prototype.isPanelVisible = function () {

        Bot.prototype.showPanel = function () {
            var panel = this.el.panel;
            if (!panel) return;

            panel.style.display = "flex";

            if (!this.shouldAnimateMobilePanel()) {
                panel.classList.add("tc0080-panel--open");
                return;
            }

            panel.classList.remove("tc0080-panel--open");

            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    panel.classList.add("tc0080-panel--open");
                });
            });
        };

        Bot.prototype.hidePanel = function () {
            var panel = this.el.panel;
            if (!panel) return;

            if (!this.shouldAnimateMobilePanel()) {
                panel.classList.remove("tc0080-panel--open");
                panel.style.display = "none";
                return;
            }

            panel.classList.remove("tc0080-panel--open");

            var self = this;
            var done = false;
            var finish = function () {
                if (done) return;
                done = true;
                panel.removeEventListener("transitionend", onTransitionEnd);
                if (!panel.classList.contains("tc0080-panel--open")) {
                    panel.style.display = "none";
                }
            };
            var onTransitionEnd = function (e) {
                if (e && e.target !== panel) return;
                if (e && e.propertyName && e.propertyName !== "transform") return;
                finish();
            };

            panel.addEventListener("transitionend", onTransitionEnd);
            setTimeout(finish, 360);
        };

            this.el.mask.style.display = "block";
            if (this.el.launcher) {
                this.el.launcher.style.display = "none";
            }
            this.toggleWelcome(false);
            this.lockPageScroll();

            if (!isAlreadyOpen) {
                this.trackOpenBotClick();
            }

            this.checkPendingTransition();
            this.render();
        };

        Bot.prototype.close = function () {
            if (this.isWaiting()) {
                this.savePendingTransition();
            }
            this.cancelWaitingTransition();
            this.hidePanel();
            this.el.mask.style.display = "none";
            if (this.el.launcher) {
                this.el.launcher.style.display = "inline-flex";
            }
            this.toggleWelcome(true);
            this.unlockPageScroll();
        };

        Bot.prototype.closeFromMask = function () {
            var self = this;
            this.close();

            // Mobile browsers can apply style updates in a later tick after overlay removal.
            requestAnimationFrame(function () {
                self.unlockPageScroll();
            });
            setTimeout(function () {
                self.unlockPageScroll();
            }, 0);
        };

        Bot.prototype.restart = function () {
            this.cancelWaitingTransition();
            this.clearPendingTransition();
            this.state.current = this.config.startNode;
            this.state.history = [];
            this.state.rating = null;
            this.state.nextMessageId = 1;
            this.state.chatLog = [];
            this.state.chatSnapshots = [];
            this.state.finished = false;
            this.state.errorRecovery = null;
            this.state.activeQuestionMessageId = null;
            this.state.runtimeError = null;
            this.state.missingNextErrorCount = 0;
            this.render();
        };

        Bot.prototype.debugError = function (type, payload) {
            if (!type) return;
            console.debug("[tc0080][error:" + type + "]", payload || {});
        };

        Bot.prototype.getMissingNextNodeMaxRetries = function () {
            var cfg = this.config.errorHandling || {};
            var value = Number(cfg.missingNextNodeMaxRetries);
            return Number.isFinite(value) && value > 0 ? Math.floor(value) : 3;
        };

        Bot.prototype.getFallbackNodeId = function () {
            var cfg = this.config.errorHandling || {};
            return cfg.fallbackNodeId || this.config.startNode;
        };

        Bot.prototype.clearRuntimeError = function () {
            this.state.runtimeError = null;
        };

        Bot.prototype.setRuntimeError = function (errorData) {
            this.state.runtimeError = errorData || null;
        };

        Bot.prototype.handleMissingNextNodeError = function (nextId, source) {
            var origin = source || "unknown";
            var maxRetries = this.getMissingNextNodeMaxRetries();

            this.state.missingNextErrorCount += 1;

            var attempts = this.state.missingNextErrorCount;
            this.debugError("MISSING_NEXT_NODE", {
                fromNode: this.state.current,
                nextId: nextId,
                source: origin,
                attempts: attempts,
                maxRetries: maxRetries,
            });

            if (attempts > maxRetries) {
                var fallbackId = this.getFallbackNodeId();
                this.debugError("MISSING_NEXT_NODE_FALLBACK", {
                    fallbackNodeId: fallbackId,
                    reason: "max-retries-reached",
                });
                this.clearRuntimeError();
                this.restart();
                return;
            }

            var retriesLeft = maxRetries - attempts;
            var helperText =
                retriesLeft > 0
                    ? "Puedes reintentar."
                    : "En el siguiente intento te llevaremos al inicio.";

            this.setRuntimeError({
                type: "missing-next-node",
                nextId: nextId,
                source: origin,
                attempts: attempts,
                maxRetries: maxRetries,
                text:
                    "No pudimos continuar esta ruta en este momento. " +
                    "Intento " +
                    attempts +
                    " de " +
                    maxRetries +
                    ". " +
                    helperText,
            });

            this.render();
        };

        Bot.prototype.isWaiting = function () {
            return !!this.transitionState.waiting;
        };

        Bot.prototype.cancelWaitingTransition = function () {
            if (this.transitionState.timerId) {
                clearTimeout(this.transitionState.timerId);
            }

            this.transitionState.waiting = false;
            this.transitionState.pendingNextId = null;
            this.transitionState.timerId = null;
            this.transitionState.pendingLabel = null;
            this.transitionState.pendingUsageBubble = null;
            this.transitionState.autoNodeId = null;
        };

        Bot.prototype.savePendingTransition = function () {
            if (!this.isWaiting() || !this.transitionState.pendingNextId) return;

            var transition = {
                nodeId: this.state.current,
                selectedLabel: this.transitionState.pendingLabel || "",
                nextId: this.transitionState.pendingNextId,
                timestamp: Date.now(),
            };

            try {
                sessionStorage.setItem(
                    "tc0080_pending_transition",
                    JSON.stringify(transition)
                );
            } catch (e) {
                console.warn("[tc0080] No se pudo guardar transición pendiente", e);
            }
        };

        Bot.prototype.checkPendingTransition = function () {
            var transitionJson = null;

            try {
                transitionJson = sessionStorage.getItem("tc0080_pending_transition");
            } catch (e) {
                console.warn("[tc0080] No se pudo acceder a sessionStorage", e);
                return;
            }

            if (transitionJson) {
                try {
                    var transition = JSON.parse(transitionJson);

                    // Recovery only makes sense if the current chat actually contains
                    // the previously selected user message in the same node.
                    var hasMatchingUserMessage = this.state.chatLog.some(function (entry) {
                        return (
                            entry &&
                            entry.role === "user" &&
                            entry.text === (transition.selectedLabel || "")
                        );
                    });

                    var canRecover =
                        !!transition &&
                        transition.nodeId === this.state.current &&
                        hasMatchingUserMessage;

                    if (!canRecover) {
                        this.clearPendingTransition();
                        return;
                    }

                    this.state.errorRecovery = {
                        nodeId: transition.nodeId,
                        selectedLabel: transition.selectedLabel,
                        nextId: transition.nextId,
                    };
                } catch (e) {
                    console.warn("[tc0080] Error parsing pending transition", e);
                    this.clearPendingTransition();
                }
            }
        };

        Bot.prototype.clearPendingTransition = function () {
            try {
                sessionStorage.removeItem("tc0080_pending_transition");
            } catch (e) {
                console.warn("[tc0080] No se pudo limpiar transición pendiente", e);
            }
            this.state.errorRecovery = null;
        };

        Bot.prototype.getThinkingDuration = function () {
            var cfg = this.config.thinking || {};
            var value = Number(cfg.durationMs);
            return Number.isFinite(value) && value >= 0 ? value : 1000;
        };

        Bot.prototype.getThinkingText = function () {
            var cfg = this.config.thinking || {};
            return cfg.text || "Pensando";
        };

        Bot.prototype.shouldShowThinkingText = function () {
            var cfg = this.config.thinking || {};
            return !!cfg.showText;
        };

        Bot.prototype.shouldUseThinking = function () {
            var cfg = this.config.thinking || {};
            return !!cfg.enabled;
        };

        Bot.prototype.isAutoNode = function (node) {
            return !!(node && node.type === "auto" && node.next);
        };

        Bot.prototype.maybeAdvanceAutoNode = function () {
            if (this.isWaiting()) return;

            var node = this.getNode(this.state.current);
            if (!this.isAutoNode(node)) {
                this.transitionState.autoNodeId = null;
                return;
            }

            if (this.transitionState.autoNodeId === node.id) return;
            this.transitionState.autoNodeId = node.id;

            if (this.shouldUseThinking()) {
                this.startWaitingTransition(node.next, "");
                return;
            }

            this.applyTransition(node.next);
        };

        Bot.prototype.scrollBodyToBottom = function () {
            var body = this.el.body;
            if (!body) return;

            var self = this;
            var scrollFn = function () {
                body.scrollTop = body.scrollHeight;
            };

            scrollFn();
            requestAnimationFrame(scrollFn);
            requestAnimationFrame(function () {
                scrollFn();
            });
        };

        Bot.prototype.scrollToLatestFeedbackStart = function () {
            var body = this.el.body;
            if (!body) return;

            var feedbackItems = body.querySelectorAll('[data-feedback-anchor="true"]');
            if (!feedbackItems.length) {
                this.scrollBodyToBottom();
                return;
            }

            var target = feedbackItems[feedbackItems.length - 1];
            var alignTop = function () {
                var bodyRect = body.getBoundingClientRect();
                var targetRect = target.getBoundingClientRect();
                var delta = targetRect.top - bodyRect.top;
                body.scrollTop = Math.max(0, body.scrollTop + delta);
            };
            var scrollFn = function () {
                alignTop();
            };

            scrollFn();
            requestAnimationFrame(scrollFn);
            requestAnimationFrame(function () {
                scrollFn();
            });
            setTimeout(scrollFn, 60);
        };

        Bot.prototype.adjustChatScroll = function (node) {
            if (this.config.mode !== "chat") {
                this.scrollBodyToBottom();
                return;
            }

            // Preserve current viewport when the rerender comes from feedback action click.
            if (this.scrollState && this.scrollState.suppressAdjustOnce) {
                this.scrollState.suppressAdjustOnce = false;
                return;
            }

            // During waiting transitions, keep the latest UI (thinking + new action)
            // pinned to the bottom to avoid jumping back to previous feedback blocks.
            if (this.isWaiting()) {
                this.scrollBodyToBottom();
                return;
            }

            var botEntries = (this.state.chatLog || []).filter(function (entry) {
                return entry && entry.role === "bot";
            });
            var lastBot = botEntries.length ? botEntries[botEntries.length - 1] : null;
            var prevBot = botEntries.length > 1 ? botEntries[botEntries.length - 2] : null;

            var currentIsFeedback = !!(node && node.feedbackText);
            var followsFeedbackNode =
                !!lastBot &&
                !!node &&
                lastBot.nodeId === node.id &&
                !!(prevBot && prevBot.feedbackText);

            if (currentIsFeedback || followsFeedbackNode) {
                this.scrollToLatestFeedbackStart();
                return;
            }

            this.scrollBodyToBottom();
        };

        Bot.prototype.pushChatSnapshot = function () {
            this.state.chatSnapshots.push({
                current: this.state.current,
                history: this.state.history.slice(),
                rating: this.state.rating,
                nextMessageId: this.state.nextMessageId,
                chatLog: this.state.chatLog.slice(),
                finished: this.state.finished,
                activeQuestionMessageId: this.state.activeQuestionMessageId,
            });
        };

        Bot.prototype.goTo = function (id, selectedLabel, meta) {
            var opts = meta || {};

            if (!this.getNode(id)) {
                this.handleMissingNextNodeError(id, "goTo");
                return;
            }

            if (this.isWaiting()) {
                if (!opts.allowWhileWaiting) return;
                this.cancelWaitingTransition();
            }

            if (this.config.mode === "chat") {
                this.pushChatSnapshot();

                if (selectedLabel && !opts.suppressUserBubble) {
                    this.state.chatLog.push({ role: "user", text: selectedLabel });
                }
            }

            if (this.shouldUseThinking()) {
                this.startWaitingTransition(id, selectedLabel);
                return;
            }

            this.applyTransition(id);
        };

        Bot.prototype.startWaitingTransition = function (id, label) {
            if (!this.getNode(id)) {
                this.handleMissingNextNodeError(id, "startWaitingTransition");
                return;
            }

            this.cancelWaitingTransition();
            this.transitionState.waiting = true;
            this.transitionState.pendingNextId = id;
            this.transitionState.pendingLabel = label || "";
            this.transitionState.pendingUsageBubble = null;
            this.render();

            var self = this;
            this.transitionState.timerId = setTimeout(function () {
                var nextId = self.transitionState.pendingNextId;
                self.cancelWaitingTransition();
                if (!nextId) return;
                self.applyTransition(nextId);
            }, this.getThinkingDuration());
        };

        Bot.prototype.createUsageSupportMessage = function (node, linkedQuestionMessageId) {
            if (!node || !node.usageMenuOption || !node.usageMenuOption.next) return null;

            return {
                messageId: this.state.nextMessageId++,
                role: "bot",
                nodeId: node.id,
                nodeType: "question-usage",
                selectedRating: 0,
                selectedResponseActionIdx: -1,
                allowOptionsWhileLinked: false,
                linkedQuestionMessageId: linkedQuestionMessageId,
                bubbleClass: node.usageSupportClassName || "tc0080-node-usage-option",
                title: "",
                text: node.usageSupportText || "",
                feedbackText: "",
                responseActions: [],
                options: [
                    {
                        label: node.usageMenuOption.label,
                        next: node.usageMenuOption.next,
                        href: "",
                        target: "",
                        isCta: false,
                    },
                ],
            };
        };

        Bot.prototype.startWaitingUsageBubble = function (usageMessage) {
            if (!usageMessage) return;

            this.cancelWaitingTransition();
            this.transitionState.waiting = true;
            this.transitionState.pendingNextId = null;
            this.transitionState.pendingLabel = "";
            this.transitionState.pendingUsageBubble = usageMessage;

            var self = this;
            this.transitionState.timerId = setTimeout(function () {
                var pendingUsageBubble = self.transitionState.pendingUsageBubble;
                self.cancelWaitingTransition();
                if (!pendingUsageBubble) return;
                self.state.chatLog.push(pendingUsageBubble);
                self.render();
            }, this.getThinkingDuration());
        };

        Bot.prototype.applyTransition = function (id) {
            if (!this.getNode(id)) {
                this.handleMissingNextNodeError(id, "applyTransition");
                return;
            }

            this.clearRuntimeError();
            this.state.missingNextErrorCount = 0;
            this.state.history.push(this.state.current);
            this.state.current = id;

            if (this.config.mode === "chat") {
                this.appendBotMessageForCurrent();
            }

            this.render();
        };

        Bot.prototype.back = function () {
            if (this.isWaiting()) {
                this.cancelWaitingTransition();
            }

            if (this.config.mode === "chat") {
                var prev = this.state.chatSnapshots.pop();
                if (!prev) return;

                this.state.current = prev.current;
                this.state.history = prev.history;
                this.state.rating = prev.rating;
                this.state.nextMessageId = Number(prev.nextMessageId) || 1;
                this.state.chatLog = prev.chatLog;
                this.state.finished = !!prev.finished;
                this.state.activeQuestionMessageId = Number(prev.activeQuestionMessageId) || null;
                this.render();
                return;
            }

            if (!this.state.history.length) return;
            this.state.current = this.state.history.pop();
            this.render();
        };

        Bot.prototype.setMode = function (mode) {
            var nextMode = mode === "slides" ? "slides" : "chat";
            if (this.config.mode === nextMode) return;
            this.config.mode = nextMode;
            this.restart();
        };

        Bot.prototype.appendBotMessageForCurrent = function () {
            var node = this.getNode(this.state.current);
            if (!node) return;

            this.trackFinalResponseView(node);

            if ((node.options || []).some(this.isDiscoverCardCtaOption)) {
                this.trackDiscoverCardView();
            }

            if (node.id === "rating_number") {
                this.trackRatingFinalView();
            }

            if ((node.options || []).some(this.hasCloseOption)) {
                this.trackCloseView();
            }

            var botMessage = {
                messageId: this.state.nextMessageId++,
                role: "bot",
                nodeId: node.id,
                nodeType: node.type || "",
                richText: !!node.richText,
                selectedRating: 0,
                selectedResponseActionIdx: -1,
                allowOptionsWhileLinked: !!node.usageMenuOption,
                linkedQuestionMessageId: null,
                bubbleClass: node.className || "",
                title: node.title || "",
                text: node.text || "",
                feedbackText: node.feedbackText || "",
                responseActions: (node.actions || []).map(function (a, idx) {
                    return {
                        idx: idx,
                        label: a.label,
                        next: a.next,
                        iconSlot: a.iconSlot,
                    };
                }),
                options: (node.options || []).map(function (o) {
                    return {
                        label: o.label,
                        next: o.next,
                        href: o.href,
                        target: o.target,
                        isCta: !!o.isCta,
                        isClose: !!o.isClose,
                    };
                }),
            };

            this.state.chatLog.push(botMessage);

            if (botMessage.options.length) {
                this.state.activeQuestionMessageId = botMessage.messageId;
            } else {
                this.state.activeQuestionMessageId = null;
            }

            if (node.usageMenuOption && node.usageMenuOption.next) {
                var usageMessage = this.createUsageSupportMessage(node, botMessage.messageId);
                if (usageMessage) {
                    if (this.shouldUseThinking()) {
                        this.startWaitingUsageBubble(usageMessage);
                    } else {
                        this.state.chatLog.push(usageMessage);
                    }
                }
            }
        };

        Bot.prototype.createErrorComponentMarkup = function (errorConfig) {
            var cfg = errorConfig || {};
            var text = this.escapeHtml(cfg.text || "Ocurrió un error inesperado.");
            var action = this.escapeHtml(cfg.action || "goto-start");
            var buttonLabel = this.escapeHtml(cfg.buttonLabel || "Ir al inicio");

            return (
                '<div class="tc0080-error-message">' +
                '<span class="tc0080-error-icon">⚠</span>' +
                '<div class="tc0080-error-content">' +
                '<p class="tc0080-error-text">' +
                text +
                "</p>" +
                '<button class="tc0080-error-retry" type="button" data-runtime-error-action="' +
                action +
                '">' +
                buttonLabel +
                "</button>" +
                "</div>" +
                "</div>"
            );
        };

        Bot.prototype.createMissingNextErrorMarkup = function () {
            var runtimeError = this.state.runtimeError || {};
            return this.createErrorComponentMarkup({
                text:
                    runtimeError.text ||
                    "No pudimos continuar esta ruta en este momento.",
                action: "retry-missing-next",
                buttonLabel: "Reintentar",
            });
        };

        Bot.prototype.escapeHtml = function (value) {
            return String(value)
                .replace(/&(?!#\d+;|#[xX][0-9a-fA-F]+;|[a-zA-Z]+;)/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        };

        Bot.prototype.formatInlineRichText = function (value) {
            var escaped = this.escapeHtml(value || "");
            return escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        };

        Bot.prototype.formatRichText = function (value) {
            var source = String(value || "").replace(/\r\n/g, "\n");
            var lines = source.split("\n");
            var htmlParts = [];
            var inList = false;
            var self = this;

            function closeList() {
                if (!inList) return;
                htmlParts.push("</ul>");
                inList = false;
            }

            lines.forEach(function (rawLine) {
                var trimmed = String(rawLine || "").trim();

                if (!trimmed) {
                    closeList();
                    htmlParts.push('<div class="tc0080-rich-spacer"></div>');
                    return;
                }

                if (/^[-*]\s+/.test(trimmed)) {
                    if (!inList) {
                        htmlParts.push('<ul class="tc0080-rich-list">');
                        inList = true;
                    }
                    htmlParts.push("<li>" + self.formatInlineRichText(trimmed.replace(/^[-*]\s+/, "")) + "</li>");
                    return;
                }

                closeList();
                htmlParts.push('<p class="tc0080-rich-line">' + self.formatInlineRichText(trimmed) + "</p>");
            });

            closeList();
            return '<div class="tc0080-rich-text">' + htmlParts.join("") + "</div>";
        };

        Bot.prototype.getUserBubbleLabel = function (value) {
            return String(value || "")
                .replace(/^\s*(?:(?:&#\d+;|&#x[0-9a-fA-F]+;|[\u2600-\u27BF]|[\uD83C-\uDBFF][\uDC00-\uDFFF])\s*)+/, "")
                .trim();
        };

        Bot.prototype.createThinkingMarkup = function (extraClass) {
            var cls = "tc0080-thinking" + (extraClass ? " " + extraClass : " tc0080-thinking--chat");
            var textHtml = this.shouldShowThinkingText()
                ? '<span class="tc0080-thinking-text">' + this.escapeHtml(this.getThinkingText()) + '</span>'
                : "";
            return (
                '<div class="' +
                cls +
                '">' +
                textHtml +
                '<span class="tc0080-thinking-dots" aria-hidden="true">' +
                '<span class="tc0080-thinking-dot"></span>' +
                '<span class="tc0080-thinking-dot"></span>' +
                '<span class="tc0080-thinking-dot"></span>' +
                '</span>' +
                "</div>"
            );
        };

        Bot.prototype.renderSlides = function (node) {
            var html = "";
            html += this.createHeader(node.title);
            html += this.createText(node.text);

            if (node.type === "question") html += this.createOptions(node);
            if (node.type === "mixed") html += this.createOptions(node);
            if (node.type === "rating") html += this.createRating(node);

            html += this.createFooter();
            return html;
        };

        Bot.prototype.renderChat = function (node) {
            var self = this;
            if (!this.state.chatLog.length) {
                this.appendBotMessageForCurrent();
            }

            var html = '<div class="tc0080-chat-shell">';
            html += '<div class="tc0080-chat-box">';
            html += '<div class="tc0080-chat">';

            var activeNodeId = this.state.current;
            var allowCurrentCtas = !this.state.finished;
            var activeQuestionMessageId = Number(this.state.activeQuestionMessageId) || null;

            // Encontrar el índice del último mensaje de usuario
            var lastUserMessageIdx = -1;
            for (var i = this.state.chatLog.length - 1; i >= 0; i--) {
                if (this.state.chatLog[i].role === "user") {
                    lastUserMessageIdx = i;
                    break;
                }
            }

            this.state.chatLog.forEach(function (item, idx) {
                if (item.role === "user") {
                    // Si hay error recovery y es el último mensaje de usuario, mostrar error
                    if (self.state.errorRecovery && idx === lastUserMessageIdx) {
                        html += '<div class="tc0080-error-message">' +
                            '<span class="tc0080-error-icon">⚠</span>' +
                            '<div class="tc0080-error-content">' +
                            '<p class="tc0080-error-text">Error en el envío</p>' +
                            '<button class="tc0080-error-retry" type="button" data-retry-error>Reintentar</button>' +
                            '</div>' +
                            '</div>';
                    } else {
                        html +=
                            '<div class="tc0080-chat-item tc0080-chat-item--user">' +
                            self.escapeHtml(item.text || "") +
                            "</div>";
                    }
                    return;
                }

                // Si hay error recovery, no renderizar mensajes de bot después del último mensaje de usuario
                if (
                    self.state.errorRecovery &&
                    lastUserMessageIdx >= 0 &&
                    idx > lastUserMessageIdx
                ) {
                    return;
                }

                var isCurrentBot =
                    allowCurrentCtas &&
                    item.nodeId === activeNodeId &&
                    idx === self.state.chatLog.length - 1;
                var isOptionalSourceBot =
                    allowCurrentCtas &&
                    activeQuestionMessageId !== null &&
                    Number(item.messageId) === activeQuestionMessageId &&
                    !!item.allowOptionsWhileLinked;
                var isUsageSupportBot =
                    allowCurrentCtas &&
                    activeQuestionMessageId !== null &&
                    Number(item.linkedQuestionMessageId) === activeQuestionMessageId;
                var isInteractiveBot =
                    isCurrentBot || isOptionalSourceBot || isUsageSupportBot;
                var includeRatingInBubble =
                    !self.isWaiting() &&
                    !self.state.finished &&
                    node.type === "rating" &&
                    isCurrentBot;
                html += self.renderBotItem(item, isInteractiveBot, includeRatingInBubble);
            });

            if (this.isWaiting()) {
                html += this.createThinkingMarkup();
            }

            if (
                this.state.runtimeError &&
                this.state.runtimeError.type === "missing-next-node"
            ) {
                html += this.createMissingNextErrorMarkup();
            }

            html += "</div>";

            if (this.state.finished) {
                html += this.createMainCta();
            }

            html += "</div>";
            return html;
        };

        Bot.prototype.render = function () {
            var node = this.getNode(this.state.current);
            if (!node) {
                this.debugError("INVALID_CURRENT_NODE", {
                    current: this.state.current,
                    mode: this.config.mode,
                });
                this.setRuntimeError({
                    type: "invalid-current-node",
                    text:
                        "No encontramos el nodo actual del flujo. Te llevaremos al inicio para continuar.",
                });
                this.el.body.innerHTML = this.createErrorComponentMarkup({
                    text: this.state.runtimeError.text,
                    action: "goto-start",
                    buttonLabel: "Ir al inicio",
                });
                this.attachHandlers();
                this.scrollBodyToBottom();
                return;
            }

            if (this.isWaiting() && this.config.mode === "slides") {
                this.el.body.innerHTML = this.createThinkingMarkup("tc0080-thinking--slide");
                this.attachHandlers();
                this.scrollBodyToBottom();
                return;
            }

            var html =
                this.config.mode === "chat"
                    ? this.renderChat(node)
                    : this.renderSlides(node);

            this.el.body.innerHTML = html;
            this.attachHandlers();
            this.adjustChatScroll(node);
            this.maybeAdvanceAutoNode();
        };

        Bot.prototype.createHeader = function (t) {
            return '<div class="tc0080-msg"><strong>' + t + "</strong></div>";

        Bot.prototype.createText = function (t) {

            node.options.forEach(function (o, idx) {

                    o.next +
                    '" data-idx="' +
                    idx +
                    '">' +
                    o.label +
                    "</button>";
            });

            html += "</div>";
            return html;
        };

        Bot.prototype.paintRatingStars = function (buttons, activeValue) {
            var self = this;
            var value = Number(activeValue) || 0;

            buttons.forEach(function (btn) {
                var btnValue = Number(btn.getAttribute("data-rating")) || 0;
                var filled = btnValue <= value;
                btn.innerHTML = self.getRatingStarSvg(filled);
            });
        };

        Bot.prototype.createRating = function () {
            var html = '<div class="tc0080-rating" role="group" aria-label="Rating">';
            for (var i = 1; i <= 5; i++) {
                html +=
                    '<button class="tc0080-rating-btn" type="button" data-rating="' +
                    i +
                    '" aria-label="' +
                    i +
                    ' estrellas">' +
                    this.getRatingStarSvg(false) +
                    "</button>";
            }
            html += "</div>";
            return html;
        };

        Bot.prototype.createRatingReadonly = function (value) {
            var html = '<div class="tc0080-rating" role="group" aria-label="Rating seleccionado">';
            var selected = Number(value) || 0;

            for (var i = 1; i <= 5; i++) {
                html +=
                    '<button class="tc0080-rating-btn" type="button" disabled aria-label="' +
                    i +
                    ' estrellas">' +
                    this.getRatingStarSvg(i <= selected) +
                    "</button>";
            }

            html += "</div>";
            return html;

        Bot.prototype.createMainCta = function () {
            return (
                '<button class="tc0080-chat-main-cta" type="button" data-main-restart>' +
                this.config.menuText +
                "</button>"
            );
        };

        Bot.prototype.createFooter = function () {
            return (
                "" +
                '<div class="tc0080-footer">' +
                '<button class="tc0080-btn" data-restart>Reiniciar</button>' +
                '<button class="tc0080-btn" data-back>Volver</button>' +
                "</div>"
            );
        };

        Bot.prototype.attachHandlers = function () {
            var self = this;

            var retryError = this.el.body.querySelector("[data-retry-error]");
            if (retryError) {
                retryError.addEventListener("click", function () {
                    if (!self.state.errorRecovery) return;
                    var recovery = self.state.errorRecovery;
                    self.clearPendingTransition();
                    self.applyTransition(recovery.nextId);
                });
            }

            this.el.body.querySelectorAll("[data-runtime-error-action]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var action = this.getAttribute("data-runtime-error-action") || "";

                    if (action === "retry-missing-next") {
                        var runtimeError = self.state.runtimeError || {};
                        if (!runtimeError.nextId) {
                            self.debugError("MISSING_NEXT_NODE_RETRY_SKIPPED", {
                                reason: "nextId-unavailable",
                            });
                            self.restart();
                            return;
                        }
                        self.applyTransition(runtimeError.nextId);
                        return;
                    }

                    self.debugError("RUNTIME_ERROR_GOTO_START", {
                        action: action,
                    });
                    self.restart();
                });
            });

            this.el.body.querySelectorAll("[data-next]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var selectedLabel =
                        this.getAttribute("data-user-label") ||
                        (this.textContent || "").trim();
                    self.goTo(
                        this.getAttribute("data-next"),
                        selectedLabel,
                    );
                });
            });

            this.el.body.querySelectorAll('[data-cta-discover="true"]').forEach(function (link) {
                link.addEventListener("click", function () {
                    self.trackDiscoverCardClick();
                });
            });

            this.el.body.querySelectorAll("[data-close]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    self.trackCloseClick();
                    self.close();
                    self.restart();
                });
            });

            this.el.body.querySelectorAll("[data-response-idx]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var messageId = Number(this.getAttribute("data-response-message-id"));
                    var selectedIdx = Number(this.getAttribute("data-response-idx"));

                    // Actualiza solo el response clickeado, incluso si hay varios en historial.
                    var updated = false;
                    for (var i = self.state.chatLog.length - 1; i >= 0; i--) {
                        var entry = self.state.chatLog[i];
                        if (
                            entry &&
                            entry.role === "bot" &&
                            Number(entry.messageId) === messageId
                        ) {
                            if (Number(entry.selectedResponseActionIdx) >= 0) {
                                return;
                            }
                            entry.selectedResponseActionIdx = selectedIdx;
                            var selectedAction = null;
                            if (Array.isArray(entry.responseActions)) {
                                for (var j = 0; j < entry.responseActions.length; j++) {
                                    if (Number(entry.responseActions[j].idx) === selectedIdx) {
                                        selectedAction = entry.responseActions[j];
                                        break;
                                    }
                                }
                            }
                            self.trackFeedbackClick(entry.nodeId, selectedAction, selectedIdx);
                            updated = true;
                            break;
                        }
                    }

                    if (updated) {
                        if (self.scrollState) {
                            self.scrollState.suppressAdjustOnce = true;
                        }
                        self.render();
                    }
                });
            });

            var ratingButtons = Array.from(this.el.body.querySelectorAll("[data-rating]"));
            var selectedRating = Number(this.state.rating) || 0;
            if (ratingButtons.length) {
                this.paintRatingStars(ratingButtons, selectedRating);
            }

            ratingButtons.forEach(function (btn) {
                btn.addEventListener("mouseenter", function () {
                    self.paintRatingStars(ratingButtons, this.getAttribute("data-rating"));
                });

                btn.addEventListener("focus", function () {
                    self.paintRatingStars(ratingButtons, this.getAttribute("data-rating"));
                });

                btn.addEventListener("click", function () {
                    var ratingValue = this.getAttribute("data-rating");
                    self.trackRatingFinalClick(ratingValue);

                    if (self.config.mode === "chat") {
                        self.pushChatSnapshot();
                    }

                    self.state.rating = ratingValue;
                    selectedRating = Number(ratingValue) || 0;

                    if (self.config.mode === "chat") {
                        for (var i = self.state.chatLog.length - 1; i >= 0; i--) {
                            var entry = self.state.chatLog[i];
                            if (entry && entry.role === "bot" && entry.nodeType === "rating") {
                                entry.selectedRating = selectedRating;
                                break;
                            }
                        }

                        if (self.shouldUseThinking()) {
                            self.startWaitingTransition("rating_thanks_auto", "");
                        } else {
                            self.applyTransition("rating_thanks_auto");
                        }
                        return;
                    }

                    self.goTo(
                        self.config.startNode,
                        "Calificacion: " + ratingValue + " estrellas",
                    );
                });
            });

            var ratingGroup = this.el.body.querySelector(".tc0080-rating");
            if (ratingGroup && ratingButtons.length) {
                ratingGroup.addEventListener("mousemove", function (e) {
                    var hoveredBtn =
                        e.target && e.target.closest
                            ? e.target.closest("[data-rating]")
                            : null;

                    if (hoveredBtn && ratingGroup.contains(hoveredBtn)) {
                        self.paintRatingStars(
                            ratingButtons,
                            hoveredBtn.getAttribute("data-rating"),
                        );
                        return;
                    }

                    self.paintRatingStars(ratingButtons, selectedRating);
                });

                ratingGroup.addEventListener("mouseleave", function () {
                    self.paintRatingStars(ratingButtons, selectedRating);
                });

                ratingGroup.addEventListener("focusout", function (e) {
                    if (!ratingGroup.contains(e.relatedTarget)) {
                        self.paintRatingStars(ratingButtons, selectedRating);
                    }
                });
            }

            var mainRestart = this.el.body.querySelector("[data-main-restart]");
            if (mainRestart) {
                mainRestart.addEventListener("click", function () {
                    self.restart();
                });
            }

            var restartBtn = this.el.body.querySelector("[data-restart]");
            if (restartBtn) {
                restartBtn.addEventListener("click", function () {
                    self.restart();
                });
            }

            var backBtn = this.el.body.querySelector("[data-back]");
            if (backBtn) {
                backBtn.addEventListener("click", function () {
                    self.back();
                });
            }
        };

        Bot.prototype.destroy = function () {
            this.cancelWaitingTransition();
            this.close();
            this.unbindLauncherMobileOffset();
            if (this.el.launcher)
                this.el.launcher.replaceWith(this.el.launcher.cloneNode(true));
            if (this.el.close)
                this.el.close.replaceWith(this.el.close.cloneNode(true));
            if (this.el.mask) this.el.mask.replaceWith(this.el.mask.cloneNode(true));
        };

        var instance;

        function ensureScope() {
            var scope = document.getElementById("tc0080-scope");
            var welcome = document.querySelector(".tc0080-launcher-welcome-wrap");

            if (scope) {
                if (welcome && welcome.parentNode !== scope) {
                    scope.appendChild(welcome);
                }
                return scope;
            }

            var launcher = document.querySelector(".tc0080-launcher");
            var panel = document.querySelector(".tc0080-panel");
            var mask = document.querySelector(".tc0080-mask");

            if (!launcher || !panel || !mask) return null;

            scope = document.createElement("div");
            scope.id = "tc0080-scope";

            launcher.parentNode.insertBefore(scope, launcher);
            scope.appendChild(mask);
            if (welcome) {
                scope.appendChild(welcome);
            }
            scope.appendChild(launcher);
            scope.appendChild(panel);

            return scope;
        }

        function init(scope) {
            if (!scope) return;

            if (instance) {
                instance.unlockPageScroll();
                instance.destroy();
            }
            instance = new Bot(scope);
            instance.init();
        }

        window.tc0080SetMode = function (mode) {
            if (!instance) return;
            instance.setMode(mode);
        };

        function waitForBotAndInit() {
            var elapsed = 0;
            var maxWait = 8000;
            var pollInterval = 150;

            var timer = setInterval(function () {
                var scope = ensureScope();
                if (
                    scope &&
                    scope.querySelector(".tc0080-launcher") &&
                    scope.querySelector(".tc0080-panel") &&
                    scope.querySelector(".tc0080-mask")
                ) {
                    clearInterval(timer);
                    init(scope);
                    return;
                }

                elapsed += pollInterval;
                if (elapsed >= maxWait) {
                    clearInterval(timer);
                    console.warn("[tc0080] Timeout esperando estructura del bot");
                }
            }, pollInterval);
        }

        function observeReinsertion() {
            if (window.__tc0080Observed) return;

            var observer = new MutationObserver(function () {
                var scope = document.getElementById("tc0080-scope");
                if (!scope || !document.contains(scope)) {
                    waitForBotAndInit();
                }
            });

            observer.observe(document.body, { childList: true, subtree: true });
            window.__tc0080Observed = true;
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", function () {
                waitForBotAndInit();
                observeReinsertion();
            });
        } else {
            waitForBotAndInit();
            observeReinsertion();
        }
    })();

</script>
