        // Tarjeta recomendada: bloque con badge, nombre, detalles y su propio CTA.
        // Va dentro de la misma burbuja que la tabla, no en la lista de opciones,
        // porque el CTA pertenece a la tarjeta y no al menu de navegacion.
        Bot.prototype.createRecommendationMarkup = function (rec, isActiveQuestion) {
            var self = this;
            var cfg = rec || {};
            var html = '<div class="tcxxxx-rec-block">';

            // El titulo va FUERA del recuadro verde, encima de el.
            if (cfg.title) {
                html += '<p class="tcxxxx-rec-title">' + this.escapeHtml(cfg.title) + "</p>";
            }

            html += '<div class="tcxxxx-rec">';

            if (cfg.badge) {
                html += '<span class="tcxxxx-rec-badge">' + this.escapeHtml(cfg.badge) + "</span>";
            }

            if (cfg.card) {
                html += '<p class="tcxxxx-rec-card">' + this.escapeHtml(cfg.card) + "</p>";
            }

            if ((cfg.details || []).length) {
                html += '<ul class="tcxxxx-rec-details">';
                cfg.details.forEach(function (linea) {
                    html += "<li>" + self.escapeHtml(linea) + "</li>";
                });
                html += "</ul>";
            }

            if (cfg.cta && cfg.cta.label) {
                var label = this.escapeHtml(cfg.cta.label);
                var href = this.escapeHtml(cfg.cta.href || "#");
                var target = this.escapeHtml(cfg.cta.target || "");
                var rel = target === "_blank" ? ' rel="noopener noreferrer"' : "";

                html += '<div class="tcxxxx-rec-actions">';
                if (isActiveQuestion) {
                    html += '<a class="tcxxxx-rec-cta" href="' + href + '"' +
                        (target ? ' target="' + target + '"' : "") +
                        rel +
                        ' data-rec-cta="true">' + label + "</a>";
                } else {
                    html += '<button class="tcxxxx-rec-cta" type="button" disabled>' + label + "</button>";
                }
                html += "</div>";
            }

            html += "</div>";
            html += "</div>";
            return html;
        };

        // Lista de tarjetas del perfilador. Cada una es un recuadro con nombre,
        // descripcion, viñetas y su propio CTA; la que trae badge se pinta con
        // el borde verde. Es hermano de createRecommendationMarkup y no lo
        // reutiliza a proposito: q21-q24 ya estan aprobadas y no se tocan.
        Bot.prototype.createCardsMarkup = function (cards, isActiveQuestion, carouselId) {
            var self = this;
            var lista = Array.isArray(cards) ? cards : [];
            if (!lista.length) return "";

            // Con una sola tarjeta no hay nada que deslizar: se pinta como
            // antes, a todo el ancho y sin controles.
            if (lista.length < 2) {
                return '<div class="tcxxxx-cards">' +
                    self.createCardBoxMarkup(lista[0], isActiveQuestion) +
                    "</div>";
            }

            var id = carouselId === undefined || carouselId === null
                ? "cards"
                : String(carouselId);

            var html = '<div class="tcxxxx-carousel" data-carousel="' + self.escapeHtml(id) + '"' +
                ' role="group" aria-label="Tarjetas recomendadas">';

            html += '<div class="tcxxxx-carousel-track" data-carousel-track="true">';
            lista.forEach(function (item) {
                html += '<div class="tcxxxx-carousel-slide">' +
                    self.createCardBoxMarkup(item, isActiveQuestion) +
                    "</div>";
            });
            html += "</div>";

            html += '<div class="tcxxxx-carousel-controls">';
            html += '<button class="tcxxxx-carousel-arrow tcxxxx-carousel-arrow--prev" type="button"' +
                ' data-carousel-prev="true" aria-label="Ver la tarjeta anterior" disabled>' +
                self.getCarouselChevronSvg("prev") +
                "</button>";

            html += '<div class="tcxxxx-carousel-dots">';
            lista.forEach(function (item, idx) {
                html += '<button class="tcxxxx-carousel-dot' +
                    (idx === 0 ? " tcxxxx-carousel-dot--activo" : "") +
                    '" type="button" data-carousel-dot="' + idx + '"' +
                    ' aria-label="Ir a la tarjeta ' + (idx + 1) + ' de ' + lista.length + '"></button>';
            });
            html += "</div>";

            html += '<button class="tcxxxx-carousel-arrow tcxxxx-carousel-arrow--next" type="button"' +
                ' data-carousel-next="true" aria-label="Ver la tarjeta siguiente">' +
                self.getCarouselChevronSvg("next") +
                "</button>";
            html += "</div>";

            html += "</div>";
            return html;
        };

        // El recuadro de una tarjeta. Salio de createCardsMarkup sin cambiarle
        // nada para que el carrusel y la lista de una sola tarjeta pinten
        // exactamente el mismo markup.
        Bot.prototype.createCardBoxMarkup = function (item, isActiveQuestion) {
            var self = this;
            var cfg = item || {};
            var claseDestacada = cfg.badge ? " tcxxxx-card--destacada" : "";
            var html = '<div class="tcxxxx-card' + claseDestacada + '">';

            if (cfg.badge) {
                html += '<span class="tcxxxx-card-badge">' + self.escapeHtml(cfg.badge) + "</span>";
            }

            if (cfg.name) {
                html += '<p class="tcxxxx-card-name">' + self.escapeHtml(cfg.name) + "</p>";
            }

            if (cfg.description) {
                html += '<p class="tcxxxx-card-desc">' + self.escapeHtml(cfg.description) + "</p>";
            }

            if ((cfg.bullets || []).length) {
                html += '<ul class="tcxxxx-card-bullets">';
                cfg.bullets.forEach(function (linea) {
                    html += "<li>" + self.escapeHtml(linea) + "</li>";
                });
                html += "</ul>";
            }

            if (cfg.cta && cfg.cta.label) {
                var label = self.escapeHtml(cfg.cta.label);
                var href = self.escapeHtml(cfg.cta.href || "#");
                var target = self.escapeHtml(cfg.cta.target || "");
                var rel = target === "_blank" ? ' rel="noopener noreferrer"' : "";

                html += '<div class="tcxxxx-card-actions">';
                if (isActiveQuestion) {
                    html += '<a class="tcxxxx-card-cta" href="' + href + '"' +
                        (target ? ' target="' + target + '"' : "") +
                        rel +
                        ' data-card-cta="true">' + label + "</a>";
                } else {
                    html += '<button class="tcxxxx-card-cta" type="button" disabled>' + label + "</button>";
                }
                html += "</div>";
            }

            html += "</div>";
            return html;
        };

        // Carrusel de tarjetas. El swipe, la inercia y el snap son nativos del
        // navegador; esto solo mueve scrollLeft cuando se usan las flechas o
        // los dots, y mantiene sincronizados el dot activo y el estado
        // deshabilitado de las flechas.
        Bot.prototype.bindCarousel = function (root) {
            var self = this;
            if (!root) return;

            var track = root.querySelector("[data-carousel-track]");
            if (!track) return;

            var slides = root.querySelectorAll(".tcxxxx-carousel-slide");
            if (slides.length < 2) return;

            var id = root.getAttribute("data-carousel") || "";
            var prev = root.querySelector("[data-carousel-prev]");
            var next = root.querySelector("[data-carousel-next]");
            var dots = root.querySelectorAll("[data-carousel-dot]");

            function offsetDe(idx) {
                var slide = slides[idx];
                if (!slide) return 0;
                return slide.offsetLeft - slides[0].offsetLeft;
            }

            // El indice activo es el de la tarjeta cuyo borde izquierdo queda
            // mas cerca del scroll actual. Se mide por distancia en vez de
            // dividir por un paso fijo porque la ultima tarjeta snapea contra
            // el final del scroll, y una division redondeada nunca llegaria a
            // ella.
            function indiceActual() {
                var actual = track.scrollLeft;
                var mejor = 0;
                var mejorDist = Infinity;

                for (var i = 0; i < slides.length; i++) {
                    var dist = Math.abs(offsetDe(i) - actual);
                    if (dist < mejorDist) {
                        mejorDist = dist;
                        mejor = i;
                    }
                }

                return mejor;
            }

            function sincronizar() {
                var idx = indiceActual();
                self.carouselIndex[id] = idx;

                for (var i = 0; i < dots.length; i++) {
                    if (i === idx) {
                        dots[i].classList.add("tcxxxx-carousel-dot--activo");
                        dots[i].setAttribute("aria-current", "true");
                    } else {
                        dots[i].classList.remove("tcxxxx-carousel-dot--activo");
                        dots[i].setAttribute("aria-current", "false");
                    }
                }

                if (prev) prev.disabled = idx <= 0;
                if (next) next.disabled = idx >= slides.length - 1;
            }

            function irA(idx, animar) {
                var destino = Math.max(0, Math.min(slides.length - 1, idx));
                var left = offsetDe(destino);
                var suave = animar && !self.prefiereMenosMovimiento();

                if (suave && typeof track.scrollTo === "function") {
                    try {
                        track.scrollTo({ left: left, behavior: "smooth" });
                    } catch (e) {
                        track.scrollLeft = left;
                    }
                } else {
                    track.scrollLeft = left;
                }

                self.carouselIndex[id] = destino;
            }

            var pendiente = false;
            track.addEventListener(
                "scroll",
                function () {
                    if (pendiente) return;
                    pendiente = true;
                    window.requestAnimationFrame(function () {
                        pendiente = false;
                        sincronizar();
                    });
                },
                { passive: true },
            );

            if (prev) {
                prev.addEventListener("click", function () {
                    irA(indiceActual() - 1, true);
                });
            }

            if (next) {
                next.addEventListener("click", function () {
                    irA(indiceActual() + 1, true);
                });
            }

            dots.forEach(function (dot) {
                dot.addEventListener("click", function () {
                    irA(Number(this.getAttribute("data-carousel-dot")) || 0, true);
                });
            });

            // Restaura la tarjeta que este carrusel tenia antes del re-render,
            // sin animar: no es un movimiento del usuario.
            var guardado = Number(self.carouselIndex[id]) || 0;
            if (guardado > 0) irA(guardado, false);
            sincronizar();
        };

        Bot.prototype.prefiereMenosMovimiento = function () {
            if (typeof window.matchMedia !== "function") return false;
            var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
            return !!(mq && mq.matches);
        };

        // Chevrones de las flechas. Van con currentColor para que el color lo
        // ponga el CSS de cada flecha (gris la de volver, blanca la naranja).
        Bot.prototype.getCarouselChevronSvg = function (direccion) {
            var d = direccion === "prev" ? "M10 3.5L5.5 8L10 12.5" : "M6 3.5L10.5 8L6 12.5";

            return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"' +
                ' xmlns="http://www.w3.org/2000/svg">' +
                '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="2"' +
                ' stroke-linecap="round" stroke-linejoin="round"/>' +
                "</svg>";
        };

        // Aviso con icono al pie de la lista de tarjetas.
        Bot.prototype.createAvisoMarkup = function (texto) {
            if (!texto) return "";

            return (
                '<div class="tcxxxx-aviso">' +
                '<span class="tcxxxx-aviso-icono" aria-hidden="true">' +
                '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                '<path fill-rule="evenodd" clip-rule="evenodd" d="M10 0C15.5228 0 20 4.47715 20 10C20 15.5228 15.5228 20 10 20C4.47715 20 0 15.5228 0 10C0 8.34273 0.404358 6.74154 1.16651 5.30903C1.42592 4.82145 2.03147 4.63649 2.51904 4.8959C3.00661 5.15531 3.19157 5.76085 2.93217 6.24842C2.32296 7.39345 2 8.67234 2 10C2 14.4183 5.58172 18 10 18C14.4183 18 18 14.4183 18 10C18 5.58172 14.4183 2 10 2C8.59854 2 7.34992 2.31467 6.25012 2.89887C5.76238 3.15795 5.15696 2.97259 4.89787 2.48484C4.63879 1.9971 4.82416 1.39167 5.3119 1.13259C6.69898 0.395793 8.26949 0 10 0ZM10 8C10.5523 8 11 8.44771 11 9V11C11 11.5523 10.5523 12 10 12C9.44771 12 9 11.5523 9 11V9C9 8.44771 9.44771 8 10 8ZM14 8C14.5523 8 15 8.44771 15 9V11C15 11.5523 14.5523 12 14 12C13.4477 12 13 11.5523 13 11V9C13 8.44771 13.4477 8 14 8ZM6 8C6.55228 8 7 8.44771 7 9V11C7 11.5523 6.55228 12 6 12C5.44772 12 5 11.5523 5 11V9C5 8.44771 5.44772 8 6 8Z" fill="#002A8D"/>' +
                "</svg>" +
                "</span>" +
                '<p class="tcxxxx-aviso-texto">' + this.escapeHtml(texto) + "</p>" +
                "</div>"
            );
        };

        Bot.prototype.createThinkingMarkup = function () {
            // Siempre es nueva cuando se muestra, asi que entra animada siempre.
            var cls = "tcxxxx-thinking tcxxxx-msg-enter tcxxxx-thinking--chat";
            var textHtml = this.shouldShowThinkingText()
                ? '<span class="tcxxxx-thinking-text">' + this.escapeHtml(this.getThinkingText()) + '</span>'
                : "";
            return (
                '<div class="' +
                cls +
                '">' +
                textHtml +
                '<span class="tcxxxx-thinking-dots" aria-hidden="true">' +
                '<span class="tcxxxx-thinking-dot"></span>' +
                '<span class="tcxxxx-thinking-dot"></span>' +
                '<span class="tcxxxx-thinking-dot"></span>' +
                '</span>' +
                "</div>"
            );
        };

        Bot.prototype.renderChat = function (node) {
            var self = this;
            if (!this.state.chatLog.length) {
                this.appendBotMessageForCurrent();
            }

            var html = '<div class="tcxxxx-chat-shell">';
            html += '<div class="tcxxxx-chat-box">';
            html += '<div class="tcxxxx-chat">';

            var activeNodeId = this.state.current;
            var allowCurrentCtas = !this.state.finished;
            var activeQuestionMessageId = Number(this.state.activeQuestionMessageId) || null;

            // Encontrar el índice del último mensaje de usuario
            var lastUserMessageIdx = -1;
            for (var i = this.state.chatLog.length - 1; i >= 0; i--) {
                if (this.state.chatLog[i].role === "user") {
                    lastUserMessageIdx = i;
                    break;
                }
            }

            // Entradas ya pintadas en un render anterior: no se reaniman.
            var animadosHasta = Number(this.animatedUpTo) || 0;

            this.state.chatLog.forEach(function (item, idx) {
                var claseEntrada = idx >= animadosHasta ? " tcxxxx-msg-enter" : "";

                if (item.role === "user") {
                    // Si hay error recovery y es el último mensaje de usuario, mostrar error
                    if (self.state.errorRecovery && idx === lastUserMessageIdx) {
                        html += '<div class="tcxxxx-error-message">' +
                            '<span class="tcxxxx-error-icon">⚠</span>' +
                            '<div class="tcxxxx-error-content">' +
                            '<p class="tcxxxx-error-text">Error en el envío</p>' +
                            '<button class="tcxxxx-error-retry" type="button" data-retry-error>Reintentar</button>' +
                            '</div>' +
                            '</div>';
                    } else {
                        html +=
                            '<div class="tcxxxx-chat-item tcxxxx-chat-item--user' + claseEntrada + '">' +
                            self.escapeHtml(item.text || "") +
                            "</div>";
                    }
                    return;
                }

                // Si hay error recovery, no renderizar mensajes de bot después del último mensaje de usuario
                if (
                    self.state.errorRecovery &&
                    lastUserMessageIdx >= 0 &&
                    idx > lastUserMessageIdx
                ) {
                    return;
                }

                var isCurrentBot =
                    allowCurrentCtas &&
                    item.nodeId === activeNodeId &&
                    idx === self.state.chatLog.length - 1;
                var isOptionalSourceBot =
                    allowCurrentCtas &&
                    activeQuestionMessageId !== null &&
                    Number(item.messageId) === activeQuestionMessageId &&
                    !!item.allowOptionsWhileLinked;
                var isUsageSupportBot =
                    allowCurrentCtas &&
                    activeQuestionMessageId !== null &&
                    Number(item.linkedQuestionMessageId) === activeQuestionMessageId;
                var isInteractiveBot =
                    isCurrentBot || isOptionalSourceBot || isUsageSupportBot;
                html += self.renderBotItem(item, isInteractiveBot, claseEntrada);
            });

            // A partir de aqui todo lo del log ya quedo pintado.
            this.animatedUpTo = this.state.chatLog.length;

            if (this.isWaiting()) {
                html += this.createThinkingMarkup();
            }

            if (
                this.state.runtimeError &&
                this.state.runtimeError.type === "missing-next-node"
            ) {
                html += this.createMissingNextErrorMarkup();
            }

            html += "</div>";

            if (this.state.finished) {
                html += this.createMainCta();
            }

            html += "</div>";
            return html;
        };

        Bot.prototype.render = function () {
            var node = this.getNode(this.state.current);
            if (!node) {
                this.debugError("INVALID_CURRENT_NODE", {
                    current: this.state.current,
                });
                this.setRuntimeError({
                    type: "invalid-current-node",
                    text:
                        "No encontramos el nodo actual del flujo. Te llevaremos al inicio para continuar.",
                });
                this.el.body.innerHTML = this.createErrorComponentMarkup({
                    text: this.state.runtimeError.text,
                    action: "goto-start",
                    buttonLabel: "Ir al inicio",
                });
                this.attachHandlers();
                this.scrollBodyToBottom();
                return;
            }

            this.el.body.innerHTML = this.renderChat(node);
            this.attachHandlers();
            this.adjustChatScroll(node);
            this.maybeAdvanceAutoNode();
        };

        Bot.prototype.createMainCta = function () {
            return (
                '<button class="tcxxxx-chat-main-cta" type="button" data-main-restart>' +
                this.config.menuText +
                "</button>"
            );
        };

        Bot.prototype.attachHandlers = function () {
            var self = this;

            var retryError = this.el.body.querySelector("[data-retry-error]");
            if (retryError) {
                retryError.addEventListener("click", function () {
                    if (!self.state.errorRecovery) return;
                    var recovery = self.state.errorRecovery;
                    self.clearPendingTransition();
                    self.applyTransition(recovery.nextId);
                });
            }

            this.el.body.querySelectorAll("[data-runtime-error-action]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var action = this.getAttribute("data-runtime-error-action") || "";

                    if (action === "retry-missing-next") {
                        var runtimeError = self.state.runtimeError || {};
                        if (!runtimeError.nextId) {
                            self.debugError("MISSING_NEXT_NODE_RETRY_SKIPPED", {
                                reason: "nextId-unavailable",
                            });
                            self.restart();
                            return;
                        }
                        self.applyTransition(runtimeError.nextId);
                        return;
                    }

                    self.debugError("RUNTIME_ERROR_GOTO_START", {
                        action: action,
                    });
                    self.restart();
                });
            });

            this.el.body.querySelectorAll("[data-next]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var selectedLabel =
                        this.getAttribute("data-user-label") ||
                        (this.textContent || "").trim();
                    self.goTo(
                        this.getAttribute("data-next"),
                        selectedLabel,
                    );
                });
            });

            this.el.body.querySelectorAll("[data-carousel]").forEach(function (carrusel) {
                self.bindCarousel(carrusel);
            });

            this.el.body.querySelectorAll('[data-cta-discover="true"]').forEach(function (link) {
                link.addEventListener("click", function () {
                    self.trackDiscoverCardClick();
                });
            });

            this.el.body.querySelectorAll("[data-close]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    self.trackCloseClick();
                    self.close();
                    self.restart();
                });
            });

            this.el.body.querySelectorAll("[data-response-idx]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var messageId = Number(this.getAttribute("data-response-message-id"));
                    var selectedIdx = Number(this.getAttribute("data-response-idx"));

                    // Actualiza solo el response clickeado, incluso si hay varios en historial.
                    var updated = false;
                    for (var i = self.state.chatLog.length - 1; i >= 0; i--) {
                        var entry = self.state.chatLog[i];
                        if (
                            entry &&
                            entry.role === "bot" &&
                            Number(entry.messageId) === messageId
                        ) {
                            if (Number(entry.selectedResponseActionIdx) >= 0) {
                                return;
                            }
                            entry.selectedResponseActionIdx = selectedIdx;
                            var selectedAction = null;
                            if (Array.isArray(entry.responseActions)) {
                                for (var j = 0; j < entry.responseActions.length; j++) {
                                    if (Number(entry.responseActions[j].idx) === selectedIdx) {
                                        selectedAction = entry.responseActions[j];
                                        break;
                                    }
                                }
                            }
                            self.trackFeedbackClick(entry.nodeId, selectedAction, selectedIdx);
                            updated = true;
                            break;
                        }
                    }

                    if (updated) {
                        if (self.scrollState) {
                            self.scrollState.suppressAdjustOnce = true;
                        }
                        self.render();
                    }
                });
            });

            var mainRestart = this.el.body.querySelector("[data-main-restart]");
            if (mainRestart) {
                mainRestart.addEventListener("click", function () {
                    self.restart();
                });
            }

        };

        Bot.prototype.destroy = function () {
            this.cancelWaitingTransition();
            this.close();
            this.unbindLauncherMobileOffset();
            if (this.el.launcher)
                this.el.launcher.replaceWith(this.el.launcher.cloneNode(true));
            if (this.el.close)
                this.el.close.replaceWith(this.el.close.cloneNode(true));
            if (this.el.mask) this.el.mask.replaceWith(this.el.mask.cloneNode(true));
        };

        var instance;

        function ensureScope() {
            var scope = document.getElementById("tcxxxx-scope");
            var welcome = document.querySelector(".tcxxxx-launcher-welcome-wrap");

            if (scope) {
                if (welcome && welcome.parentNode !== scope) {
                    scope.appendChild(welcome);
                }
                return scope;
            }

            var launcher = document.querySelector(".tcxxxx-launcher");
            var panel = document.querySelector(".tcxxxx-panel");
            var mask = document.querySelector(".tcxxxx-mask");

            if (!launcher || !panel || !mask) return null;

            scope = document.createElement("div");
            scope.id = "tcxxxx-scope";

            launcher.parentNode.insertBefore(scope, launcher);
            scope.appendChild(mask);
            if (welcome) {
                scope.appendChild(welcome);
            }
            scope.appendChild(launcher);
            scope.appendChild(panel);

            return scope;
        }

        function init(scope) {
            if (!scope) return;

            if (instance) {
                instance.unlockPageScroll();
                instance.destroy();
            }
            instance = new Bot(scope);
            instance.init();
        }

        // Hook de desarrollo. Lo usa preview-local.html para armar el panel de
        // casuisticas sin tener que mantener a mano la lista de tarjetas: se alimenta
        // de config.perfilador, asi que crece solo a medida que se van agregando
        // pantallas del perfilador. No lo usa el bot.
        window.tcxxxxCatalogo = function () {
            if (!instance) return { criterios: [], tarjetas: [], leads: [] };

            var cfg = instance.config.perfilador || {};
            var criterios = cfg.criterios || {};
            var tarjetas = [];
            var vistos = {};
            // Que tarjetas pertenecen al caso A de cada criterio. Una misma tarjeta
            // puede ser caso A en un criterio y caso B en otro, asi que esto NO se
            // puede deducir de la lista de tarjetas deduplicada.
            var casoAPorCriterio = {};

            Object.keys(criterios).forEach(function (id) {
                casoAPorCriterio[id] = [];

                ["casoA", "casoB"].forEach(function (caso) {
                    var lista = ((criterios[id] || {})[caso] || {}).tarjetas || [];
                    lista.forEach(function (t) {
                        if (caso === "casoA" && t.codigo) casoAPorCriterio[id].push(t.codigo);

                        var clave = t.codigo || t.name;
                        if (vistos[clave]) return;
                        vistos[clave] = true;
                        tarjetas.push({
                            codigo: t.codigo || null,
                            // El nombre viaja con su emoji como entidad HTML.
                            nombre: String(t.name || "").replace(/^&#\d+;\s*/, ""),
                            criterio: id,
                            caso: caso === "casoA" ? "A" : "B",
                        });
                    });
                });
            });

            return {
                criterios: Object.keys(criterios),
                casoAPorCriterio: casoAPorCriterio,
                tarjetas: tarjetas,
                leads: instance.getLeadCardCodes(),
            };
        };

        function waitForBotAndInit() {
            var elapsed = 0;
            var maxWait = 8000;
            var pollInterval = 150;

            var timer = setInterval(function () {
                var scope = ensureScope();
                if (
                    scope &&
                    scope.querySelector(".tcxxxx-launcher") &&
                    scope.querySelector(".tcxxxx-panel") &&
                    scope.querySelector(".tcxxxx-mask")
                ) {
                    clearInterval(timer);
                    init(scope);
                    return;
                }

                elapsed += pollInterval;
                if (elapsed >= maxWait) {
                    clearInterval(timer);
                    console.warn("[tcxxxx] Timeout esperando estructura del bot");
                }
            }, pollInterval);
        }

        function observeReinsertion() {
            if (window.__tcxxxxObserved) return;

            var observer = new MutationObserver(function () {
                var scope = document.getElementById("tcxxxx-scope");
                if (!scope || !document.contains(scope)) {
                    waitForBotAndInit();
                }
            });

            observer.observe(document.body, { childList: true, subtree: true });
            window.__tcxxxxObserved = true;
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", function () {
                waitForBotAndInit();
                observeReinsertion();
            });
        } else {
            waitForBotAndInit();
            observeReinsertion();
        }
    })();

</script>
