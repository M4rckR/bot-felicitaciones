<style>
    #tcxxxx-scope {
        font-family: var(--bcp-font-family-primary-regular), sans-serif;
    }

    #tcxxxx-scope * {
        box-sizing: border-box;
    }

    #tcxxxx-scope .tcxxxx-mask {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: none;
        z-index: 9998;
    }

    #tcxxxx-scope .tcxxxx-launcher {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 100px;
        height: 100px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        padding: 0;
        overflow: visible;
        cursor: pointer;
        z-index: 9999;
    }

    #tcxxxx-scope .tcxxxx-launcher-welcome-wrap {
        position: fixed;
        right: 25px;
        bottom: 115px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        z-index: 9999;
        gap: 0;
    }

    #tcxxxx-scope .tcxxxx-launcher-welcome-box {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        border-radius: 8px;
        background: transparent;
        filter: drop-shadow(0 1px 1px rgba(82, 112, 148, 0.14)) drop-shadow(0 4px 14px rgba(82, 112, 148, 0.2));
    }

    #tcxxxx-scope .tcxxxx-launcher-welcome {
        display: flex;
        padding: 8px;
        justify-content: center;
        align-items: flex-start;
        align-self: stretch;
        border-radius: 8px;
        background: var(--primary-040, #EBF4FF);
        color: var(--on-text, #202E44);
        font-size: 14px;
        line-height: 20px;
        text-align: center;
        cursor: pointer;
    }

    #tcxxxx-scope .tcxxxx-launcher-welcome strong {
        font-size: 14px;
        line-height: 20px;
        font-weight: 700;
    }

    #tcxxxx-scope .tcxxxx-launcher-welcome-pointer {
        width: 16px;
        height: 8px;
        margin-right: 32px;
        display: block;
    }

    #tcxxxx-scope .tcxxxx-launcher-base {
        display: flex;
        width: 64px;
        height: 64px;
        padding: 8px 16px;
        justify-content: center;
        align-items: center;
        gap: 6px;
        border-radius: 40px;
        border: 1px solid var(--primary-100, #B2D6FF);
        background: linear-gradient(180deg, #001E7E 0%, #002AAE 51.78%, #FF7800 100%, #F2C089 100%);
        box-shadow: 0 0 70px 0 rgba(26, 89, 242, 0.12), 0 0 40px 6px rgba(26, 102, 255, 0.30), 0 0 18px 4px rgba(38, 115, 255, 0.55), 0 0 6px 2px rgba(51, 128, 255, 0.90);
        position: relative;
        z-index: 2;
    }

    #tcxxxx-scope .tcxxxx-launcher-base svg {
        width: 32px;
        height: 32px;
        display: block;
    }

    #tcxxxx-scope .tcxxxx-launcher-pulse {
        position: absolute;
        width: 100px;
        height: 100px;
        left: 50%;
        top: 50%;
        border-radius: 100px;
        border: 2px solid rgba(38, 115, 255, 0.60);
        z-index: 1;
        transform: translate(-50%, -50%) scale(0.8);
        transform-origin: center;
        animation:
            kf_631_1318_opacity_0 2s linear,
            kf_631_1318_scale_0 2s linear;
        animation-iteration-count: infinite;
        will-change: transform, opacity;
        pointer-events: none;
    }

    #tcxxxx-scope .tcxxxx-launcher:focus {
        outline: none;
    }

    #tcxxxx-scope .tcxxxx-launcher:focus-visible {
        outline: 2px solid #B2D6FF;
        outline-offset: 4px;
        border-radius: 44px;
    }

    @keyframes kf_631_1318_opacity_0 {
        0% {
            animation-timing-function: ease-out;
            opacity: 0;
        }

        7.5% {
            animation-timing-function: ease-in;
            opacity: 0.8;
        }

        25% {
            opacity: 0;
        }

        55% {
            animation-timing-function: ease-out;
            opacity: 0;
        }

        62.5% {
            animation-timing-function: ease-in;
            opacity: 0.8;
        }

        80% {
            opacity: 0;
        }

        100% {
            opacity: 0;
        }
    }

    @keyframes kf_631_1318_scale_0 {
        0% {
            animation-timing-function: ease-out;
            transform: translate(-50%, -50%) scale(0.8);
        }

        7.5% {
            animation-timing-function: ease-in;
            transform: translate(-50%, -50%) scale(1);
        }

        25% {
            animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1);
            transform: translate(-50%, -50%) scale(1.15);
        }

        55% {
            animation-timing-function: ease-out;
            transform: translate(-50%, -50%) scale(0.8);
        }

        62.5% {
            animation-timing-function: ease-in;
            transform: translate(-50%, -50%) scale(1);
        }

        80% {
            transform: translate(-50%, -50%) scale(1.15);
        }

        100% {
            transform: translate(-50%, -50%) scale(1.15);
        }
    }

    #tcxxxx-scope .tcxxxx-panel {
        position: fixed;
        bottom: 40px;
        right: 20px;
        width: 374px;
        height: 70vh;
        background: #fff;
        border-radius: 12px;
        display: none;
        flex-direction: column;
        overflow: hidden;
        overscroll-behavior: contain;
        z-index: 9999;
        box-shadow: 0 4px 5px 0 rgba(82, 112, 148, 0.14), 0 1px 10px 0 rgba(82, 112, 148, 0.12), 0 2px 4px 0 rgba(82, 112, 148, 0.20);
        /* Estado de entrada. Crece desde la esquina del launcher.
           En movil el media query lo pisa por un deslizamiento completo. */
        opacity: 0;
        transform: translateY(12px) scale(0.98);
        transform-origin: 100% 100%;
        transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1), opacity 160ms ease;
        will-change: transform, opacity;
    }

    #tcxxxx-scope .tcxxxx-panel.tcxxxx-panel--open {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    #tcxxxx-scope .tcxxxx-header {
        padding: 12px;
        background: #0030B3;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #tcxxxx-scope .tcxxxx-header-main {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #tcxxxx-scope .tcxxxx-header-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
        background-color: #3D77FF;
        border-radius: 50%;
        padding: 9px;
    }

    #tcxxxx-scope .tcxxxx-header-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #tcxxxx-scope .tcxxxx-title {
        color: #fff;
        font-weight: 600;
    }

    #tcxxxx-scope .tcxxxx-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        color: #fff;
        font-size: 12px;
        line-height: 1.2;
    }

    #tcxxxx-scope .tcxxxx-status-dot {
        display: inline-flex;
        line-height: 0;
    }

    #tcxxxx-scope .tcxxxx-body {
        padding: 12px;
        /* Solo scroll vertical. La entrada de las burbujas las desplaza en X
           fuera del ancho util y sin esto aparece una barra horizontal. */
        overflow-x: hidden;
        overflow-y: auto;
        flex: 1;
        background: #F5F8FF;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
    }

    #tcxxxx-scope .tcxxxx-chat {
        display: flex;
        flex-direction: column;
        margin-bottom: 0;
    }

    /* Separacion entre burbujas. Va por margen y no por gap porque el gap es
       uniforme y aqui la distancia depende de quien habla: 24px cuando cambia
       el remitente y la mitad cuando se encadenan dos del mismo lado, para que
       una tanda del bot se lea como un bloque y no como mensajes sueltos. */
    #tcxxxx-scope .tcxxxx-chat > * + * {
        margin-top: 24px;
    }

    #tcxxxx-scope .tcxxxx-chat > .tcxxxx-chat-bot-row + .tcxxxx-chat-bot-row,
    #tcxxxx-scope .tcxxxx-chat > .tcxxxx-chat-item--user + .tcxxxx-chat-item--user {
        margin-top: 12px;
    }

    #tcxxxx-scope .tcxxxx-chat-shell {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    #tcxxxx-scope .tcxxxx-chat-box {
        /* background: #fff; */
        /* border: 1px solid #d8deea; */
        border-radius: 12px;
        padding: 6px;
        min-height: 180px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }

    #tcxxxx-scope .tcxxxx-chat-main-cta {
        margin-top: 10px;
        display: block;
        width: 100%;
        height: 40px;
        line-height: 40px;
        text-align: center;
        background: #ff7800;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
    }

    #tcxxxx-scope .tcxxxx-chat-main-cta:hover {
        background: #ff961f;
    }

    /* Regla general de ancho de burbuja:
       el ancho lo decide el contenido y el techo es el 100% del hilo. Una
       burbuja corta se encoge; una con tabla larga llega al borde. Antes esto
       era 90% fijo mas una clase tcxxxx-node-ancho para optar al 100%; esa
       clase ya no hace falta y se elimino. */
    #tcxxxx-scope .tcxxxx-chat-item {
        max-width: 100%;
        padding: 12px;
        border-radius: 10px;
        line-height: 20px;
        font-size: 14px;
    }

    #tcxxxx-scope .tcxxxx-chat-item--bot {
        color: var(--on-text, #202E44);
        border-radius: 4px 16px 16px 16px;
        border: 1px solid var(--background-100, #D8DFEA);
        background: var(--on-white, #FFF);
    }

    /* Una burbuja con botones o con tabla ocupa el ancho completo: si no, queda
       en el ancho de su boton mas largo (la de "Resolver dudas" caia en 96%) y
       se ve descuadrada frente a las demas. Las de solo texto no entran aqui y
       conservan su tamano natural.
       Si el navegador no soporta :has(), la burbuja simplemente se queda al
       ancho de su contenido, que es el comportamiento anterior. */
    #tcxxxx-scope .tcxxxx-chat-item--bot:has(.tcxxxx-chat-item-options),
    #tcxxxx-scope .tcxxxx-chat-item--bot:has(.tcxxxx-rich-table) {
        width: 100%;
    }

    #tcxxxx-scope .tcxxxx-chat-item--response {
        padding: 0;
        overflow: hidden;
    }

    #tcxxxx-scope .tcxxxx-response-content {
        padding: 12px;
    }

    #tcxxxx-scope .tcxxxx-response-divider {
        border-top: 1px solid #D8DFEA;
    }

    #tcxxxx-scope .tcxxxx-response-footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
    }

    #tcxxxx-scope .tcxxxx-response-label {
        font-size: 14px;
        line-height: 20px;
        color: #4a5568;
        margin: 0;
        white-space: nowrap;
    }

    #tcxxxx-scope .tcxxxx-response-actions {
        display: inline-flex;
        align-items: center;
        gap: 14px;
    }

    #tcxxxx-scope .tcxxxx-response-btn {
        width: 15px;
        height: 15px;
        border-radius: 20px;
        border: 1px solid var(--onsurface-050, #EFF0F2);
        background: var(--on-white, #FFF);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        line-height: 0;
    }

    #tcxxxx-scope .tcxxxx-response-btn:hover {
        background: #F5F8FF;
    }

    #tcxxxx-scope .tcxxxx-response-btn:disabled {
        opacity: 0.65;
        cursor: default;
    }

    #tcxxxx-scope .tcxxxx-response-btn.is-selected {
        background: #EAF1FF;
    }

    #tcxxxx-scope .tcxxxx-response-btn[data-icon-slot="up"].is-selected {
        border-color: #6AC90F;
    }

    #tcxxxx-scope .tcxxxx-response-btn[data-icon-slot="down"].is-selected {
        border-color: #CA4500;
    }

    #tcxxxx-scope .tcxxxx-response-btn:focus {
        outline: none;
    }

    #tcxxxx-scope .tcxxxx-response-btn:focus-visible {
        outline: 2px solid #0A47F0;
        outline-offset: 2px;
    }

    #tcxxxx-scope .tcxxxx-response-icon-slot {
        /* width: 16px; */
        /* height: 16px; */
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #5f6f8a;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        border-radius: 20px;
        border: 1px solid var(--onsurface-050, #EFF0F2);
        background: var(--on-white, #FFF);
        padding: 4px;
    }

    #tcxxxx-scope .tcxxxx-response-icon-slot svg {
        width: 16px;
        height: 16px;
    }

    #tcxxxx-scope .tcxxxx-response-btn.is-selected .tcxxxx-response-icon-slot[data-icon-slot="up"] {
        border: 1px solid var(--state-success, #6AC90F);
    }

    #tcxxxx-scope .tcxxxx-response-btn.is-selected .tcxxxx-response-icon-slot[data-icon-slot="down"] {
        border: 1px solid var(--secondary-700, #CA4500);
    }

    #tcxxxx-scope .tcxxxx-response-actions:not(.tcxxxx-response-actions--has-selection) .tcxxxx-response-btn:not(.is-selected):hover .tcxxxx-response-icon-slot[data-icon-slot="up"] {
        border: 1px solid var(--state-success, #6AC90F);
    }

    #tcxxxx-scope .tcxxxx-response-actions:not(.tcxxxx-response-actions--has-selection) .tcxxxx-response-btn:not(.is-selected):hover .tcxxxx-response-icon-slot[data-icon-slot="up"] svg path {
        fill: #37A500 !important;
    }

    #tcxxxx-scope .tcxxxx-response-actions:not(.tcxxxx-response-actions--has-selection) .tcxxxx-response-btn:not(.is-selected):hover .tcxxxx-response-icon-slot[data-icon-slot="down"] {
        border: 1px solid var(--secondary-700, #CA4500);
    }

    #tcxxxx-scope .tcxxxx-response-actions:not(.tcxxxx-response-actions--has-selection) .tcxxxx-response-btn:not(.is-selected):hover .tcxxxx-response-icon-slot[data-icon-slot="down"] svg path {
        fill: #CA4500 !important;
    }

    #tcxxxx-scope .tcxxxx-node-start .tcxxxx-chat-item-title {
        font-size: 16px;
    }

    #tcxxxx-scope .tcxxxx-chat-item-title {
        display: block;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        color: var(--on-text, #202E44);
        margin-bottom: 8px;
    }

    #tcxxxx-scope .tcxxxx-chat-item-text {
        display: block;
        font-size: 14px;
        line-height: 20px;
        color: var(--on-text, #202E44);
        margin-bottom: 16px;
    }

    /* Separacion entre parrafos por margin-bottom, no por <br>.
       Unico punto de ajuste del espaciado vertical del texto. */
    /* 16px entre parrafos y tambien despues del ultimo, que es lo que separa
       el bloque de texto de lo que venga debajo (opciones, feedback, tarjetas).
       Antes eran 8px entre parrafos y 16px solo en el ultimo; Marco pidio la
       misma medida en los dos casos (2026-09-09). */
    #tcxxxx-scope .tcxxxx-text-line {
        margin: 0 0 16px;
    }

    /* Renglon pegado dentro de un parrafo: corta la linea sin agregar aire.
       Es un span display:block a proposito, para no usar <br>. */
    #tcxxxx-scope .tcxxxx-text-row {
        display: block;
    }

    #tcxxxx-scope .tcxxxx-welcome-line {
        display: block;
    }

    #tcxxxx-scope .tcxxxx-rich-text {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    #tcxxxx-scope .tcxxxx-rich-line {
        margin: 0;
    }

    /* Tabla comparativa. El contenedor redondea y recorta para que el
       zebrado y los bordes de fila no se salgan por las esquinas. */
    #tcxxxx-scope .tcxxxx-rich-table-wrap {
        /* 32px de separacion con el texto de arriba: 8px los pone el gap de
           .tcxxxx-rich-text y los 24 restantes este margen. */
        margin-top: 24px;
        border: 1px solid #E6E6E6;
        border-radius: 12px;
        overflow: hidden;
    }

    /* El panel mide 374px: table-layout fijo y corte de palabra para que
       los nombres largos partan de linea en vez de desbordar. */
    #tcxxxx-scope .tcxxxx-rich-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 13px;
        line-height: 1.3;
    }

    #tcxxxx-scope .tcxxxx-rich-table th,
    #tcxxxx-scope .tcxxxx-rich-table td {
        padding: 12px 10px;
        text-align: left;
        vertical-align: middle;
        overflow-wrap: anywhere;
        color: var(--on-text, #202E44);
    }

    /* Separador vertical entre columnas. */
    #tcxxxx-scope .tcxxxx-rich-table th+th,
    #tcxxxx-scope .tcxxxx-rich-table td+td {
        border-left: 1px solid #E6E6E6;
    }

    /* Separador horizontal entre filas. */
    #tcxxxx-scope .tcxxxx-rich-table tbody tr {
        border-top: 1px solid #E6E6E6;
    }

    #tcxxxx-scope .tcxxxx-rich-table thead th {
        font-weight: 600;
        background: #FAFAFA;
    }

    /* Zebrado: filas pares en gris. */
    #tcxxxx-scope .tcxxxx-rich-table tbody tr:nth-child(even) {
        background: #FAFAFA;
    }

    /* Bloque de tarjeta recomendada, debajo de la tabla y en la misma burbuja. */
    #tcxxxx-scope .tcxxxx-rec-block {
        margin-top: 16px;
    }

    /* El titulo va fuera del recuadro, como texto normal del hilo. */
    #tcxxxx-scope .tcxxxx-rec-title {
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 20px;
        color: var(--on-text, #202E44);
    }

    #tcxxxx-scope .tcxxxx-rec {
        padding: 16px;
        border: 1px solid var(--state-success, #6AC90F);
        border-radius: 24px;
        background: #F9F9FB;
    }

    #tcxxxx-scope .tcxxxx-rec-badge {
        display: inline-block;
        margin-bottom: 8px;
        padding: 3px 10px;
        border-radius: 2px;
        background: #3D9B00;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
    }

    #tcxxxx-scope .tcxxxx-rec-card {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.3;
        color: var(--on-text, #202E44);
    }

    /* Los detalles son viñetas, no parrafos sueltos. */
    #tcxxxx-scope .tcxxxx-rec-details {
        margin: 0;
        padding-left: 20px;
        list-style: disc;
    }

    #tcxxxx-scope .tcxxxx-rec-details li {
        margin: 0 0 2px;
        font-size: 14px;
        line-height: 20px;
        color: var(--on-text, #202E44);
    }

    /* El CTA se alinea a la derecha y mide lo que su texto, no el ancho entero. */
    #tcxxxx-scope .tcxxxx-rec-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
    }

    #tcxxxx-scope .tcxxxx-rec-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 20px;
        border-radius: 20px;
        border: 1px solid #FF7800;
        background: #FF7800;
        color: #fff;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        font-family: inherit;
        text-decoration: none;
        cursor: pointer;
    }

    #tcxxxx-scope .tcxxxx-rec-cta:hover {
        background: #ff961f;
    }

    #tcxxxx-scope .tcxxxx-rec-cta[disabled] {
        opacity: 0.5;
        cursor: default;
    }

    /* Lista de tarjetas del perfilador (q11-q14).
       Es el mismo recuadro del bloque de recomendacion, pero repetido y en dos
       variantes: borde neutro por defecto y borde verde + badge para la que
       Marco marca como "La más usada". Se escribio aparte de .tcxxxx-rec* en
       vez de reutilizarlo para no tocar q21-q24, que ya estan aprobadas. */
    #tcxxxx-scope .tcxxxx-cards {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 16px;
    }

    #tcxxxx-scope .tcxxxx-card {
        padding: 16px;
        border: 1px solid #E6E6E6;
        border-radius: 24px;
        background: #F9F9FB;
    }

    /* La destacada. El verde lo dio Marco el 2026-09-09: va en duro y no por el
       token --state-success, que en esta pagina no esta definido y caia en un
       #6AC90F distinto. */
    #tcxxxx-scope .tcxxxx-card--destacada {
        border-color: #37A500;
    }

    #tcxxxx-scope .tcxxxx-card-badge {
        display: inline-block;
        margin-bottom: 8px;
        /* 2px en Y y 4px en X, dado por Marco el 2026-09-10 (antes 3px 10px).
           Solo este badge: el de q21-q24 (.tcxxxx-rec-badge) sigue en 3px 10px
           porque esas pantallas estan aprobadas y no se tocan. */
        padding: 2px 4px;
        border-radius: 2px;
        background: #3D9B00;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
    }

    #tcxxxx-scope .tcxxxx-card-name {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        line-height: 20px;
        color: var(--on-text, #202E44);
    }

    /* La descripcion va pegada al nombre, sin aire: asi esta en el mockup. */
    #tcxxxx-scope .tcxxxx-card-desc {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        color: var(--on-text, #202E44);
    }

    /* El aire se reserva para separar la descripcion de las viñetas. */
    #tcxxxx-scope .tcxxxx-card-bullets {
        margin: 12px 0 0;
        padding-left: 20px;
        list-style: disc;
    }

    #tcxxxx-scope .tcxxxx-card-bullets li {
        margin: 0 0 2px;
        font-size: 14px;
        line-height: 20px;
        color: var(--on-text, #202E44);
    }

    #tcxxxx-scope .tcxxxx-card-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
    }

    #tcxxxx-scope .tcxxxx-card-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 20px;
        border-radius: 20px;
        border: 1px solid #FF7800;
        background: #FF7800;
        color: #fff;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        font-family: inherit;
        text-decoration: none;
        cursor: pointer;
    }

    #tcxxxx-scope .tcxxxx-card-cta:hover {
        background: #ff961f;
    }

    #tcxxxx-scope .tcxxxx-card-cta[disabled] {
        opacity: 0.5;

       El desplazamiento es scroll nativo con scroll-snap, NO transform: asi el
       swipe tactil, la inercia y el snap los hace el navegador, y el JS solo
       mueve scrollLeft cuando se usan las flechas o los dots. La tarjeta en si
       no cambia ni un pixel: .tcxxxx-card queda igual y el carrusel solo la

    #tcxxxx-scope .tcxxxx-carousel {

        align-items: stretch;
        /* 8px, dado por Marco el 2026-09-10. */
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        /* mandatory = snap obligatorio por tarjeta, sin scroll libre. */
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        /* La barra se oculta: la posicion la comunican los dots. */
        scrollbar-width: none;
        -ms-overflow-style: none;

       le pasa al badge: los <p> y el <ul> ya eran de ancho completo, y
       .tcxxxx-card-actions se estira a proposito para alinear su CTA a la

    #tcxxxx-scope .tcxxxx-carousel-slide .tcxxxx-card-badge {

        Bot.prototype.init = function () {
            this.validateGraph();
            if (!this.validateElements()) return;
            this.bind();
            this.state.current = this.config.startNode;
        };

        Bot.prototype.validateElements = function () {
            var ok = !!(
                this.el.launcher &&
                this.el.panel &&
                this.el.body &&
                this.el.close &&
                this.el.mask
            );
            if (!ok) {
                console.warn("[tcxxxx] Elementos base incompletos para iniciar bot");
            }
            return ok;
        };

        Bot.prototype.validateGraph = function () {
            var ids = this.config.nodes.map((n) => n.id);
            this.config.nodes.forEach((n) => {
                if (n.next && ids.indexOf(n.next) === -1) {
                    console.error("Destino inexistente:", n.next);
                }

                if (n.type === "auto" && !n.next) {
                    console.error("Nodo auto sin destino next:", n.id);
                }

                (n.options || []).forEach((o) => {
                    if (o.next && ids.indexOf(o.next) === -1) {
                        console.error("Destino inexistente:", o.next);
                    }
                });

                (n.actions || []).forEach((a) => {
                    if (a.next && ids.indexOf(a.next) === -1) {
                        console.error("Destino inexistente en acción:", a.next);
                    }
                });
            });
        };

        Bot.prototype.getNode = function (id) {
            return this.config.nodes.find((n) => n.id === id);
        };

        // ---------------------------------------------------------------------
        // Deteccion de leads.
        // En /felicitaciones cada tarjeta aprobada del usuario es un
        // <xt21-card-option> y publica su codigo dos veces: en el src de la
        // imagen y en el atributo name del boton. Si el codigo esta en el DOM,
        // el usuario es lead de esa tarjeta.
        // ---------------------------------------------------------------------
        Bot.prototype.getCardCodeFromNode = function (nodo) {
            if (!nodo || !nodo.querySelector) return "";

            // El host del CDN cambia entre produccion y certi, asi que se matchea
            // por la ruta y se toma el nombre del archivo, nunca la URL entera.
            var img = nodo.querySelector('img[src*="/congratulations/img/"]');
            if (img) {
                var partes = String(img.getAttribute("src") || "").split("/congratulations/img/");
                if (partes.length > 1) {
                    var archivo = partes[1].split("?")[0].split("#")[0].split(".")[0];
                    if (archivo) return archivo.toUpperCase();
                }
            }

            var prefijo = "QA_Congratulations_BtnSeleccionar_";
            var boton = nodo.querySelector('[name^="' + prefijo + '"]');
            if (boton) {
                var codigo = String(boton.getAttribute("name") || "").slice(prefijo.length).trim();
                if (codigo) return codigo.toUpperCase();
            }

            return "";
        };

        Bot.prototype.getLeadCardCodes = function () {
            var self = this;
            var codigos = [];
            var vistos = {};
            var nodos = document.querySelectorAll("xt21-card-option");

            for (var i = 0; i < nodos.length; i++) {
                var codigo = self.getCardCodeFromNode(nodos[i]);
                if (codigo && !vistos[codigo]) {
                    vistos[codigo] = true;
                    codigos.push(codigo);
                }
            }

            return codigos;
        };

        Bot.prototype.filtrarPorLeads = function (tarjetas, leads) {
            var lista = Array.isArray(tarjetas) ? tarjetas : [];
            var disponibles = {};

            for (var i = 0; i < leads.length; i++) {
                disponibles[leads[i]] = true;
            }

            // Una tarjeta sin codigo no se puede detectar, asi que nunca entra.
            return lista.filter(function (t) {
                return !!(t && t.codigo && disponibles[t.codigo]);
            });
        };

        // Cada tarjeta se pinta con el CTA comun del perfilador, salvo que traiga
        // uno propio. Se devuelven copias: la config no se toca.
        Bot.prototype.conCta = function (tarjetas, cfg) {
            var ctaComun = cfg.cta || null;

            return tarjetas.map(function (t) {
                return {
                    codigo: t.codigo,
                    name: t.name,
                    description: t.description,
                    bullets: t.bullets,
                    badge: t.badge || "",
                    cta: t.cta || ctaComun,
                };
            });
        };

        // Corte del caso A: hasta maxSinDestacada tarjetas del orden, y la
        // destacada siempre al final y solo si el usuario la tiene.
        Bot.prototype.recortarConDestacada = function (tarjetas, cfg) {
            var destacadaCfg = cfg.destacada || {};
            var codigoDestacada = destacadaCfg.codigo || "";
            var tope = Number(cfg.maxSinDestacada);
            if (!Number.isFinite(tope) || tope < 0) tope = 3;

            var destacada = null;
            var resto = [];

            tarjetas.forEach(function (t) {
                if (codigoDestacada && t.codigo === codigoDestacada) {
                    destacada = t;
                    return;
                }
                resto.push(t);
            });

            var seleccion = resto.slice(0, tope);

            if (destacada) {
                seleccion.push({
                    codigo: destacada.codigo,
                    name: destacada.name,
                    description: destacada.description,
                    bullets: destacada.bullets,
                    // El badge es lo que le pone el borde verde a la tarjeta.
                    badge: destacadaCfg.badge || "",
                });
            }

            return seleccion;
        };

        // Tabla comparativa filtrada por leads. Devuelve el texto markdown listo
        // para formatRichText, que es el mismo camino que usaban las tablas cuando
        // estaban escritas a mano en el nodo.
        Bot.prototype.resolveComparador = function (tablaId) {
            var tabla = (this.config.comparador || {})[tablaId];

            if (!tabla) {
                this.debugError("COMPARADOR_TABLA_INEXISTENTE", { tabla: tablaId });
                return null;
            }

            var leads = this.getLeadCardCodes();
            var filas = tabla.filas || [];

            // Sin deteccion se muestran todas, igual que en el perfilador: una
            // lectura vacia significa que el selector fallo, no que el usuario no
            // tenga tarjetas.
            if (leads.length) {
                var disponibles = {};
                for (var i = 0; i < leads.length; i++) disponibles[leads[i]] = true;
                filas = filas.filter(function (f) {
                    return !!(f.codigo && disponibles[f.codigo]);
                });
            } else {
                this.debugError("COMPARADOR_SIN_LEADS", { tabla: tablaId });
            }

            var lineas = [tabla.intro, ""];
            lineas.push("| " + (tabla.encabezado || []).join(" | ") + " |");
            lineas.push("| --- | --- |");
            filas.forEach(function (f) {
                lineas.push("| " + f.nombre + " | " + f.valor + " |");
            });

            return { text: lineas.join("\n"), filas: filas.length };
        };

        // Devuelve {intro, tarjetas, caso} ya resueltos para el nodo, o null si el
        // criterio no existe en la config.
        Bot.prototype.resolvePerfilador = function (criterioId) {
            var cfg = this.config.perfilador || {};
            var criterio = (cfg.criterios || {})[criterioId];

            if (!criterio) {
                this.debugError("PERFILADOR_CRITERIO_INEXISTENTE", { criterio: criterioId });
                return null;
            }

            var casoA = criterio.casoA || {};
            var casoB = criterio.casoB || {};
            var leads = this.getLeadCardCodes();

            // Sin deteccion no se puede filtrar. En la pagina real siempre hay al
            // menos una tarjeta aprobada, asi que esto significa que el selector
            // fallo, no que el usuario no tenga ninguna.
            if (!leads.length) {
                this.debugError("PERFILADOR_SIN_LEADS", {
                    criterio: criterioId,
                    fallback: cfg.sinDeteccion || "casoA",
                });
                var porDefecto = cfg.sinDeteccion === "casoB" ? casoB : casoA;
                return {
                    caso: cfg.sinDeteccion === "casoB" ? "B" : "A",
                    detectado: false,
                    intro: porDefecto.intro || "",
                    tarjetas: this.conCta(this.recortarConDestacada(porDefecto.tarjetas || [], cfg), cfg),
                };
            }

            var deCasoA = this.filtrarPorLeads(casoA.tarjetas, leads);

            if (deCasoA.length) {
                return {
                    caso: "A",
                    detectado: true,
                    intro: casoA.intro || "",
                    tarjetas: this.conCta(this.recortarConDestacada(deCasoA, cfg), cfg),
                };
            }

            // Caso B: no hay ninguna tarjeta de millas. Aqui no hay destacada, asi
            // que se corta directo en maxTarjetas.
            var tope = Number(cfg.maxTarjetas);
            if (!Number.isFinite(tope) || tope < 0) tope = 4;

            return {
                caso: "B",
                detectado: true,
                intro: casoB.intro || "",
                tarjetas: this.conCta(this.filtrarPorLeads(casoB.tarjetas, leads).slice(0, tope), cfg),
            };
        };

        Bot.prototype.bind = function () {
            var self = this;

            this.toggleWelcome(true);

            if (this.el.welcome) {
                this.el.welcome.addEventListener("click", function () {
                    self.open();
                });
                this.el.welcome.addEventListener("keydown", function (e) {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        self.open();
                    }
                });
            }

            this.el.launcher.addEventListener("click", function () {
                self.open();
            });
            this.el.launcher.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    self.open();
                }
            });
            this.el.close.addEventListener("click", function () {
                self.close();
            });
            this.el.panel.addEventListener("click", function (e) {
                if (e.target && e.target.closest && e.target.closest(".tcxxxx-close")) {
                    self.close();
                }
            });
            this.el.mask.addEventListener("click", function (e) {
                if (e && e.preventDefault) e.preventDefault();
                if (e && e.stopPropagation) e.stopPropagation();
                self.closeFromMask();
            });

            this.bindScrollIsolation();
            this.bindLauncherMobileOffset();
            this.scheduleLauncherMobileOffsetUpdate();
        };

        Bot.prototype.toggleWelcome = function (isVisible) {
            if (!this.el.welcome) return;
            this.el.welcome.style.display = isVisible ? "flex" : "none";
        };

        Bot.prototype.isMobileViewport = function () {
            return !!window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
        };

        Bot.prototype.getLauncherLiftTriggerNode = function () {
            return document.querySelector(".boton--pulsante") || document.querySelector(".boton-pulsante");
        };

        Bot.prototype.shouldLiftLauncherOnMobile = function () {
            var trigger = this.getLauncherLiftTriggerNode();
            if (!trigger || !trigger.getBoundingClientRect) return false;
            return trigger.getBoundingClientRect().y <= 0;
        };

        Bot.prototype.updateLauncherMobileOffset = function () {
            if (!this.el.launcher) return;

            var launcherLiftClass = "tcxxxx-launcher--lifted";
            var welcomeLiftClass = "tcxxxx-launcher-welcome-wrap--lifted";

            if (!this.isMobileViewport()) {
                this.el.launcher.classList.remove(launcherLiftClass);
                if (this.el.welcome) {
                    this.el.welcome.classList.remove(welcomeLiftClass);
                }
                return;
            }

            var shouldLift = this.shouldLiftLauncherOnMobile();
            this.el.launcher.classList.toggle(launcherLiftClass, shouldLift);
            if (this.el.welcome) {
                this.el.welcome.classList.toggle(welcomeLiftClass, shouldLift);
            }
        };

        Bot.prototype.scheduleLauncherMobileOffsetUpdate = function () {
            var self = this;
            if (this.scrollState.launcherOffsetRafId !== null) return;

            this.scrollState.launcherOffsetRafId = requestAnimationFrame(function () {
                self.scrollState.launcherOffsetRafId = null;
                self.updateLauncherMobileOffset();
            });
        };

        Bot.prototype.bindLauncherMobileOffset = function () {
            var self = this;
            if (this._launcherOffsetBound) return;

            this._onLauncherOffsetScroll = function () {
                self.scheduleLauncherMobileOffsetUpdate();
            };

            this._onLauncherOffsetResize = function () {
                self.scheduleLauncherMobileOffsetUpdate();
            };

            window.addEventListener("scroll", this._onLauncherOffsetScroll, { passive: true });
            window.addEventListener("resize", this._onLauncherOffsetResize);
            window.addEventListener("orientationchange", this._onLauncherOffsetResize);
            this._launcherOffsetBound = true;
        };

        Bot.prototype.unbindLauncherMobileOffset = function () {
            if (!this._launcherOffsetBound) return;

            window.removeEventListener("scroll", this._onLauncherOffsetScroll);
            window.removeEventListener("resize", this._onLauncherOffsetResize);
            window.removeEventListener("orientationchange", this._onLauncherOffsetResize);

            this._onLauncherOffsetResize = null;

        Bot.prototype.bindScrollIsolation = function () {
            var self = this;
            var scrollBox = this.el.body;

            if (!scrollBox || scrollBox.dataset.tcxxxxScrollBound === "true") return;

            function canScroll(el) {
                return el && el.scrollHeight > el.clientHeight;
            }

            function isAtTop(el) {
                return el.scrollTop <= 0;
            }

            function isAtBottom(el) {
                return el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
            }

            // Dentro de un carrusel el gesto es horizontal y lo maneja el
            // scroll nativo del track. Hay que salir sin preventDefault o el
            // swipe no mueve nada: el aislamiento de abajo cancela el gesto
            // cuando el panel no tiene scroll vertical, que es justo el caso
            // de una pantalla corta con tarjetas. Se mantiene el
            // stopPropagation para no arrastrar la pagina anfitriona.
            function enCarrusel(e) {
                var target = e.target;
                if (!target || typeof target.closest !== "function") return false;
                return !!target.closest(".tcxxxx-carousel-track");
            }

            scrollBox.addEventListener(
                "wheel",
                function (e) {
                    e.stopPropagation();

                    if (enCarrusel(e)) return;

                    if (!canScroll(scrollBox)) {
                        e.preventDefault();
                        return;
                    }

                    var deltaY = e.deltaY;
                    var upOnTop = deltaY < 0 && isAtTop(scrollBox);
                    var downOnBottom = deltaY > 0 && isAtBottom(scrollBox);

                    if (upOnTop || downOnBottom) {
                        e.preventDefault();
                    }
                },
                { passive: false },
            );

            scrollBox.addEventListener(
                "touchstart",
                function (e) {
                    if (!e.touches || !e.touches.length) return;
                    self.scrollState.touchStartY = e.touches[0].clientY;
                },
                { passive: true },
            );

            scrollBox.addEventListener(
                "touchmove",
                function (e) {
                    e.stopPropagation();

                    if (enCarrusel(e)) return;

                    if (!canScroll(scrollBox)) {
                        e.preventDefault();
                        return;
                    }

                    if (!e.touches || !e.touches.length) return;

                    var currentY = e.touches[0].clientY;
                    var delta = self.scrollState.touchStartY - currentY;
                    var upOnTop = delta < 0 && isAtTop(scrollBox);
                    var downOnBottom = delta > 0 && isAtBottom(scrollBox);

                    if (upOnTop || downOnBottom) {
                        e.preventDefault();
                    }
                },
                { passive: false },
            );

            scrollBox.dataset.tcxxxxScrollBound = "true";
        };

        // La animacion de entrada aplica en todos los anchos: en desktop crece

        // prefers-reduced-motion la anula por CSS; hidePanel no depende de ella
        // porque tiene el setTimeout de respaldo.
        Bot.prototype.shouldAnimatePanel = function () {
            return !!this.el.panel;

        Bot.prototype.isPanelVisible = function () {
            return this.el.panel && this.el.panel.style.display === "flex";
        };

        Bot.prototype.showPanel = function () {
            var panel = this.el.panel;
            if (!panel) return;

            panel.style.display = "flex";

            if (!this.shouldAnimatePanel()) {
                panel.classList.add("tcxxxx-panel--open");
                return;
            }

            panel.classList.remove("tcxxxx-panel--open");

            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    panel.classList.add("tcxxxx-panel--open");
                });
            });
        };

        Bot.prototype.hidePanel = function () {
            var panel = this.el.panel;
            if (!panel) return;

            if (!this.shouldAnimatePanel()) {
                panel.classList.remove("tcxxxx-panel--open");
                panel.style.display = "none";
                return;
            }

            panel.classList.remove("tcxxxx-panel--open");

            var self = this;
            var done = false;
            var finish = function () {
                if (done) return;
                done = true;
                panel.removeEventListener("transitionend", onTransitionEnd);
                if (!panel.classList.contains("tcxxxx-panel--open")) {
                    panel.style.display = "none";
                }
            };
            var onTransitionEnd = function (e) {
                if (e && e.target !== panel) return;
                if (e && e.propertyName && e.propertyName !== "transform") return;
                finish();
            };

            panel.addEventListener("transitionend", onTransitionEnd);
            setTimeout(finish, 360);
        };

        Bot.prototype.open = function () {

        Bot.prototype.restart = function () {

            this.state.nextMessageId = 1;
            this.state.chatLog = [];
            this.state.finished = false;
            this.state.errorRecovery = null;

        Bot.prototype.debugError = function (type, payload) {
            if (!type) return;
            console.debug("[tcxxxx][error:" + type + "]", payload || {});
        };

        Bot.prototype.getMissingNextNodeMaxRetries = function () {
            var cfg = this.config.errorHandling || {};
            var value = Number(cfg.missingNextNodeMaxRetries);
            return Number.isFinite(value) && value > 0 ? Math.floor(value) : 3;
        };

        Bot.prototype.getFallbackNodeId = function () {
            var cfg = this.config.errorHandling || {};
            return cfg.fallbackNodeId || this.config.startNode;
        };

        Bot.prototype.clearRuntimeError = function () {

        };

        Bot.prototype.setRuntimeError = function (errorData) {
            this.state.runtimeError = errorData || null;
        };

        Bot.prototype.handleMissingNextNodeError = function (nextId, source) {
            var origin = source || "unknown";
            var maxRetries = this.getMissingNextNodeMaxRetries();

            this.state.missingNextErrorCount += 1;

            var attempts = this.state.missingNextErrorCount;
            this.debugError("MISSING_NEXT_NODE", {
                fromNode: this.state.current,
                nextId: nextId,
                source: origin,
                attempts: attempts,
                maxRetries: maxRetries,
            });

            if (attempts > maxRetries) {
                var fallbackId = this.getFallbackNodeId();
                this.debugError("MISSING_NEXT_NODE_FALLBACK", {
                    fallbackNodeId: fallbackId,
                    reason: "max-retries-reached",
                });
                this.clearRuntimeError();
                this.restart();
                return;
            }

            var retriesLeft = maxRetries - attempts;
            var helperText =
                retriesLeft > 0
                    ? "Puedes reintentar."
                    : "En el siguiente intento te llevaremos al inicio.";

            this.setRuntimeError({
                type: "missing-next-node",
                nextId: nextId,
                source: origin,
                attempts: attempts,
                maxRetries: maxRetries,
                text:
                    "No pudimos continuar esta ruta en este momento. " +
                    "Intento " +
                    attempts +
                    " de " +
                    maxRetries +
                    ". " +
                    helperText,
            });

            this.render();
        };

        Bot.prototype.isWaiting = function () {

        Bot.prototype.cancelWaitingTransition = function () {

                clearTimeout(this.transitionState.timerId);

            this.transitionState.waiting = false;
            this.transitionState.pendingNextId = null;
            this.transitionState.timerId = null;
            this.transitionState.pendingLabel = null;
            this.transitionState.pendingUsageBubble = null;
            this.transitionState.autoNodeId = null;
        };

        Bot.prototype.savePendingTransition = function () {
            if (!this.isWaiting() || !this.transitionState.pendingNextId) return;

            var transition = {
                nodeId: this.state.current,
                selectedLabel: this.transitionState.pendingLabel || "",
                nextId: this.transitionState.pendingNextId,
                timestamp: Date.now(),
            };

            try {
                sessionStorage.setItem(
                    "tcxxxx_pending_transition",
                    JSON.stringify(transition)
                );
            } catch (e) {
                console.warn("[tcxxxx] No se pudo guardar transición pendiente", e);
            }
        };

        Bot.prototype.checkPendingTransition = function () {
            var transitionJson = null;

            try {
                transitionJson = sessionStorage.getItem("tcxxxx_pending_transition");
            } catch (e) {
                console.warn("[tcxxxx] No se pudo acceder a sessionStorage", e);
                return;
            }

            if (transitionJson) {
                try {
                    var transition = JSON.parse(transitionJson);

                    // Recovery only makes sense if the current chat actually contains
                    // the previously selected user message in the same node.
                    var hasMatchingUserMessage = this.state.chatLog.some(function (entry) {
                        return (
                            entry &&
                            entry.role === "user" &&
                            entry.text === (transition.selectedLabel || "")
                        );
                    });

                    var canRecover =
                        !!transition &&
                        transition.nodeId === this.state.current &&
                        hasMatchingUserMessage;

                    if (!canRecover) {
                        this.clearPendingTransition();
                        return;
                    }

                    this.state.errorRecovery = {
                        nodeId: transition.nodeId,
                        selectedLabel: transition.selectedLabel,
                        nextId: transition.nextId,
                    };
                } catch (e) {
                    console.warn("[tcxxxx] Error parsing pending transition", e);
                    this.clearPendingTransition();
                }
            }
        };

        Bot.prototype.clearPendingTransition = function () {
            try {
                sessionStorage.removeItem("tcxxxx_pending_transition");

            }
            this.state.errorRecovery = null;
        };

        Bot.prototype.scrollBodyToBottom = function () {
            var body = this.el.body;
            if (!body) return;

            var self = this;
            var scrollFn = function () {
                body.scrollTop = body.scrollHeight;
            };

            scrollFn();
            requestAnimationFrame(scrollFn);
            requestAnimationFrame(function () {
                scrollFn();
            });

        Bot.prototype.scrollToLatestFeedbackStart = function () {
            var body = this.el.body;
            if (!body) return;

            var feedbackItems = body.querySelectorAll('[data-feedback-anchor="true"]');
            if (!feedbackItems.length) {
                this.scrollBodyToBottom();
                return;
            }

            var target = feedbackItems[feedbackItems.length - 1];
            var alignTop = function () {
                var bodyRect = body.getBoundingClientRect();
                var targetRect = target.getBoundingClientRect();
                var delta = targetRect.top - bodyRect.top;
                body.scrollTop = Math.max(0, body.scrollTop + delta);
            };
            var scrollFn = function () {
                alignTop();
            };

            scrollFn();
            requestAnimationFrame(scrollFn);
            requestAnimationFrame(function () {
                scrollFn();
            });
            setTimeout(scrollFn, 60);
        };

        Bot.prototype.adjustChatScroll = function (node) {
            // Preserve current viewport when the rerender comes from feedback action click.
            if (this.scrollState && this.scrollState.suppressAdjustOnce) {
                this.scrollState.suppressAdjustOnce = false;
                return;
            }

            // During waiting transitions, keep the latest UI (thinking + new action)
            // pinned to the bottom to avoid jumping back to previous feedback blocks.
            if (this.isWaiting()) {
                this.scrollBodyToBottom();
                return;
            }

            var botEntries = (this.state.chatLog || []).filter(function (entry) {
                return entry && entry.role === "bot";
            });
            var lastBot = botEntries.length ? botEntries[botEntries.length - 1] : null;
            var prevBot = botEntries.length > 1 ? botEntries[botEntries.length - 2] : null;

            var currentIsFeedback = !!(node && node.feedbackText);
            var followsFeedbackNode =
                !!lastBot &&
                !!node &&
                lastBot.nodeId === node.id &&
                !!(prevBot && prevBot.feedbackText);

            if (currentIsFeedback || followsFeedbackNode) {
                this.scrollToLatestFeedbackStart();
                return;
            }

            this.scrollBodyToBottom();

        Bot.prototype.goTo = function (id, selectedLabel, meta) {

            if (!this.getNode(id)) {
                this.handleMissingNextNodeError(id, "goTo");

            if (this.isWaiting()) {
                if (!opts.allowWhileWaiting) return;
                this.cancelWaitingTransition();
            }

            if (selectedLabel && !opts.suppressUserBubble) {
                this.state.chatLog.push({ role: "user", text: selectedLabel });
            }

            if (this.shouldUseThinking()) {
                this.startWaitingTransition(id, selectedLabel);
                return;
            }

            this.applyTransition(id);
        };

        Bot.prototype.startWaitingTransition = function (id, label) {

            var self = this;
            this.transitionState.timerId = setTimeout(function () {
                var nextId = self.transitionState.pendingNextId;
                self.cancelWaitingTransition();
                if (!nextId) return;
                self.applyTransition(nextId);

        Bot.prototype.appendBotMessageForCurrent = function () {
            var node = this.getNode(this.state.current);
            if (!node) return;

            this.trackFinalResponseView(node);

            if ((node.options || []).some(this.isDiscoverCardCtaOption)) {
                this.trackDiscoverCardView();
            }

            if ((node.options || []).some(this.hasCloseOption)) {
                this.trackCloseView();
            }

            // El perfilador resuelve su contenido AQUI, al construir el mensaje, no
            // al pintarlo: asi el intro y las tarjetas quedan congelados en el
            // chatLog y el historial no se reescribe si cambia el DOM despues. La
            // tabla del comparador se resuelve en el mismo punto y por lo mismo.
            var perfilado = node.perfilador ? this.resolvePerfilador(node.perfilador) : null;
            var comparado = node.comparador ? this.resolveComparador(node.comparador) : null;

            var botMessage = {
                messageId: this.state.nextMessageId++,
                role: "bot",
                nodeId: node.id,
                nodeType: node.type || "",
                richText: !!node.richText || !!node.comparador,
                selectedResponseActionIdx: -1,
                allowOptionsWhileLinked: !!node.usageMenuOption,
                linkedQuestionMessageId: null,
                bubbleClass: node.className || "",
                title: node.title || "",
                text: perfilado ? perfilado.intro : (comparado ? comparado.text : (node.text || "")),
                // La lista de tarjetas, la tarjeta recomendada y el texto que precede
                // al menu viajan en el snapshot como todo lo demas: el historial no se
                // reescribe luego.
                cards: perfilado ? perfilado.tarjetas : (node.cards || null),
                recommendation: node.recommendation || null,
                aviso: node.aviso || "",
                menuText: node.menuText || "",
                feedbackText: node.feedbackText || "",
                responseActions: (node.actions || []).map(function (a, idx) {
                    return {
                        idx: idx,
                        label: a.label,
                        next: a.next,
                        iconSlot: a.iconSlot,
                    };
                }),
                options: (node.options || []).map(function (o) {
                    return {
                        label: o.label,
                        next: o.next,
                        href: o.href,
                        target: o.target,
                        isCta: !!o.isCta,
                        isClose: !!o.isClose,
                    };
                }),
            };

            this.state.chatLog.push(botMessage);

            if (botMessage.options.length) {
                this.state.activeQuestionMessageId = botMessage.messageId;
            } else {
                this.state.activeQuestionMessageId = null;
            }

            if (node.usageMenuOption && node.usageMenuOption.next) {
                var usageMessage = this.createUsageSupportMessage(node, botMessage.messageId);
                if (usageMessage) {
                    if (this.shouldUseThinking()) {
                        this.startWaitingUsageBubble(usageMessage);
                    } else {
                        this.state.chatLog.push(usageMessage);
                    }
                }
            }
        };

        Bot.prototype.createErrorComponentMarkup = function (errorConfig) {
            var cfg = errorConfig || {};
            var text = this.escapeHtml(cfg.text || "Ocurrió un error inesperado.");
            var action = this.escapeHtml(cfg.action || "goto-start");
            var buttonLabel = this.escapeHtml(cfg.buttonLabel || "Ir al inicio");

            return (
                '<div class="tcxxxx-error-message">' +
                '<span class="tcxxxx-error-icon">⚠</span>' +
                '<div class="tcxxxx-error-content">' +
                '<p class="tcxxxx-error-text">' +
                text +
                "</p>" +
                '<button class="tcxxxx-error-retry" type="button" data-runtime-error-action="' +
                action +
                '">' +
                buttonLabel +
                "</button>" +
                "</div>" +
                "</div>"
            );
        };

        Bot.prototype.createMissingNextErrorMarkup = function () {
            var runtimeError = this.state.runtimeError || {};
            return this.createErrorComponentMarkup({
                text:
                    runtimeError.text ||
                    "No pudimos continuar esta ruta en este momento.",
                action: "retry-missing-next",
                buttonLabel: "Reintentar",
            });
        };

        Bot.prototype.escapeHtml = function (value) {
            return String(value)
                .replace(/&(?!#\d+;|#[xX][0-9a-fA-F]+;|[a-zA-Z]+;)/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        };

        Bot.prototype.formatInlineRichText = function (value) {
            var escaped = this.escapeHtml(value || "");
            return escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        };

        // Texto plano en parrafos. Recibe el valor YA escapado.
        // Dos niveles de separacion, ninguno con <br>:
        //   - linea en blanco  -> parrafo nuevo, 16px de aire (.tcxxxx-text-line)
        //   - salto simple     -> renglon pegado, sin aire (.tcxxxx-text-row,
        //                         un span display:block, igual que las dos
        //                         lineas del saludo del launcher)
        // El salto simple existe porque los mockups encadenan frases sin
        // espacio entre ellas y reservan el aire para separar bloques de idea.
        Bot.prototype.formatPlainText = function (escapedValue) {
            var bloques = String(escapedValue || "").split(/\n[ \t]*\n/);
            var html = "";

            bloques.forEach(function (bloque) {
                var renglones = [];

                bloque.split("\n").forEach(function (linea) {
                    var texto = linea.trim();
                    if (texto) renglones.push(texto);
                });

                if (!renglones.length) return;

                html += '<p class="tcxxxx-text-line">';
                renglones.forEach(function (texto) {
                    html += '<span class="tcxxxx-text-row">' + texto + "</span>";
                });
                html += "</p>";
            });

            return html;
        };

        Bot.prototype.formatRichText = function (value) {
            var source = String(value || "").replace(/\r\n/g, "\n");
            var lines = source.split("\n");
            var htmlParts = [];
            var inList = false;
            var filasTabla = [];
            var self = this;

            function closeList() {
                if (!inList) return;
                htmlParts.push("</ul>");
                inList = false;
            }

            // Tabla estilo markdown: la primera fila es la cabecera y la fila
            // de guiones se descarta. Se cierra al llegar cualquier otra linea.
            function closeTable() {
                if (!filasTabla.length) return;

                var cabecera = filasTabla[0];
                var cuerpo = filasTabla.slice(1);
                // El contenedor redondea y recorta: sin el, el zebrado y los
                // bordes de las filas se saldrian por las esquinas.
                var html = '<div class="tcxxxx-rich-table-wrap">' +
                    '<table class="tcxxxx-rich-table"><thead><tr>';

                cabecera.forEach(function (celda) {
                    html += "<th>" + self.formatInlineRichText(celda) + "</th>";
                });
                html += "</tr></thead><tbody>";

                cuerpo.forEach(function (fila) {
                    html += "<tr>";
                    fila.forEach(function (celda) {
                        html += "<td>" + self.formatInlineRichText(celda) + "</td>";
                    });
                    html += "</tr>";
                });

                html += "</tbody></table></div>";
                htmlParts.push(html);
                filasTabla = [];
            }

            // La linea en blanco que precede a una tabla no emite espaciador: la
            // separacion con lo de arriba la fija .tcxxxx-rich-table-wrap y si no
            // se descuadraria segun el autor deje o no el hueco en el texto.
            function siguienteEsTabla(desde) {
                for (var i = desde + 1; i < lines.length; i++) {
                    var linea = String(lines[i] || "").trim();
                    if (!linea) continue;
                    return /^\|.*\|$/.test(linea);
                }
                return false;
            }

            lines.forEach(function (rawLine, idx) {
                var trimmed = String(rawLine || "").trim();

                if (!trimmed) {
                    closeList();
                    closeTable();
                    if (!siguienteEsTabla(idx)) {
                        htmlParts.push('<div class="tcxxxx-rich-spacer"></div>');
                    }
                    return;
                }

                if (/^\|.*\|$/.test(trimmed)) {
                    closeList();
                    var celdas = trimmed.slice(1, -1).split("|").map(function (c) {
                        return c.trim();
                    });
                    var esSeparadora = celdas.every(function (c) {
                        return /^:?-{2,}:?$/.test(c);
                    });
                    if (!esSeparadora) filasTabla.push(celdas);
                    return;
                }

                closeTable();

                if (/^[-*]\s+/.test(trimmed)) {
                    if (!inList) {
                        htmlParts.push('<ul class="tcxxxx-rich-list">');
                        inList = true;
                    }
                    htmlParts.push("<li>" + self.formatInlineRichText(trimmed.replace(/^[-*]\s+/, "")) + "</li>");
                    return;
                }

                closeList();
                htmlParts.push('<p class="tcxxxx-rich-line">' + self.formatInlineRichText(trimmed) + "</p>");
            });

            closeList();
            closeTable();
            return '<div class="tcxxxx-rich-text">' + htmlParts.join("") + "</div>";
        };

        Bot.prototype.getUserBubbleLabel = function (value) {
            return String(value || "")
                .replace(/^\s*(?:(?:&#\d+;|&#x[0-9a-fA-F]+;|[\u2600-\u27BF]|[\uD83C-\uDBFF][\uDC00-\uDFFF])\s*)+/, "")
                .trim();
        };

        Bot.prototype.renderBotItem = function (item, isActiveQuestion, claseEntrada) {
            var self = this;
            var responseActions = Array.isArray(item.responseActions)
                ? item.responseActions
                : [];
            var bubbleClass = item.bubbleClass ? " " + item.bubbleClass : "";
            if (item.nodeType === "response" || responseActions.length > 0) {
                bubbleClass += " tcxxxx-chat-item--response";
            }
            bubbleClass += claseEntrada || "";
            var title = item.title ? this.escapeHtml(item.title) : "";
            var text = this.escapeHtml(item.text || "");
            var useRichText = !!item.richText;

            var messageHtml =
                '<div class="tcxxxx-chat-item tcxxxx-chat-item--bot' +
                bubbleClass +
                '"' +
                (item.feedbackText ? ' data-feedback-node="true"' : "") +
                '>';
            if (title) {
                messageHtml += '<span class="tcxxxx-chat-item-title">' + title + "</span>";
            }
            if (item.nodeType === "response" || responseActions.length > 0) {
                var responseTextHtml = useRichText
                    ? this.formatRichText(item.text || "")
                    : this.formatPlainText(text);
                messageHtml += '<div class="tcxxxx-response-content"><div class="tcxxxx-chat-item-text">' + responseTextHtml + "</div></div>";
            } else {
                // richText aplica a cualquier tipo de nodo, tambien a los question.
                // Antes solo se honraba en "auto" y las tablas salian como texto plano.
                messageHtml += '<div class="tcxxxx-chat-item-text">' +
                    (useRichText
                        ? this.formatRichText(item.text || "")
                        : this.formatPlainText(text)) +
                    "</div>";
            }
            if (item.cards) {
                // El id del carrusel es el del mensaje: cada burbuja del hilo
                // recuerda su propia tarjeta visible entre re-renders.
                messageHtml += this.createCardsMarkup(
                    item.cards,
                    isActiveQuestion,
                    "msg-" + (item.messageId === undefined ? "s/n" : item.messageId),
                );
            }
            if (item.recommendation) {
                messageHtml += this.createRecommendationMarkup(item.recommendation, isActiveQuestion);
            }

            if (item.aviso) {
                messageHtml += this.createAvisoMarkup(item.aviso);
            }

            if (item.menuText) {
                messageHtml += '<div class="tcxxxx-chat-item-text tcxxxx-menu-text">' +
                    this.formatPlainText(this.escapeHtml(item.menuText)) +
                    "</div>";
            }

            var options = Array.isArray(item.options) ? item.options : [];

            if (options.length) {
                messageHtml += '<div class="tcxxxx-chat-item-options">';
                options.forEach(function (opt, idx) {
                    var obj =
                        typeof opt === "string" ? { label: opt, next: "" } : opt || {};
                    var label = self.escapeHtml(obj.label || "");
                    var next = self.escapeHtml(obj.next || "");
                    var href = self.escapeHtml(obj.href || "");
                    var target = self.escapeHtml(obj.target || "");
                    var rel = target === "_blank" ? ' rel="noopener noreferrer"' : "";
                    var ctaClass = obj.isCta ? " tcxxxx-chat-item-option--cta" : "";
                    var isDiscoverCta =
                        !!obj.isCta &&
                        String(obj.label || "").trim() === "Descubrir si accedo a una tarjeta";
                    var ctaIconHtml = isDiscoverCta
                        ? '<span class="tcxxxx-chat-item-option-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M4 11.0018H17.584L14.289 7.70676C13.898 7.31576 13.898 6.68376 14.289 6.29276C14.68 5.90176 15.313 5.90176 15.703 6.29276L20.703 11.2928C21.094 11.6838 21.094 12.3158 20.703 12.7068L15.707 17.7068C15.512 17.9018 15.256 17.9998 15 17.9998C14.744 17.9998 14.488 17.9018 14.293 17.7068C13.902 17.3168 13.902 16.6838 14.292 16.2928L17.581 13.0018H4C3.447 13.0018 3 12.5548 3 12.0018C3 11.4488 3.447 11.0018 4 11.0018Z" fill="white"/></svg></span>'
                        : "";

                    if (isActiveQuestion && href) {
                        messageHtml +=
                            '<a class="tcxxxx-chat-item-option' +
                            ctaClass +
                            '" href="' +
                            href +
                            '"' +
                            (target ? ' target="' + target + '"' : "") +
                            rel +
                            (obj.isCta ? ' data-cta-discover="true"' : "") +
                            ' data-link-option="true" data-idx="' +
                            idx +
                            '">' +
                            '<span class="tcxxxx-chat-item-option-label">' +
                            label +
                            '</span>' +
                            ctaIconHtml +
                            "</a>";
                    } else if (isActiveQuestion && next) {
                        var userLabel = self.escapeHtml(self.getUserBubbleLabel(obj.label || ""));
                        messageHtml +=
                            '<button class="tcxxxx-chat-item-option" data-next="' +
                            next +
                            '" data-idx="' +
                            idx +
                            '" data-user-label="' +
                            userLabel +
                            '">' +
                            label +
                            "</button>";
                    } else if (isActiveQuestion && obj.isClose) {
                        messageHtml +=
                            '<button class="tcxxxx-chat-item-option" type="button" data-close="true" data-idx="' +
                            idx +
                            '">' +
                            label +
                            "</button>";
                    } else {
                        messageHtml +=
                            '<button class="tcxxxx-chat-item-option" type="button" disabled>' +
                            label +
                            "</button>";
                    }
                });
                messageHtml += "</div>";
            }

            if (responseActions.length) {
                messageHtml += '<div class="tcxxxx-response-divider"></div>';
                messageHtml += '<div class="tcxxxx-response-footer">';
                messageHtml += '<p class="tcxxxx-response-label">' + self.escapeHtml(item.feedbackText || "¿Resolví tu consulta?") + "</p>";
                var responseActionsClass = Number(item.selectedResponseActionIdx) >= 0
                    ? 'tcxxxx-response-actions tcxxxx-response-actions--has-selection'
                    : 'tcxxxx-response-actions';
                messageHtml += '<div class="' + responseActionsClass + '">';

                responseActions.forEach(function (action) {
                    var label = self.escapeHtml(action.label || "");
                    var iconSlot = self.escapeHtml(action.iconSlot || "");
                    var selectedClass = Number(item.selectedResponseActionIdx) === Number(action.idx)
                        ? " is-selected"
                        : "";
                    var iconSvgContent = "";
                    var isSelected = selectedClass.indexOf('is-selected') > -1;

                    if (iconSlot === "up") {
                        if (isSelected) {
                            iconSvgContent = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" style="display: block;">' +
                                '<path fill-rule="evenodd" clip-rule="evenodd" d="M2.00016 13.9997C1.63197 13.9997 1.3335 13.7012 1.3335 13.333V7.99967C1.3335 7.63148 1.63197 7.33301 2.00016 7.33301H4.66683C6.00016 6.44412 6.66683 4.44412 6.66683 3.33301C6.66683 1.99967 7.66683 1.33301 8.66683 1.33301C9.66683 1.33301 10.6668 1.99967 10.6668 3.33301V5.99967H14.0002C14.3684 5.99967 14.6668 6.29815 14.6668 6.66634V13.9997C14.6668 14.3679 14.3684 14.6663 14.0002 14.6663H7.09353C7.03159 14.6663 6.96995 14.6577 6.91038 14.6407L4.66683 13.9997H2.00016ZM8.66683 2.66634C8.24552 2.66634 8.00016 2.88443 8.00016 3.33301C8.00016 4.74359 7.29589 6.97695 6.00016 8.01021V12.9939L7.1869 13.333H13.3335V7.33301H10.6668C9.93045 7.33301 9.3335 6.73605 9.3335 5.99967V3.33301C9.3335 2.88443 9.08814 2.66634 8.66683 2.66634Z" fill="#37A500"/>' +
                                '</svg>';
                        } else {
                            iconSvgContent = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="20" viewBox="0 0 16 20" fill="none" style="display: block;">' +
                                '<path fill-rule="evenodd" clip-rule="evenodd" d="M2.00016 13.9997C1.63197 13.9997 1.3335 13.7012 1.3335 13.333V7.99967C1.3335 7.63148 1.63197 7.33301 2.00016 7.33301H4.66683C6.00016 6.44412 6.66683 4.44412 6.66683 3.33301C6.66683 1.99967 7.66683 1.33301 8.66683 1.33301C9.66683 1.33301 10.6668 1.99967 10.6668 3.33301V5.99967H14.0002C14.3684 5.99967 14.6668 6.29815 14.6668 6.66634V13.9997C14.6668 14.3679 14.3684 14.6663 14.0002 14.6663H7.09353C7.03159 14.6663 6.96995 14.6577 6.91038 14.6407L4.66683 13.9997H2.00016ZM8.66683 2.66634C8.24552 2.66634 8.00016 2.88443 8.00016 3.33301C8.00016 4.74359 7.29589 6.97695 6.00016 8.01021V12.9939L7.1869 13.333H13.3335V7.33301H10.6668C9.93045 7.33301 9.3335 6.73605 9.3335 5.99967V3.33301C9.3335 2.88443 9.08814 2.66634 8.66683 2.66634Z" fill="#4D5B70"/>' +
                                '</svg>';
                        }
                    } else if (iconSlot === "down") {
                        if (isSelected) {
                            iconSvgContent = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" style="display: block;">' +
                                '<path fill-rule="evenodd" clip-rule="evenodd" d="M2.00016 2.00033C1.63197 2.00033 1.3335 2.2988 1.3335 2.66699V8.00033C1.3335 8.36852 1.63197 8.66699 2.00016 8.66699H4.66683C6.00016 9.55588 6.66683 11.5559 6.66683 12.667C6.66683 14.0003 7.66683 14.667 8.66683 14.667C9.66683 14.667 10.6668 14.0003 10.6668 12.667V10.0003H14.0002C14.3684 10.0003 14.6668 9.70185 14.6668 9.33366V2.00033C14.6668 1.63214 14.3684 1.33366 14.0002 1.33366H7.09353C7.03159 1.33366 6.96995 1.34229 6.91038 1.35931L4.66683 2.00033H2.00016ZM8.66683 13.3337C8.24552 13.3337 8.00016 13.1156 8.00016 12.667C8.00016 11.2564 7.29589 9.02305 6.00016 7.98979V3.00606L7.1869 2.66699H13.3335V8.66699H10.6668C9.93045 8.66699 9.3335 9.26395 9.3335 10.0003V12.667C9.3335 13.1156 9.08814 13.3337 8.66683 13.3337Z" fill="#CA4500"/>' +
                                '</svg>';
                        } else {
                            iconSvgContent = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="20" viewBox="0 0 16 20" fill="none" style="display: block;">' +
                                '<path fill-rule="evenodd" clip-rule="evenodd" d="M2.00016 2.00033C1.63197 2.00033 1.3335 2.2988 1.3335 2.66699V8.00033C1.3335 8.36852 1.63197 8.66699 2.00016 8.66699H4.66683C6.00016 9.55588 6.66683 11.5559 6.66683 12.667C6.66683 14.0003 7.66683 14.667 8.66683 14.667C9.66683 14.667 10.6668 14.0003 10.6668 12.667V10.0003H14.0002C14.3684 10.0003 14.6668 9.70185 14.6668 9.33366V2.00033C14.6668 1.63214 14.3684 1.33366 14.0002 1.33366H7.09353C7.03159 1.33366 6.96995 1.34229 6.91038 1.35931L4.66683 2.00033H2.00016ZM8.66683 13.3337C8.24552 13.3337 8.00016 13.1156 8.00016 12.667C8.00016 11.2564 7.29589 9.02305 6.00016 7.98979V3.00606L7.1869 2.66699H13.3335V8.66699H10.6668C9.93045 8.66699 9.3335 9.26395 9.3335 10.0003V12.667C9.3335 13.1156 9.08814 13.3337 8.66683 13.3337Z" fill="#4D5B70"/>' +
                                '</svg>';

                    }

                    var disabled = Number(item.selectedResponseActionIdx) >= 0 ? " disabled" : "";

                    messageHtml +=
                        '<button class="tcxxxx-response-btn' +

                        label +
                        '" data-response-message-id="' +

                        '" data-response-idx="' +
                        action.idx +
                        '" aria-label="' +
                        label +
                        '"' +
                        disabled +
                        '>' +

                        iconSlot +

            messageHtml += "</div>";
