<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <!-- Sin esto un movil real renderiza el preview a 980px y lo escala: las media
         queries de abajo no dispararian nunca. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preview local · bot /felicitaciones</title>
    <style>
        :root {
            color-scheme: light;
            --ui-bg: #0f172a;
            --ui-panel: #1e293b;
            --ui-line: #334155;
            --ui-text: #e2e8f0;
            --ui-dim: #94a3b8;
            --ui-accent: #38bdf8;
            --ui-warn: #fbbf24;
            --ui-err: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            /* 100dvh y no 100vh: en los moviles la barra de direcciones se retrae
               y con 100vh el preview queda cortado. */
            height: 100dvh;
            overflow: hidden;
            font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
            background: var(--ui-bg);
            color: var(--ui-text);
        }

        /* ====================================================================
           El header NO ocupa alto (Marco, 2026-09-11). El preview existe para
           ver el bot como se vera de verdad, y una barra siempre visible le
           roba pantalla -sobre todo en movil, donde el bot es pantalla
           completa-. Asi que flota por encima y esta oculto por defecto.

           Se muestra de cuatro maneras, y las cuatro conviven:
             - el mouse entra en los 12px de arriba (#hotzone, desktop);
             - el mouse esta sobre el propio header, para que no se escape
               mientras se va a apretar un boton;
             - algo adentro tiene el foco, para que funcione con teclado;
             - esta fijado con el tirador o con la tecla H (clase .fijo), que
               es la unica via en movil, donde no hay hover.
           ==================================================================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--ui-panel);
            border-bottom: 1px solid var(--ui-line);
            flex-wrap: wrap;
            /* Hueco para el tirador, que va por encima y taparia el primer boton. */
            padding-left: 52px;
            transform: translateY(-100%);
            transition: transform .18s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
        }

        #hotzone {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 12px;
            z-index: 29;
        }

        #hotzone:hover+header,
        header:hover,
        header:focus-within,
        header.fijo {
            transform: translateY(0);
        }

        /* Tirador: lo unico que queda siempre a la vista. Chico y translucido
           para no taparle nada al bot, arriba a la IZQUIERDA porque el launcher
           del bot vive abajo a la derecha. */
        #btn-header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 31;
            padding: 2px 8px 3px;
            border: 0;
            border-right: 1px solid var(--ui-line);
            border-bottom: 1px solid var(--ui-line);
            border-radius: 0 0 8px 0;
            background: rgba(30, 41, 59, .72);
            color: var(--ui-dim);
            font-size: 11px;
            line-height: 1.4;
            opacity: .55;
            transition: opacity .15s ease;
        }

        #btn-header:hover,
        #btn-header:focus-visible {
            opacity: 1;
            color: var(--ui-text);
        }

        header.fijo~#btn-header {
            opacity: 1;
        }

        /* Punto de actividad: destella cuando el bot se reinyecta, para que se
           note que hubo recarga sin tener que abrir el header. */
        #btn-header .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ui-line);
            vertical-align: middle;
            margin-left: 5px;
        }

        #btn-header.activo .dot {
            background: var(--ui-accent);
            box-shadow: 0 0 6px var(--ui-accent);
        }

        header .sep {
            width: 1px;
            height: 20px;
            background: var(--ui-line);
            margin: 0 4px;
        }

        header .title {
            font-weight: 700;
            color: var(--ui-accent);
            margin-right: 4px;
        }

        button {
            font: inherit;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--ui-line);
            background: #0b1220;
            color: var(--ui-text);
            cursor: pointer;
        }

        button:hover {
            border-color: var(--ui-accent);
        }

        button[aria-pressed="true"] {
            background: var(--ui-accent);
            border-color: var(--ui-accent);
            color: #06131f;
            font-weight: 700;
        }

        #status {
            margin-left: auto;
            color: var(--ui-dim);
        }

        #status b {
            color: var(--ui-accent);
        }

        /* main ocupa el alto completo: el header flota encima y no descuenta nada. */
        main {
            display: grid;
            grid-template-columns: 1fr 380px;
            height: 100dvh;
            min-height: 0;
        }

        /* Panel lateral plegable tambien en desktop, con el mismo boton que en
           movil: sin el, el bot nunca llega a ocupar la pantalla entera. */
        main.sin-panel {
            grid-template-columns: 1fr;
        }

        main.sin-panel>#panel {
            display: none;
        }

        /* El iframe va a ras, sin marco: ni damero, ni sombra, ni borde redondeado
           (Marco, 2026-09-11). Se conserva el iframe porque es lo que le da al bot
           un ancho propio -su matchMedia("(max-width: 768px)") reacciona al ancho
           del iframe, no al de la ventana- y ademas lo aisla del CSS del preview.
           NO se carga la pagina real de /felicitaciones: eso dispararia los pixeles
           de tracking de BCP/Adobe/Meta. */
        #frame {
            border: 0;
            background: #fff;
            width: 100%;
            height: 100%;
            transition: width .2s ease;
            justify-self: center;
        }

        #frame.movil {
            width: 390px;
            max-width: 100%;
        }

        aside {
            border-left: 1px solid var(--ui-line);
            background: var(--ui-panel);
            display: grid;
            grid-template-rows: auto auto 1fr auto 1fr;
            min-height: 0;
        }

        /* Panel de casuisticas: simula que tarjetas tiene aprobadas el usuario. */
        #casuisticas {
            padding: 8px 12px;
            border-bottom: 1px solid var(--ui-line);
        }

        #casuisticas select {
            font: inherit;
            width: 100%;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid var(--ui-line);
            background: #0b1220;
            color: var(--ui-text);
        }

        #casuisticas .resumen {
            margin-top: 6px;
            color: var(--ui-dim);
        }

        #casuisticas .resumen b {
            color: var(--ui-accent);
        }

        #tarjetas-lista {
            margin-top: 8px;
            max-height: 190px;
            overflow: auto;
            border: 1px solid var(--ui-line);
            border-radius: 6px;
            padding: 6px 8px;
        }

        #tarjetas-lista label {
            display: flex;
            gap: 6px;
            align-items: flex-start;
            padding: 2px 0;
            cursor: pointer;
            line-height: 1.35;
        }

        #tarjetas-lista label.sin-codigo {
            color: var(--ui-warn);
        }

        #tarjetas-lista input {
            margin: 3px 0 0;
        }

        #tarjetas-lista .cod {
            color: var(--ui-dim);
        }

        aside h2 {
            margin: 0;
            padding: 8px 12px;
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--ui-dim);
            border-bottom: 1px solid var(--ui-line);
            border-top: 1px solid var(--ui-line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        aside h2 button {
            padding: 2px 8px;
            font-size: 11px;
        }

        .log {
            overflow: auto;
            padding: 8px 12px;
            min-height: 0;
        }

        .log:empty::after {
            content: "sin registros";
            color: var(--ui-dim);
            font-style: italic;
        }

        .ev {
            padding: 6px 0;
            border-bottom: 1px dashed var(--ui-line);
            word-break: break-word;
        }

        .ev--pagina {
            border-left: 2px solid var(--ui-warn);
            padding-left: 8px;
        }

        .ev .tag {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--ui-warn);
            border: 1px solid var(--ui-warn);
            border-radius: 3px;
            padding: 0 4px;
            margin-left: 4px;
        }

        .ev .k {
            color: var(--ui-accent);
        }

        .ev .n {
            color: var(--ui-text);
        }

        .ev .m {
            color: var(--ui-dim);
        }

        .ln {
            padding: 3px 0;
            border-bottom: 1px dashed var(--ui-line);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ln.error {
            color: var(--ui-err);
        }

        .ln.warn {
            color: var(--ui-warn);
        }

        .ln.debug {
            color: var(--ui-dim);
        }

        /* El backdrop solo existe en pantalla angosta. El boton del panel se
           muestra siempre: en ancho pliega la columna, en angosto la desliza. */
        #backdrop {
            display: none;
        }

        /* ====================================================================
           Responsive. El corte es 900px porque abajo de eso el iframe se queda
           con menos que los 390px que mide el bot en movil: la columna de 380px
           del panel deja de caber al lado.
           ==================================================================== */
        @media (max-width: 900px) {

            /* Sin hover la franja no aporta, y taparia la X del bot, que en esta
               vista ocupa la pantalla entera. Aqui el header se abre con el
               tirador. */
            #hotzone {
                display: none;
            }

            header {
                padding: 8px 8px 8px 52px;
                gap: 6px;
            }

            header .title {
                /* El titulo cede primero: los botones son lo util. */
                font-size: 11px;
                order: 10;
                flex-basis: 100%;
                margin: 0;
            }

            .solo-ancho {
                display: none;
            }

            #status {
                font-size: 11px;
            }

            main {
                /* Una sola columna: el iframe se queda con todo el alto. */
                grid-template-columns: 1fr;
            }

            #frame {
                /* En movil real el ancho ya es el real: el modo 390px no aplica. */
                width: 100%;
            }

            /* El panel pasa a off-canvas sobre el contenido, oculto por defecto. */
            #panel {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                width: min(90vw, 380px);
                z-index: 20;
                transform: translateX(100%);
                transition: transform .2s ease;
                box-shadow: -8px 0 24px rgba(0, 0, 0, .5);
                overflow: auto;
                /* Sin 1fr: al scrollear, las filas se miden por su contenido. */
                grid-template-rows: auto auto auto auto auto;
            }

            #panel.abierto {
                transform: translateX(0);
            }

            #panel .log {
                max-height: 40vh;
            }

            #backdrop {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 19;
                background: rgba(0, 0, 0, .5);
            }

            #backdrop[hidden] {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            #panel,
            #frame {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <!-- Franja sensible: el header aparece al acercar el mouse al borde de arriba.
         Va ANTES del header porque el CSS los relaciona con el combinador "+". -->
    <div id="hotzone"></div>

    <header id="ui-header">
        <button id="btn-panel" aria-expanded="false" aria-controls="panel">☰ panel</button>
        <span class="title">preview · bot /felicitaciones</span>
        <button id="btn-reload">Reiniciar bot</button>
        <span class="sep"></span>
        <!-- El toggle de ancho solo tiene sentido en una ventana ancha: en un movil
             real el ancho ya es el de verdad, asi que se oculta por media query. -->
        <span class="solo-ancho">
            <button id="btn-desktop" aria-pressed="true">Desktop</button>
            <button id="btn-movil" aria-pressed="false">Móvil 390px</button>
            <span class="sep"></span>
        </span>
        <button id="btn-auto" aria-pressed="true">Auto-recarga</button>
        <span class="sep"></span>
        <!-- Simula la pantalla de sesion expirada de la pagina. Con ella puesta el
             bot tiene que retirarse solo, y volver al quitarla. -->
        <button id="btn-sesion" aria-pressed="false">Sesión expirada</button>
        <span id="status">esperando…</span>
    </header>

    <button id="btn-header" type="button" aria-pressed="false" aria-controls="ui-header"
        title="Mostrar u ocultar la barra (tecla H)">≡<span class="dot"></span></button>

    <div id="backdrop" hidden></div>

    <main>
        <iframe id="frame" title="bot"></iframe>
        <aside id="panel">
            <h2>casuística · tarjetas del usuario</h2>
            <div id="casuisticas">
                <select id="preset"></select>
                <div class="resumen" id="resumen-leads">—</div>
                <div id="tarjetas-lista"></div>
            </div>
            <h2>digitalData <button id="btn-clear-ev">limpiar</button></h2>
            <div class="log" id="eventos"></div>
            <h2>consola <button id="btn-clear-log">limpiar</button></h2>
            <div class="log" id="consola"></div>
        </aside>
    </main>

    <script>
        (function () {
            "use strict";

            // Unica fuente de verdad: el snippet se lee del archivo en cada carga.
            // El preview vive en preview/, la oferta del piloto en adobe-target/.
            // La ruta es relativa a este archivo y funciona igual servida por
            // python3 -m http.server que publicada en Netlify.
            var variante = new URLSearchParams(window.location.search).get("variante");
            var ARCHIVO_BOT = variante === "premium-black-infinite"
                ? "../adobe-target/variantes/premium-black-infinite/bot.html"
                : "../adobe-target/piloto/bot.html";
            var INTERVALO_POLL = 1000;

            // Design tokens exactamente como los define /felicitaciones.
            // --on-text, --on-white y --state-success NO estan definidos en esa pagina:
            // se omiten a proposito para que el bot caiga en sus fallbacks, igual que en real.
            var TOKENS = [
                '--background-100: #d8dfea',
                '--bcp-font-family-primary-regular: "Flexo-Regular"',
                '--onsurface-050: #eff0f2',
                '--onsurface-100: #e5e7eb',
                '--primary-040: #ebf4ff',
                '--primary-100: #b3d6ff',
                '--primary-400: #0a47f0',
                '--secondary-700: #ca4500'
            ].join(";");

            // Fuentes Flexo, SOLO para el preview local. No van en el snippet:
            // en produccion la tipografia la hereda de la pagina anfitriona.
            // El bot solo usa la familia "Flexo-Regular" con pesos 600 y 700, asi que
            // se mapean Demi->600 y Bold->700 y se evitan las negritas sinteticas.
            var FUENTES = [
                ["Flexo-Regular", 400, "Flexo-Regular-webfont.woff2"],
                ["Flexo-Regular", 600, "Flexo-Demi-webfont.woff2"],
                ["Flexo-Regular", 700, "Flexo-Bold-webfont.woff2"],
                ["Flexo-Demi", 400, "Flexo-Demi-webfont.woff2"],
                ["Flexo-Bold", 400, "Flexo-Bold-webfont.woff2"]
            ].map(function (f) {
                // URL absoluta: el iframe es about:blank y no resuelve rutas relativas.
                var url = new URL("fonts/" + f[2], location.href).href;
                return '@font-face{font-family:"' + f[0] + '";font-weight:' + f[1] +
                    ';font-style:normal;font-display:swap;' +
                    'src:url("' + url + '") format("woff2")}';
            }).join("");

            // Casuisticas: que tarjetas tiene aprobadas el usuario.
            // En vez de parchear al bot, se le fabrica el MISMO DOM que publica
            // /felicitaciones -un <xt21-card-option> por tarjeta, con el codigo en el
            // src de la imagen y en el name del boton-, para que corra su deteccion
            // real. El src apunta a una ruta local que da 404 a proposito: no se
            // carga nada del CDN del BCP.
            // No hay preset "produccion" ni "certi" a proposito (Marco, 2026-09-10):
            // esos dos snapshots se entregaron solo para comprobar que el DOM no
            // cambia entre entornos y que la deteccion aguanta, no son escenarios de
            // prueba. Los escenarios son los de abajo mas "Personalizado".
            var PRESETS = [
                { id: "con-oro", nombre: "Con Visa Oro · 3 + destacada", codigos: ["TCRINF", "TCRPL1", "AMXGRE", "TCRORL", "TCRCLL"] },
                { id: "sin-oro", nombre: "Sin Visa Oro · solo 3", codigos: ["TCRINF", "TCRPL1", "AMXGRE", "TCRPLL"] },
                { id: "una-millas", nombre: "Una sola de millas", codigos: ["TCRCLL"] },
                { id: "caso-b", nombre: "Sin millas · caso B", codigos: ["TCRLY1", "TCRLY2", "TCRLY3", "TCRLY5", "TCRMIN"] },
                { id: "caso-b-corto", nombre: "Sin millas · solo 2 Qore", codigos: ["TCRLY3", "TCRMIN"] },
                { id: "vacio", nombre: "Ninguna detectada (falla el selector)", codigos: [] }
            ];

            var seleccion = PRESETS[0].codigos.slice();
            var catalogo = { tarjetas: [], criterios: [] };

            var frame = document.getElementById("frame");
            var status = document.getElementById("status");
            var elEventos = document.getElementById("eventos");
            var elConsola = document.getElementById("consola");

            var ultimoTexto = null;
            var autoRecarga = true;

            function ahora() {
                return new Date().toLocaleTimeString("es-PE", { hour12: false });
            }

            // El panel muestra dos origenes y hay que poder distinguirlos de un
            // vistazo: los del BOT, que son los seis que emite el snippet, y los de
            // la PAGINA, que dispara /felicitaciones por su cuenta al accionar el
            // boton nativo de una tarjeta. El bot no emite estos ultimos y no debe:
            // contarian dos veces el mismo click.
            function pintarEvento(payload, origen) {
                var ev = (payload && payload.event) || "";
                var div = document.createElement("div");
                div.className = "ev" + (origen === "pagina" ? " ev--pagina" : "");

                var cuerpo = "";
                if (payload && payload.promotion) {
                    var p = payload.promotion;
                    cuerpo = '<span class="n">' + esc(p.name) + '</span><br>' +
                        '<span class="m">creative: ' + esc(p.creative) +
                        ' · position: ' + esc(p.position) + '</span>';
                } else if (payload && payload.action) {
                    var a = payload.action;
                    cuerpo = '<span class="n">' + esc(a.label) + '</span><br>' +
                        '<span class="m">category: ' + esc(a.category) +
                        ' · group: ' + esc(a.group) + ' · name: ' + esc(a.name) + '</span>';
                } else if (payload && payload.metadataList) {
                    cuerpo = '<span class="m">' + payload.metadataList.map(function (it) {
                        return esc(it.key) + ": <span class=\"n\">" + esc(it.value) + "</span>";
                    }).join("<br>") + '</span>';
                } else if (payload && payload.popup) {
                    cuerpo = '<span class="n">' + esc(payload.popup.name) + '</span>';
                }

                div.innerHTML =
                    '<span class="m">' + ahora() + '</span> ' +
                    '<span class="k">' + esc(ev) + '</span>' +
                    (origen === "pagina" ? ' <span class="tag">página</span>' : "") +
                    '<br>' + cuerpo;
                elEventos.appendChild(div);
                elEventos.scrollTop = elEventos.scrollHeight;
            }

            function pintarLog(nivel, args) {
                var div = document.createElement("div");
                div.className = "ln " + nivel;
                div.textContent = "[" + ahora() + "] " + args.map(function (a) {
                    if (typeof a === "string") return a;
                    try { return JSON.stringify(a); } catch (e) { return String(a); }
                }).join(" ");
                elConsola.appendChild(div);
                elConsola.scrollTop = elConsola.scrollHeight;
            }

            function esc(v) {
                return String(v === undefined ? "" : v)
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            // Busca el hook window.tcXXXXCatalogo sin depender del namespace. Hoy es
            // tc0091Catalogo (el codigo se asigno el 2026-09-11), pero la busqueda
            // queda generica para que el harness sobreviva a un cambio de codigo.
            //
            // El harness ya no usa tcXXXXSetMode: el boton "Modo: chat / slides" se
            // quito el 2026-09-10 por pedido de Marco. El bot se entrega en modo chat
            // y el modo slides no es un estado que el usuario final pueda ver, asi
            // que como palanca de preview solo confundia.
            function hallarHook(win, sufijo) {
                var re = new RegExp("^tc.*" + sufijo + "$", "i");
                for (var k in win) {
                    if (re.test(k) && typeof win[k] === "function") return win[k];
                }
                return null;
            }

            // Inyecta las tarjetas falsas replicando el markup real de la pagina.
            function pintarLeads(doc) {
                var cont = doc.getElementById("leads-simulados");
                if (!cont) {
                    cont = doc.createElement("div");
                    cont.id = "leads-simulados";
                    cont.style.display = "none";
                    doc.body.appendChild(cont);
                }

                // El saludo del bot lleva el nombre del cliente, que lee de la pagina
                // (Marco, 2026-09-22). Sin esto el preview mostraria siempre el saludo
                // sin personalizar y no habria forma de revisar la personalizacion.
                //
                // El nombre es INVENTADO a proposito. Los snapshots de
                // referencia/paginas/ traen nombres de clientes reales y por eso no se
                // publican; el preview si se publica en Netlify, asi que aqui nunca
                // puede aparecer un dato real.
                var nombreFalso = "Marco";
                cont.innerHTML =
                    '<h2>&iexcl;Felicidades, ' + nombreFalso + '! Estas son tus tarjetas aprobadas</h2>' +
                    '<div id="profitType" data-client-name="' + nombreFalso.toUpperCase() + ' PRUEBA DEMO"></div>';

                // El <button> de adentro replica la estructura real: en la pagina el
                // <bcp-button> de Angular envuelve un <button> nativo. Hace falta
                // porque el CTA "Elegir tarjeta" del bot NO navega: le da click a ese
                // boton. Sin el no habria forma de comprobar aqui que funciona.
                cont.innerHTML += seleccion.map(function (codigo) {
                    return '<xt21-card-option>' +
                        '<img alt="" src="/assets/images/congratulations/img/' + codigo + '.svg">' +
                        '<bcp-button name="QA_Congratulations_BtnSeleccionar_' + codigo + '">' +
                        '<button type="button" data-codigo-simulado="' + codigo + '"></button>' +
                        '</bcp-button>' +
                        '</xt21-card-option>';
                }).join("");

                // Al accionar este boton, /felicitaciones emite TRES eventos por su
                // cuenta (verificados en certi el 2026-09-11). Se replican aqui para
                // que el panel muestre la secuencia completa que vera analytics, no
                // solo la mitad que emite el bot.
                //
                // OJO: los emite la PAGINA, no el bot. El snippet no los empuja y no
                // debe: contarian dos veces el mismo click. Por eso van marcados como
                // "página" en el panel.
                cont.querySelectorAll("[data-codigo-simulado]").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        var codigo = this.getAttribute("data-codigo-simulado");

                        pintarLog("info", [
                            "[preview] click en el boton nativo de " + codigo +
                            " — en la pagina real esto abre el modal de linea de credito"
                        ]);

                        eventosDeLaPagina(codigo).forEach(function (p) {
                            pintarEvento(p, "pagina");
                        });

                        abrirModalLineaSimulado(doc, codigo);
                    });
                });
            }

            // El cuadro "Edita tu linea de credito" que la pagina abre al elegir una
            // tarjeta. Se simula para poder revisar dos cosas que si no serian
            // invisibles aqui: que el bot NO se encima a el, y que al reabrir el bot
            // este cuadro se cierra solo (Marco, 2026-09-22).
            //
            // Es una IMITACION del cuadro de la pagina, igual que las <xt21-card-option>.
            // El bot no lo crea ni debe crearlo.
            //
            // La estructura reproduce el DOM REAL que Marco entrego el 2026-09-22, y
            // los tres detalles que importan son:
            //   - el host es <bcp-modal>, generico, con is-open y la clase "show":
            //     Angular lo ALTERNA, no lo saca del DOM;
            //   - lo que identifica a ESTE modal es <section class="modify-credit-line-modal">;
            //   - los botones van en una section HERMANA, no dentro de ella, y
            //     "Cerrar" es el tier="secondary".
            // Si esto se simplifica, deja de probar lo que el bot realmente busca.
            function abrirModalLineaSimulado(doc, codigo) {
                var previo = doc.querySelector("bcp-modal.simulado-linea");
                if (previo) previo.parentNode.removeChild(previo);

                var modal = doc.createElement("bcp-modal");
                modal.className = "simulado-linea dialog-backdrop bcp-ffw-fade hydrated show";
                modal.setAttribute("is-open", "");
                modal.setAttribute("tag", "tagPopup");
                modal.setAttribute("style", [
                    "position:fixed", "inset:0", "z-index:7001",
                    "background:rgba(0,0,0,.45)", "display:flex",
                    "align-items:center", "justify-content:center"
                ].join(";"));
                modal.innerHTML =
                    '<div class="bcp-ffw-modal-content" style="background:#fff;border-radius:16px;' +
                    'padding:24px;width:min(340px,86vw);font-family:inherit;box-shadow:0 8px 30px rgba(0,0,0,.25)">' +
                    '<div class="body-content">' +
                    '<section class="modify-credit-line-modal">' +
                    '<h3 style="margin:0 0 8px;font-size:16px">Ahora puedes editar tu línea de crédito</h3>' +
                    '<p style="margin:0 0 16px;font-size:13px;color:#527094">' + codigo + ' · simulación del preview</p>' +
                    "</section>" +
                    '<section class="modify-credit-line-modal__buttons" style="display:flex;gap:8px;justify-content:flex-end">' +
                    '<div><bcp-button tier="secondary"><button type="button">Cerrar</button></bcp-button></div>' +
                    '<div><bcp-button tier="primary"><button type="button">Continuar</button></bcp-button></div>' +
                    "</section></div></div>";
                doc.body.appendChild(modal);

                // La pagina real alterna el modal; aqui se saca del DOM, que es el
                // caso que el bot tambien tiene que tolerar.
                modal.querySelector('bcp-button[tier="secondary"] button').addEventListener("click", function () {
                    modal.parentNode.removeChild(modal);
                    pintarLog("info", ["[preview] se cerro el modal de linea de credito"]);
                });
            }

            // Valores exactos del campo "tarjetaseleccionada", segun la lista oficial
            // de tags que entrego Marco el 2026-09-11. NO derivan del catalogo del
            // bot: los escribe el modelo de datos de la pagina, con el "BCP" metido
            // antes del programa y sin tildes ("Clasica"). Verbatim, no normalizar.
            //
            // La lista trae 15 nombres. Faltan dos tarjetas del catalogo del bot:
            // Visa Infinite Qore (TCRLY1) y la Visa Clasica pelada, que ademas sigue
            // sin codigo. Si una de esas se elige, el preview cae al codigo.
            var NOMBRE_EN_TAG = {
                AMXGRE: "American Express Black BCP LATAM Pass",
                AMXCLL: "American Express Clasica BCP LATAM Pass",
                AMXGLL: "American Express Oro BCP LATAM Pass",
                AMXPLL: "American Express Platinum BCP LATAM Pass",
                TCRCLL: "Visa Clasica BCP LATAM Pass",
                TCRLY5: "Visa Clasica BCP Qore",
                TCRINF: "Visa Infinite Iridium BCP LATAM Pass",
                TCRBA7: "Visa Infinite Sapphire BCP LATAM Pass",
                TCRMIN: "Visa Light BCP",
                TCRORL: "Visa Oro BCP LATAM Pass",
                TCRLY3: "Visa Oro BCP Qore",
                TCRPLL: "Visa Platinum BCP LATAM Pass",
                TCRLY4: "Visa Platinum BCP Qore",
                TCRPL1: "Visa Signature BCP LATAM Pass",
                TCRLY2: "Visa Signature BCP Qore"
            };

            // Los tres eventos tal cual los emite /felicitaciones al accionar el boton
            // nativo. El bot no los empuja: los imita el harness.
            function eventosDeLaPagina(codigo) {
                var nombre = NOMBRE_EN_TAG[codigo] || codigo;

                return [
                    {
                        event: "trackAction",
                        action: {
                            category: "Opciones Tarjeta",
                            group: "Cards",
                            label: "Quiero esta Tarjeta",
                            name: "Click"
                        }
                    },
                    {
                        event: "trackMetadataList",
                        metadataList: [
                            { key: "TarjetaSeleccionada", value: nombre },
                            { key: "Flujo", value: "Flujo Normal" }
                        ]
                    },
                    {
                        event: "trackPopup",
                        popup: { name: "Cards - Edita tu linea de credito" }
                    }
                ];
            }

            // El listado de tarjetas sale del propio bot (config.perfilador), asi que
            // se llena solo a medida que se van agregando pantallas del perfilador.
            function refrescarCatalogo(intentos) {
                var hook = hallarHook(frame.contentWindow, "Catalogo");
                var datos = hook ? hook() : null;

                if ((!datos || !datos.tarjetas.length) && (intentos || 0) < 20) {
                    setTimeout(function () { refrescarCatalogo((intentos || 0) + 1); }, 200);
                    return;
                }

                catalogo = datos || { tarjetas: [], criterios: [] };
                pintarListaTarjetas();
                pintarResumen();
            }

            function pintarListaTarjetas() {
                var cont = document.getElementById("tarjetas-lista");

                if (!catalogo.tarjetas.length) {
                    cont.innerHTML = '<span style="color:var(--ui-dim)">el bot todavía no declara tarjetas</span>';
                    return;
                }

                cont.innerHTML = catalogo.tarjetas.map(function (t, i) {
                    var detectable = !!t.codigo;
                    var marcada = detectable && seleccion.indexOf(t.codigo) > -1;
                    return '<label class="' + (detectable ? "" : "sin-codigo") + '" title="' +
                        (detectable ? "caso " + t.caso : "sin código: el bot no puede detectarla") + '">' +
                        '<input type="checkbox" data-i="' + i + '"' +
                        (marcada ? " checked" : "") + (detectable ? "" : " disabled") + '>' +
                        '<span>' + esc(t.nombre) +
                        ' <span class="cod">' + (t.codigo || "sin código") + ' · ' + t.caso + '</span></span>' +
                        '</label>';
                }).join("");

                cont.querySelectorAll("input[data-i]").forEach(function (input) {
                    input.onchange = function () {
                        var t = catalogo.tarjetas[Number(this.getAttribute("data-i"))];
                        var pos = seleccion.indexOf(t.codigo);
                        if (this.checked && pos === -1) seleccion.push(t.codigo);
                        if (!this.checked && pos > -1) seleccion.splice(pos, 1);
                        document.getElementById("preset").value = "custom";
                        inyectar();
                    };
                });
            }

            // Que caso resuelve cada criterio. Se calcula por criterio y no una vez:
            // la misma tarjeta puede ser caso A en uno y caso B en otro.
            function pintarResumen() {
                var el = document.getElementById("resumen-leads");

                if (!seleccion.length) {
                    el.innerHTML = "0 tarjetas · <b>sin detección → cae al caso A completo</b>";
                    return;
                }

                var porCriterio = catalogo.casoAPorCriterio || {};
                var detalle = (catalogo.criterios || []).map(function (id) {
                    var enCasoA = (porCriterio[id] || []).some(function (codigo) {
                        return seleccion.indexOf(codigo) > -1;
                    });
                    return esc(id) + " <b>" + (enCasoA ? "A" : "B") + "</b>";
                }).join(" · ");

                el.innerHTML = seleccion.length + " tarjeta(s)<br>" + (detalle || "—");
            }

            function pintarPresets() {
                var sel = document.getElementById("preset");
                sel.innerHTML = PRESETS.map(function (p) {
                    return '<option value="' + p.id + '">' + esc(p.nombre) +
                        ' (' + p.codigos.length + ')</option>';
                }).join("") + '<option value="custom">Personalizado</option>';

                sel.onchange = function () {
                    var p = PRESETS.filter(function (x) { return x.id === this.value; }, this)[0];
                    if (!p) return;
                    seleccion = p.codigos.slice();
                    inyectar();
                };
            }

            async function inyectar() {
                var texto;
                try {
                    var res = await fetch(ARCHIVO_BOT + "?t=" + Date.now(), { cache: "no-store" });
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    texto = await res.text();
                } catch (e) {
                    status.innerHTML = '<b style="color:#f87171">error</b> leyendo ' + ARCHIVO_BOT + ': ' + e.message;
                    return;
                }

                ultimoTexto = texto;

                var doc = frame.contentDocument;
                doc.open();
                doc.write('<!doctype html><html lang="es"><head><meta charset="utf-8">' +
                    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
                    '<style>' + FUENTES + ':root{' + TOKENS + '}' +
                    'html,body{margin:0;height:100%}' +
                    'body{background:#f7f9fc;font-family:var(--bcp-font-family-primary-regular),sans-serif}' +
                    '</style></head><body></body></html>');
                doc.close();

                // El documento del iframe se rehace entero, asi que la pantalla de
                // sesion expirada se fue con el: hay que devolver el boton a su sitio
                // o quedaria marcado sin que la pantalla este puesta.
                sesionCaida = false;
                document.getElementById("btn-sesion").setAttribute("aria-pressed", "false");

                // Las tarjetas del usuario tienen que existir ANTES de que corra el
                // snippet, igual que en la pagina real.
                pintarLeads(doc);

                var win = frame.contentWindow;

                // Captura de analytics: el bot empuja a window.digitalData.
                win.digitalData = [];
                var pushOriginal = win.digitalData.push.bind(win.digitalData);
                win.digitalData.push = function () {
                    Array.prototype.forEach.call(arguments, pintarEvento);
                    return pushOriginal.apply(null, arguments);
                };

                // Captura de consola: aqui aparecen los errores de validateGraph.
                ["error", "warn", "debug", "log"].forEach(function (nivel) {
                    var orig = win.console[nivel];
                    win.console[nivel] = function () {
                        pintarLog(nivel, Array.prototype.slice.call(arguments));
                        if (orig) orig.apply(win.console, arguments);
                    };
                });

                // La oferta es una sola etiqueta <script> (antes eran tres
                // bloques: <style>, markup y script). Los scripts insertados via
                // innerHTML no se ejecutan, hay que recrearlos. El bucle sobre
                // el resto de nodos se deja igual: no cuesta nada y no depende
                // de que la oferta traiga o no markup suelto.
                var cont = doc.createElement("div");
                cont.innerHTML = texto;

                var scripts = Array.prototype.slice.call(cont.querySelectorAll("script"));
                scripts.forEach(function (s) { s.parentNode.removeChild(s); });

                while (cont.firstChild) doc.body.appendChild(cont.firstChild);

                scripts.forEach(function (viejo) {
                    var nuevo = doc.createElement("script");
                    nuevo.textContent = viejo.textContent;
                    doc.body.appendChild(nuevo);
                });

                status.innerHTML = 'cargado <b>' + ahora() + '</b> · ' + (texto.length / 1024).toFixed(1) + ' KB';
                senalarActividad();
                refrescarCatalogo(0);
            }

            async function revisarCambios() {
                if (!autoRecarga) return;
                try {
                    var res = await fetch(ARCHIVO_BOT + "?t=" + Date.now(), { cache: "no-store" });
                    if (!res.ok) return;
                    var texto = await res.text();
                    if (ultimoTexto !== null && texto !== ultimoTexto) {
                        elEventos.innerHTML = "";
                        elConsola.innerHTML = "";
                        inyectar();
                    }
                } catch (e) { /* servidor caido: reintenta al siguiente tick */ }
            }

            document.getElementById("btn-reload").onclick = function () {
                elEventos.innerHTML = "";
                elConsola.innerHTML = "";
                inyectar();
            };
            document.getElementById("btn-clear-ev").onclick = function () { elEventos.innerHTML = ""; };
            document.getElementById("btn-clear-log").onclick = function () { elConsola.innerHTML = ""; };

            // Cuando la sesion caduca, /felicitaciones reemplaza su contenido por esta
            // plantilla. El bot tiene que retirarse solo mientras este puesta, y volver
            // al quitarla. Marco entrego el markup el 2026-09-22.
            //
            // NO aparece en ninguna captura de referencia/paginas/, justamente porque
            // el DOM solo la tiene cuando esta ocurriendo. Por eso el bot la detecta
            // por presencia.
            var sesionCaida = false;
            document.getElementById("btn-sesion").onclick = function () {
                sesionCaida = !sesionCaida;
                this.setAttribute("aria-pressed", String(sesionCaida));

                var doc = frame.contentDocument;
                if (!doc || !doc.body) return;

                var previa = doc.querySelector(".error-template-section");
                if (previa) previa.parentNode.removeChild(previa);

                if (sesionCaida) {
                    doc.body.insertAdjacentHTML("afterbegin",
                        '<section class="error-template-section" style="padding:24px;font-family:inherit">' +
                        '<p style="margin:0 0 16px;font-size:16px;font-weight:700">Tu sesión expiró</p>' +
                        '<div class="error-template-section__actions">' +
                        '<button type="button" class="bcp-ffw-btn bcp-ffw-btn-primary">' +
                        "Puedes retomar tu sesión aquí</button></div></section>");
                    pintarLog("info", ["[preview] sesión expirada: el bot debe retirarse"]);
                } else {
                    // Una mutacion cualquiera para que el observador del bot reaccione.
                    doc.body.appendChild(doc.createElement("div"));
                    pintarLog("info", ["[preview] sesión recuperada: el bot debe volver"]);
                }
            };

            document.getElementById("btn-desktop").onclick = function () {
                frame.classList.remove("movil");
                this.setAttribute("aria-pressed", "true");
                document.getElementById("btn-movil").setAttribute("aria-pressed", "false");
            };
            document.getElementById("btn-movil").onclick = function () {
                frame.classList.add("movil");
                this.setAttribute("aria-pressed", "true");
                document.getElementById("btn-desktop").setAttribute("aria-pressed", "false");
            };

            document.getElementById("btn-auto").onclick = function () {
                autoRecarga = !autoRecarga;
                this.setAttribute("aria-pressed", String(autoRecarga));
            };

            // ---- Header flotante -------------------------------------------
            // Oculto por defecto para que el bot se lleve la pantalla entera. En
            // desktop basta acercar el mouse arriba (lo resuelve el CSS); el
            // tirador y la tecla H lo dejan fijo, que es la unica via en movil.
            var header = document.getElementById("ui-header");
            var btnHeader = document.getElementById("btn-header");

            function fijarHeader(fijo) {
                header.classList.toggle("fijo", fijo);
                btnHeader.setAttribute("aria-pressed", String(fijo));
            }

            btnHeader.onclick = function () {
                fijarHeader(!header.classList.contains("fijo"));
            };

            // Destello del punto: avisa que el bot se reinyecto sin tener que
            // abrir el header para leer el "status".
            var timerDot = null;
            function senalarActividad() {
                btnHeader.classList.add("activo");
                clearTimeout(timerDot);
                timerDot = setTimeout(function () {
                    btnHeader.classList.remove("activo");
                }, 900);
            }

            // ---- Panel lateral ---------------------------------------------
            // Angosto: off-canvas sobre el contenido, con fondo oscuro detras.
            // Ancho: columna que se puede plegar, mismo boton.
            var panel = document.getElementById("panel");
            var backdrop = document.getElementById("backdrop");
            var btnPanel = document.getElementById("btn-panel");
            var elMain = document.querySelector("main");
            var mqAngosto = window.matchMedia("(max-width: 900px)");

            function panelAbierto() {
                return mqAngosto.matches
                    ? panel.classList.contains("abierto")
                    : !elMain.classList.contains("sin-panel");
            }

            function togglePanel(abrir) {
                if (mqAngosto.matches) {
                    panel.classList.toggle("abierto", abrir);
                    backdrop.hidden = !abrir;
                } else {
                    elMain.classList.toggle("sin-panel", !abrir);
                    backdrop.hidden = true;
                }
                btnPanel.setAttribute("aria-expanded", String(abrir));
            }

            btnPanel.onclick = function () { togglePanel(!panelAbierto()); };
            backdrop.onclick = function () { togglePanel(false); };

            document.addEventListener("keydown", function (e) {
                // Sin atajos mientras se escribe en un campo del preview.
                var t = e.target || {};
                var editando = /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName || "");

                if (e.key === "Escape") {
                    if (mqAngosto.matches && panel.classList.contains("abierto")) togglePanel(false);
                    else if (header.classList.contains("fijo")) fijarHeader(false);
                    return;
                }
                if (!editando && (e.key === "h" || e.key === "H")) {
                    fijarHeader(!header.classList.contains("fijo"));
                }
            });

            // Al cruzar el breakpoint se limpia el estado del otro modo: si no, el
            // backdrop queda colgado encima o el panel desaparece sin boton visible.
            mqAngosto.addEventListener("change", function (e) {
                backdrop.hidden = true;
                panel.classList.remove("abierto");
                elMain.classList.remove("sin-panel");
                btnPanel.setAttribute("aria-expanded", String(!e.matches));
            });

            // Estado inicial coherente con el ancho de arranque.
            btnPanel.setAttribute("aria-expanded", String(!mqAngosto.matches));

            if (location.protocol === "file:") {
                document.body.innerHTML =
                    '<p style="padding:24px;font:14px/1.6 system-ui;color:#e2e8f0">' +
                    'Este preview necesita un servidor local (con <code>file://</code> el navegador bloquea el fetch).<br><br>' +
                    'Levántalo con:<br><code style="color:#38bdf8">python3 -m http.server 8000</code><br><br>' +
                    'y abre <code style="color:#38bdf8">http://localhost:8000/preview/</code></p>';
                return;
            }

            pintarPresets();
            inyectar();
            setInterval(revisarCambios, INTERVALO_POLL);
        })();
    </script>
</body>

</html>
